<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BioBlitz - Exam Cram!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
:root{
  --p:#6C5CE7;--pl:#A29BFE;--s:#00CEC9;--ac:#FD79A8;--w:#FDCB6E;--ok:#00B894;--no:#E17055;
  --bg:#0F0F1A;--c1:#1A1A2E;--c2:#16213E;--tx:#F0F0F0;--txd:#888;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 20% 80%,rgba(108,92,231,.12) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(0,206,201,.08) 0%,transparent 50%);z-index:-1}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--p);border-radius:3px}

.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(26,26,46,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(108,92,231,.3);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:6px}
.logo{font-size:1.2em;font-weight:900;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stats{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:.82em;font-weight:700}
.fire{color:#FF6B6B;animation:fp .5s ease-in-out infinite alternate}
@keyframes fp{to{transform:scale(1.25)}}
.xpc{color:var(--w)}
.lvl{background:linear-gradient(135deg,var(--p),var(--ac));padding:2px 10px;border-radius:12px;font-size:.72em;color:#fff}
.lang{display:flex;background:rgba(255,255,255,.08);border-radius:16px;overflow:hidden}
.lang button{padding:5px 12px;border:none;background:0;color:var(--txd);cursor:pointer;font-weight:700;font-size:.75em;transition:.3s}
.lang button.on{background:var(--p);color:#fff}
.xpbar{width:100%;padding:0 16px 6px;background:rgba(26,26,46,.95)}
.xptrack{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.xpfill{height:100%;background:linear-gradient(90deg,var(--p),var(--s));border-radius:2px;transition:width .5s;box-shadow:0 0 8px var(--p)}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;flex-wrap:wrap}
.tab{padding:8px 14px;border:2px solid rgba(108,92,231,.25);border-radius:10px;background:var(--c1);color:var(--txd);cursor:pointer;font-weight:700;font-size:.78em;transition:.3s;white-space:nowrap;user-select:none}
.tab:hover{border-color:var(--p);color:var(--tx)}
.tab.on{background:var(--p);border-color:var(--p);color:#fff;box-shadow:0 3px 12px rgba(108,92,231,.4)}
.sec{display:none;animation:fi .35s ease}.sec.on{display:block}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* FLASHCARD */
.fcwrap{perspective:1000px;margin:16px 0;cursor:pointer}
.fc{width:100%;min-height:260px;position:relative;transition:transform .6s;transform-style:preserve-3d}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;width:100%;min-height:260px;backface-visibility:hidden;border-radius:18px;padding:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.ffront{background:linear-gradient(135deg,var(--c2),var(--c1));border:2px solid rgba(108,92,231,.35);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.fback{background:linear-gradient(135deg,#1a3a2a,#162e1e);border:2px solid rgba(0,184,148,.35);transform:rotateY(180deg);box-shadow:0 6px 24px rgba(0,0,0,.3)}
.flabel{font-size:.65em;text-transform:uppercase;letter-spacing:2px;color:var(--txd);margin-bottom:8px}
.ftxt{font-size:1.05em;font-weight:600;line-height:1.6}
.fmem{margin-top:12px;padding:10px 14px;background:rgba(253,203,110,.12);border:1px solid rgba(253,203,110,.25);border-radius:10px;font-size:.82em;color:var(--w)}
.fcnav{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.fbtn{padding:10px 22px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.85em;transition:.3s;color:#fff}
.fbtn:hover{transform:scale(1.05)}
.fbtn.ok{background:var(--ok)}.fbtn.no{background:var(--no)}.fbtn.fl{background:var(--p)}
.fccount{text-align:center;margin-top:8px;color:var(--txd);font-size:.8em}

/* QUIZ */
.qq{background:var(--c1);border-radius:16px;padding:24px;margin-bottom:14px;border:2px solid rgba(108,92,231,.2)}
.qqt{font-size:1.05em;font-weight:700;margin-bottom:14px;line-height:1.5}
.qopts{display:flex;flex-direction:column;gap:8px}
.qo{padding:12px 16px;border:2px solid rgba(255,255,255,.12);border-radius:12px;cursor:pointer;transition:.3s;font-size:.9em;background:rgba(255,255,255,.02)}
.qo:hover{border-color:var(--p);background:rgba(108,92,231,.08)}
.qo.right{border-color:var(--ok);background:rgba(0,184,148,.12);animation:cpop .5s}
.qo.wrong{border-color:var(--no);background:rgba(225,112,85,.12);animation:shk .4s}
@keyframes cpop{50%{transform:scale(1.02)}}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.qfb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.85em;display:none}
.qfb.show{display:block}
.qfb.gfb{background:rgba(0,184,148,.12);border:1px solid rgba(0,184,148,.25);color:var(--ok)}
.qfb.bfb{background:rgba(225,112,85,.12);border:1px solid rgba(225,112,85,.25);color:var(--no)}
.qnxt{margin-top:14px;padding:10px 26px;background:var(--p);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:.9em;cursor:pointer;transition:.3s}
.qnxt:hover{transform:scale(1.04)}
.qsc{text-align:center;padding:28px;background:var(--c1);border-radius:16px;border:2px solid rgba(108,92,231,.25)}
.qsc h2{font-size:1.4em;background:linear-gradient(135deg,var(--p),var(--s));-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* CYCLE */
.cyc-title{font-size:1.1em;font-weight:800;margin-bottom:6px;color:var(--s)}
.cyc-desc{font-size:.85em;color:var(--txd);margin-bottom:14px;line-height:1.5}
.cyc-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;min-height:60px}
.cyc-slot{padding:12px 16px;border:2px dashed rgba(255,255,255,.15);border-radius:12px;min-height:46px;display:flex;align-items:center;gap:10px;transition:.3s;font-size:.9em;background:rgba(255,255,255,.02)}
.cyc-slot .snum{width:28px;height:28px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8em;flex-shrink:0}
.cyc-slot.filled{border-color:rgba(108,92,231,.4);background:rgba(108,92,231,.08)}
.cyc-slot.correct-slot{border-color:var(--ok);background:rgba(0,184,148,.1)}
.cyc-slot.wrong-slot{border-color:var(--no);background:rgba(225,112,85,.1);animation:shk .4s}
.cyc-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cyc-chip{padding:8px 14px;background:var(--c2);border:2px solid rgba(255,255,255,.15);border-radius:10px;cursor:pointer;font-size:.82em;font-weight:600;transition:.3s;user-select:none}
.cyc-chip:hover{border-color:var(--p);transform:scale(1.04)}
.cyc-chip.used{opacity:.3;pointer-events:none}
.cyc-check{padding:10px 24px;background:linear-gradient(135deg,var(--s),var(--p));color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9em;transition:.3s}
.cyc-check:hover{transform:scale(1.04)}
.cyc-result{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.85em;display:none}
.cyc-result.show{display:block}
.cyc-wrap{background:var(--c1);border-radius:16px;padding:22px;margin-bottom:16px;border:2px solid rgba(0,206,201,.2)}
.cyc-nav{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cyc-navbtn{padding:8px 18px;background:rgba(255,255,255,.08);color:var(--tx);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-weight:600;cursor:pointer;font-size:.82em;transition:.3s}
.cyc-navbtn:hover{background:var(--p);border-color:var(--p)}

/* MATCH */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.mcard{aspect-ratio:1;background:var(--c2);border:2px solid rgba(108,92,231,.25);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:.78em;font-weight:600;cursor:pointer;transition:.3s;user-select:none;line-height:1.4}
.mcard:hover{border-color:var(--p);transform:scale(1.03)}
.mcard.selected{border-color:var(--w);background:rgba(253,203,110,.1);box-shadow:0 0 12px rgba(253,203,110,.2)}
.mcard.matched{border-color:var(--ok);background:rgba(0,184,148,.1);pointer-events:none;opacity:.65}
.mcard.wrong-match{animation:shk .4s;border-color:var(--no)}
.match-score{text-align:center;margin:10px 0;font-size:.9em;color:var(--txd)}
.match-cat{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.match-catbtn{padding:6px 14px;border:2px solid rgba(255,255,255,.15);border-radius:10px;background:var(--c1);color:var(--txd);cursor:pointer;font-weight:600;font-size:.78em;transition:.3s}
.match-catbtn:hover,.match-catbtn.on{border-color:var(--ac);color:var(--ac)}

/* SPEED */
.sptimer{font-size:2.8em;font-weight:900;color:var(--ac);margin:8px 0;text-align:center;font-variant-numeric:tabular-nums}
.sptimer.urg{color:var(--no);animation:tp .5s ease infinite}
@keyframes tp{50%{opacity:.4}}
.spq{background:var(--c1);border-radius:16px;padding:24px;margin:12px 0;border:2px solid rgba(253,121,168,.25);text-align:center}
.spin{width:100%;max-width:380px;padding:12px 16px;border:2px solid rgba(255,255,255,.15);border-radius:12px;background:rgba(255,255,255,.04);color:var(--tx);font-size:1em;text-align:center;outline:none;margin-top:10px;transition:.3s}
.spin:focus{border-color:var(--p)}
.spstart{padding:12px 36px;background:linear-gradient(135deg,var(--ac),var(--p));color:#fff;border:none;border-radius:12px;font-weight:800;font-size:1em;cursor:pointer;transition:.3s;margin:12px 0}
.spstart:hover{transform:scale(1.05)}

/* WHAT-IF SCENARIOS */
.wi-card{background:var(--c1);border-radius:16px;padding:24px;margin-bottom:14px;border:2px solid rgba(253,121,168,.25)}
.wi-scenario{font-size:.95em;line-height:1.6;margin-bottom:16px;padding:16px;background:rgba(253,121,168,.06);border-radius:12px;border-left:4px solid var(--ac)}
.wi-scenario .emoji{font-size:1.5em;display:block;margin-bottom:8px}
.wi-q{font-size:1em;font-weight:700;margin-bottom:14px;color:var(--w)}
.wi-opts{display:flex;flex-direction:column;gap:8px}
.wi-opt{padding:12px 16px;border:2px solid rgba(255,255,255,.12);border-radius:12px;cursor:pointer;transition:.3s;font-size:.9em;background:rgba(255,255,255,.02);line-height:1.5}
.wi-opt:hover{border-color:var(--ac);background:rgba(253,121,168,.06)}
.wi-opt.right{border-color:var(--ok);background:rgba(0,184,148,.12)}
.wi-opt.wrong{border-color:var(--no);background:rgba(225,112,85,.12);animation:shk .4s}
.wi-explain{margin-top:12px;padding:14px;border-radius:10px;font-size:.88em;line-height:1.7;display:none;background:rgba(108,92,231,.08);border:1px solid rgba(108,92,231,.2)}
.wi-explain.show{display:block}
.wi-chain{margin-top:10px;padding:10px 14px;background:rgba(0,206,201,.08);border-radius:8px;font-size:.85em;color:var(--s);line-height:1.5;font-weight:600}
.wi-num{font-size:.8em;color:var(--txd);text-align:center;margin-top:8px}

/* VISUAL MAP */
.vm-wrap{background:var(--c1);border-radius:16px;padding:20px;margin-bottom:14px;border:2px solid rgba(108,92,231,.25)}
.vm-nav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.vm-navbtn{padding:8px 16px;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:10px;color:var(--txd);cursor:pointer;font-weight:700;font-size:.8em;transition:.3s}
.vm-navbtn:hover,.vm-navbtn.on{border-color:var(--p);color:var(--p);background:rgba(108,92,231,.08)}
.vm-diagram{position:relative;width:100%;min-height:400px}
.vm-node{position:absolute;padding:10px 14px;background:var(--c2);border:2px solid rgba(108,92,231,.3);border-radius:12px;font-size:.78em;font-weight:700;text-align:center;cursor:pointer;transition:all .4s;z-index:2;max-width:160px;line-height:1.3}
.vm-node:hover{transform:scale(1.08);border-color:var(--p);box-shadow:0 0 16px rgba(108,92,231,.3);z-index:10}
.vm-node.active{border-color:var(--w);background:rgba(253,203,110,.1);box-shadow:0 0 20px rgba(253,203,110,.25)}
.vm-arrow{position:absolute;z-index:1;pointer-events:none}
.vm-detail{margin-top:12px;padding:16px;background:rgba(108,92,231,.06);border-radius:12px;border:1px solid rgba(108,92,231,.2);font-size:.88em;line-height:1.7;display:none}
.vm-detail.show{display:block}
.vm-detail h4{color:var(--w);margin-bottom:6px;font-size:1em}
.vm-detail .mem{color:var(--w);font-size:.85em;margin-top:8px;padding:8px;background:rgba(253,203,110,.08);border-radius:8px}

.xppop{position:fixed;top:56px;right:16px;background:var(--ok);color:#fff;padding:6px 14px;border-radius:8px;font-weight:700;font-size:.85em;animation:xpf 1.5s ease forwards;z-index:200;pointer-events:none}
@keyframes xpf{to{opacity:0;transform:translateY(-30px)}}
.lvlup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;justify-content:center;align-items:center;z-index:300}
.lvlbox{text-align:center;animation:lpop .5s ease}
.lvlbox h1{font-size:2.5em;background:linear-gradient(135deg,var(--w),var(--ac));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes lpop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.conf{position:fixed;width:10px;height:10px;z-index:400;pointer-events:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,.4)}50%{box-shadow:0 0 0 8px rgba(108,92,231,0)}}.pulse{animation:pulse 2s infinite}
@media(max-width:600px){.top{padding:8px 10px}.wrap{padding:10px}.face{padding:18px;min-height:200px}.mgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.vm-node{font-size:.7em;padding:6px 8px;max-width:120px}}
</style>
</head>

  <div class="logo">🧬 BioBlitz</div>
  <div class="stats">
    <span class="fire">🔥</span><span id="streak">0</span>

</div>

<script>
// ===== AUDIO =====
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playTone(f,d,t='sine',v=.15){const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}
function sfxOk(){playTone(523,.08);setTimeout(()=>playTone(659,.08),80);setTimeout(()=>playTone(784,.15),160)}
function sfxNo(){playTone(220,.15,'sawtooth',.1);setTimeout(()=>playTone(180,.2,'sawtooth',.08),100)}
function sfxFlip(){playTone(440,.06,'triangle',.08)}
function sfxClick(){playTone(600,.04,'triangle',.06)}
function sfxLvl(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.2,'sine',.12),i*120))}
function sfxStreak(){playTone(880,.1);setTimeout(()=>playTone(1100,.15),80)}
function sfxMatch(){playTone(660,.1);setTimeout(()=>playTone(880,.15),100)}
function sfxTick(){playTone(1000,.03,'square',.04)}
function sfxReveal(){playTone(330,.1,'triangle',.08);setTimeout(()=>playTone(440,.1,'triangle',.08),100);setTimeout(()=>playTone(550,.15,'triangle',.1),200)}

// ===== STATE =====
let lang='en',xp=0,streak=0,level=1;
let curCard=0,quizIdx=0,quizSc=0;
let fcDeck=[],cycIdx=0,cycSlots=[],matchSel=null;
let speedActive=false,spInt=null,spIdx=0,spCor=0,spTot=0,spTime=10;
let wiIdx=0;
let vmIdx=0,vmActiveNode=null;

// ===== TEXT =====
const T={
  tabs:{en:['📇 Cards','🧠 Quiz','🔄 Cycles','🎯 Match','⚡ Speed','🧪 What If?','🗺️ Map'],
        nl:['📇 Kaarten','🧠 Quiz','🔄 Cycli','🎯 Match','⚡ Snel','🧪 Wat Als?','🗺️ Kaart']},
  knew:{en:'✓ Got it!',nl:'✓ Wist ik!'},didnt:{en:'✗ Again',nl:'✗ Opnieuw'},flip:{en:'↻ Flip',nl:'↻ Draai'},
  of:{en:'of',nl:'van'},next:{en:'Next →',nl:'Volgende →'},check:{en:'✓ Check',nl:'✓ Check'},
  reset:{en:'↺ Reset',nl:'↺ Reset'},startSp:{en:'⚡ START',nl:'⚡ START'},
  done:{en:'Complete!',nl:'Klaar!'},score:{en:'Score',nl:'Score'},newQ:{en:'🔄 Again',nl:'🔄 Opnieuw'},
  correct:{en:'✓ Correct!',nl:'✓ Goed!'},wrongPre:{en:'✗ Answer: ',nl:'✗ Antwoord: '},
  lvlUp:{en:'LEVEL UP!',nl:'LEVEL OMHOOG!'},
  perfect:{en:'🎉 PERFECT!',nl:'🎉 PERFECT!'},
  tryAgain:{en:'Not quite — try again!',nl:'Niet helemaal — probeer opnieuw!'},
  matchDone:{en:'🎉 All matched!',nl:'🎉 Alles gematcht!'},
  pairs:{en:'Pairs found',nl:'Paren gevonden'},
  whyRight:{en:'💡 Here\'s why:',nl:'💡 Dit is waarom:'},
  chain:{en:'🔗 The chain reaction:',nl:'🔗 De kettingreactie:'},
  clickNode:{en:'👆 Click any node to learn about it',nl:'👆 Klik op een knooppunt om meer te leren'},
};

// ===== FLASHCARDS =====
const flashcards=[
{q:{en:"Where does fertilization happen?",nl:"Waar vindt bevruchting plaats?"},a:{en:"In the oviduct — sperm nucleus fuses with egg nucleus → zygote.",nl:"In de eileider — kern zaadcel versmelt met kern eicel → zygote."},m:{en:"🥚 \"Eggs travel the TUBE\" — Oviduct = fallopian TUBE",nl:"🥚 \"Eicellen reizen door de BUIS\" — Eileider!"}},
{q:{en:"What is a zygote and what happens to it?",nl:"Wat is een zygote en wat gebeurt ermee?"},a:{en:"A fertilized egg. Divides by cleavage divisions. Cilia move it to the uterine lining.",nl:"Een bevruchte eicel. Deelt via klievingsdelingen. Trilharen brengen het naar het baarmoederslijmvlies."},m:{en:"🅰️ \"Zygote = ZIP of gametes\" — two become one, then multiply!",nl:"🅰️ \"Zygote = samengeZIPt\" — twee worden één!"}},
{q:{en:"Umbilical cord — what's inside?",nl:"Navelstreng — wat zit erin?"},a:{en:"2 arteries + 1 vein. Connects fetus to placenta for substance exchange.",nl:"2 slagaders + 1 ader. Verbindt foetus met placenta voor stofuitwisseling."},m:{en:"🔢 \"A-A-V\" = 2 Arteries, 1 Vein!",nl:"🔢 \"S-S-A\" = 2 Slagaders, 1 Ader!"}},
{q:{en:"Primary, Secondary, Tertiary sex characteristics?",nl:"Primaire, secundaire, tertiaire geslachtskenmerken?"},a:{en:"1° = at birth. 2° = puberty (physical). 3° = mental.",nl:"1° = bij geboorte. 2° = puberteit (lichamelijk). 3° = geestelijk."},m:{en:"🧠 \"1-2-3: Born → Body → Brain\"",nl:"🧠 \"1-2-3: Geboren → Groei → Geest\""}},
{q:{en:"What does FSH do in females?",nl:"Wat doet FSH bij vrouwen?"},a:{en:"Stimulates follicle ripening → follicles produce estrogen.",nl:"Stimuleert follikelrijping → follikels produceren oestrogeen."},m:{en:"📢 \"FSH = Follicle Starter Hormone\"",nl:"📢 \"FSH = Follikel Start Hormoon\""}},
{q:{en:"What does estrogen do? (3 things)",nl:"Wat doet oestrogeen? (3 dingen)"},a:{en:"1) Secondary sex chars 2) Grows uterine lining 3) Inhibits FSH, stimulates LH → ovulation!",nl:"1) Secundaire kenmerken 2) Groei slijmvlies 3) Remt FSH, stimuleert LH → ovulatie!"},m:{en:"📝 \"Estrogen = Everything Grows\"",nl:"📝 \"Oestrogeen = Overal Opbouw\""}},
{q:{en:"Corpus luteum — what & what happens?",nl:"Gele lichaam — wat & wat dan?"},a:{en:"Makes progesterone → grows lining + inhibits FSH/LH. Dies without fertilization → menstruation.",nl:"Maakt progesteron → groeit slijmvlies + remt FSH/LH. Sterft zonder bevruchting → menstruatie."},m:{en:"🚦 \"Yellow body = Yellow light = STABLE. Dies = Red light!\"",nl:"🚦 \"Geel lichaam = Geel stoplicht = STABIEL. Sterft = Rood licht!\""}},
{q:{en:"What does HCG do?",nl:"Wat doet HCG?"},a:{en:"Prevents corpus luteum from dying → progesterone stays → pregnancy continues!",nl:"Voorkomt dat geel lichaam sterft → progesteron blijft → zwangerschap gaat door!"},m:{en:"🤰 \"HCG = Help Corpus Going!\"",nl:"🤰 \"HCG = Houd Corpus Gaande!\""}},
{q:{en:"FSH + LH + Testosterone in males?",nl:"FSH + LH + Testosteron bij mannen?"},a:{en:"FSH → sperm. LH → testosterone. Testosterone → sperm + 2° chars. T inhibits FSH & LH.",nl:"FSH → zaadcellen. LH → testosteron. Testosteron → zaadcellen + 2° kenmerken. T remt FSH & LH."},m:{en:"🔄 \"F=Sperm, L=T, T=Both + Brake\"",nl:"🔄 \"F=Zaad, L=T, T=Beide + Rem\""}},
{q:{en:"3 phases of birth + hormone?",nl:"3 fasen bevalling + hormoon?"},a:{en:"Dilation → Expulsion → Afterbirth. Hormone: oxytocin.",nl:"Ontsluiting → Uitdrijving → Nageboorte. Hormoon: oxytocine."},m:{en:"🎬 \"D.E.A.\" + OXYtocin!",nl:"🎬 \"O.U.N.\" + OXYtocine!"}},
{q:{en:"Meiosis?",nl:"Meiose?"},a:{en:"2-step division: 1 diploid (2n) → 4 haploid (n) cells.",nl:"2-staps deling: 1 diploïd (2n) → 4 haploïd (n) cellen."},m:{en:"✂️ \"ME divides TWICE\" — 1→4, halved!",nl:"✂️ \"ME deelt TWEE keer\" — 1→4, gehalveerd!"}},
{q:{en:"ATP vs ADP?",nl:"ATP vs ADP?"},a:{en:"ATP = 3 phosphates = full battery. ADP = 2 = empty. ATP → ADP + P + energy.",nl:"ATP = 3 fosfaten = vol. ADP = 2 = leeg. ATP → ADP + P + energie."},m:{en:"🔋 \"ATP = 3 bars. ADP = 2 bars.\"",nl:"🔋 \"ATP = 3 streepjes. ADP = 2 streepjes.\""}},
{q:{en:"Aerobic vs anaerobic?",nl:"Aeroob vs anaeroob?"},a:{en:"Aerobic: WITH O₂ → 38 ATP. Anaerobic: WITHOUT → 2 ATP.",nl:"Aeroob: MET O₂ → 38 ATP. Anaeroob: ZONDER → 2 ATP."},m:{en:"💨 \"AERO = AIR. AN-aero = NO AIR.\"",nl:"💨 \"AERO = ADEM. AN-aero = GEEN ADEM.\""}},
{q:{en:"Aerobic equation?",nl:"Aerobe dissimilatie vergelijking?"},a:{en:"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 38 ATP",nl:"C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + 38 ATP"},m:{en:"📐 \"6-6-6\": 6 O₂ in, 6 CO₂ + 6 H₂O out!",nl:"📐 \"6-6-6\": 6 O₂ erin, 6 CO₂ + 6 H₂O eruit!"}},
{q:{en:"Lactic acid fermentation?",nl:"Melkzuurgisting?"},a:{en:"Muscles, no O₂. Glucose → 2 lactic acid + 2 ATP.",nl:"Spieren, geen O₂. Glucose → 2 melkzuur + 2 ATP."},m:{en:"🏃 \"No air → muscles make ACID → PAIN!\"",nl:"🏃 \"Geen lucht → spieren maken ZUUR → PIJN!\""}},
{q:{en:"Photosynthesis equation?",nl:"Fotosynthese vergelijking?"},a:{en:"6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂",nl:"6CO₂ + 6H₂O + licht → C₆H₁₂O₆ + 6O₂"},m:{en:"📸 \"PHOTO=light SYNTHESIS=build\" — reverse of dissimilation!",nl:"📸 \"FOTO=licht SYNTHESE=bouwen\" — omgekeerde!"}},
{q:{en:"Phloem vs Xylem?",nl:"Bastvaten vs Houtvaten?"},a:{en:"Phloem: sugars DOWN. Xylem: water+minerals UP.",nl:"Bast: suikers OMLAAG. Hout: water+mineralen OMHOOG."},m:{en:"🌳 \"Phloem = Phlow DOWN. Xylem = X-cend UP.\"",nl:"🌳 \"Bast = Beneden. Hout = Hoog.\""}},
{q:{en:"Compensation point?",nl:"Compensatiepunt?"},a:{en:"Photosynthesis = dissimilation. Net gas exchange = zero.",nl:"Fotosynthese = dissimilatie. Netto gasuitwisseling = nul."},m:{en:"⚖️ \"Break even\" — makes exactly what it uses!",nl:"⚖️ \"Break-even\" — maakt precies wat het verbruikt!"}},
{q:{en:"Essential amino acids?",nl:"Essentiële aminozuren?"},a:{en:"Body CANNOT make them → must eat them.",nl:"Lichaam KAN ze NIET maken → moet je eten."},m:{en:"🍽️ \"ESSENTIAL = must EAT them!\"",nl:"🍽️ \"ESSENTIEEL = moet je ETEN!\""}},
{q:{en:"Glycogen?",nl:"Glycogeen?"},a:{en:"Storage form of glucose. In liver + muscles.",nl:"Opslagvorm glucose. In lever + spieren."},m:{en:"🏦 \"Glycogen = Glucose BANK\"",nl:"🏦 \"Glycogeen = Glucose BANK\""}},
{q:{en:"How does water move up in plants?",nl:"Hoe beweegt water omhoog in planten?"},a:{en:"Root pressure PUSHES (osmosis). Transpiration PULLS (evaporation via stomata).",nl:"Worteldruk DUWT (osmose). Transpiratie TREKT (verdamping via huidmondjes)."},m:{en:"💧 \"Push from ROOTS + Pull from LEAVES\"",nl:"💧 \"Duwen vanuit WORTELS + Trekken vanuit BLADEREN\""}},

// ===== INIT =====
function init(){renderTabs();shuffleDeck();show('flash');updateUI()}

// ===== LANG =====
function setLang(l){
  lang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.toggle('on',b.textContent===l.toUpperCase()));
  renderTabs();
  // Re-render active section
  const k=activeTab;
  if(k==='flash')renderCard();if(k==='quiz'){quizIdx=0;quizSc=0;renderQuiz()}
  if(k==='cycle')renderCycle();if(k==='match')renderMatchMenu();
  if(k==='speed')renderSpeed();if(k==='whatif')renderWI();if(k==='map')renderMap();
}

// ===== TABS =====
let activeTab='flash';
const tabKeys=['flash','quiz','cycle','match','speed','whatif','map'];
function renderTabs(){
  const c=document.getElementById('tabs');c.innerHTML='';
  T.tabs[lang].forEach((n,i)=>{const b=document.createElement('button');b.className='tab'+(tabKeys[i]===activeTab?' on':'');b.textContent=n;b.onclick=()=>show(tabKeys[i]);c.appendChild(b)});
}
function show(k){
  // STOP speed round when leaving
  if(speedActive){speedActive=false;if(spInt)clearInterval(spInt)}
  activeTab=k;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));
  document.getElementById('sec-'+k).classList.add('on');
  renderTabs();sfxClick();
  if(k==='flash')renderCard();if(k==='quiz'){quizIdx=0;quizSc=0;renderQuiz()}
  if(k==='cycle')renderCycle();if(k==='match')renderMatchMenu();
  if(k==='speed')renderSpeed();if(k==='whatif')renderWI();if(k==='map')renderMap();
}

// ===== GAMIFICATION =====
function addXP(n){xp+=n;const nl=Math.floor(xp/120)+1;if(nl>level){level=nl;showLvlUp()}updateUI();showPop(n)}
function updateUI(){document.getElementById('xp').textContent=xp;document.getElementById('streak').textContent=streak;document.getElementById('lvl').textContent='Lvl '+level;document.getElementById('xpfill').style.width=(xp%120)/1.2+'%'}
function showPop(n){const p=document.createElement('div');p.className='xppop';p.textContent='+'+n+' XP';document.body.appendChild(p);setTimeout(()=>p.remove(),1500)}
function showLvlUp(){sfxLvl();const o=document.createElement('div');o.className='lvlup';o.innerHTML=`<div class="lvlbox"><h1>${T.lvlUp[lang]}</h1><p>Level ${level} 🎉</p></div>`;o.onclick=()=>o.remove();document.body.appendChild(o);confetti();setTimeout(()=>{if(o.parentNode)o.remove()},2500)}
function confetti(){const cols=['#6C5CE7','#00CEC9','#FD79A8','#FDCB6E','#00B894','#E17055'];for(let i=0;i<35;i++){const c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'vw';c.style.top='-10px';c.style.backgroundColor=cols[~~(Math.random()*cols.length)];c.style.borderRadius=Math.random()>.5?'50%':'2px';c.style.width=(6+Math.random()*8)+'px';c.style.height=(6+Math.random()*8)+'px';document.body.appendChild(c);const d=1+Math.random()*2;c.style.transition=`top ${d}s ease-in,left ${d}s,transform ${d}s`;setTimeout(()=>{c.style.top='110vh';c.style.transform=`rotate(${Math.random()*720}deg)`},30);setTimeout(()=>c.remove(),d*1000+200)}}

// ===== FLASHCARDS =====
function shuffleDeck(){fcDeck=[...flashcards].sort(()=>Math.random()-.5);curCard=0}
function renderCard(){
  if(curCard>=fcDeck.length)shuffleDeck();const d=fcDeck[curCard];
  document.getElementById('sec-flash').innerHTML=`<div class="fcwrap" onclick="flipC()"><div class="fc" id="fc"><div class="face ffront"><div class="flabel">${lang==='en'?'QUESTION':'VRAAG'}</div><div class="ftxt">${d.q[lang]}</div></div><div class="face fback"><div class="flabel">${lang==='en'?'ANSWER':'ANTWOORD'}</div><div class="ftxt">${d.a[lang]}</div><div class="fmem">💡 ${d.m[lang]}</div></div></div></div><div class="fcnav"><button class="fbtn no" onclick="cardR(false)">${T.didnt[lang]}</button><button class="fbtn fl" onclick="flipC()">${T.flip[lang]}</button><button class="fbtn ok" onclick="cardR(true)">${T.knew[lang]}</button></div><div class="fccount">${curCard+1} ${T.of[lang]} ${fcDeck.length}</div>`;
}
function flipC(){const f=document.getElementById('fc');if(f){f.classList.toggle('flip');sfxFlip()}}
function cardR(k){if(k){streak++;sfxOk();addXP(10+Math.min(streak*2,20));if(streak%5===0)sfxStreak()}else{streak=0;sfxNo();updateUI();fcDeck.push(fcDeck[curCard])}curCard++;renderCard()}

// ===== QUIZ =====
let sQuiz=[];
function renderQuiz(){sQuiz=[...quizQs].sort(()=>Math.random()-.5).slice(0,10);quizIdx=0;quizSc=0;renderQQ()}
function renderQQ(){
  const a=document.getElementById('sec-quiz');
  if(quizIdx>=sQuiz.length){const p=Math.round(quizSc/sQuiz.length*100);a.innerHTML=`<div class="qsc"><h2>${T.done[lang]}</h2><p style="font-size:2.2em;margin:10px 0">${quizSc}/${sQuiz.length} (${p}%)</p><button class="qnxt" onclick="renderQuiz()">${T.newQ[lang]}</button></div>`;addXP(quizSc*15);if(p===100)confetti();return}
  const q=sQuiz[quizIdx],idx=[0,1,2,3].sort(()=>Math.random()-.5),ci=idx.indexOf(q.c);
  let h=`<div class="qq"><div class="qqt">${quizIdx+1}/${sQuiz.length}: ${q.q[lang]}</div><div class="qopts">`;
  idx.forEach((oi,di)=>{h+=`<div class="qo" onclick="ansQ(this,${di===ci})">${q.o[lang][oi]}</div>`});
  h+=`</div><div class="qfb" id="qfb"></div><div style="text-align:center;display:none" id="qnw"><button class="qnxt" onclick="quizIdx++;renderQQ()">${T.next[lang]}</button></div></div>`;a.innerHTML=h;
}
function ansQ(el,ok){
  document.querySelectorAll('.qo').forEach(o=>o.style.pointerEvents='none');const fb=document.getElementById('qfb'),q=sQuiz[quizIdx];
  if(ok){el.classList.add('right');fb.className='qfb show gfb';fb.textContent=T.correct[lang]+' '+q.e[lang];quizSc++;streak++;sfxOk();addXP(15+Math.min(streak*2,20))}
  else{el.classList.add('wrong');fb.className='qfb show bfb';fb.textContent=T.wrongPre[lang]+q.o[lang][q.c]+'. '+q.e[lang];streak=0;sfxNo();updateUI();const ct=q.o[lang][q.c];document.querySelectorAll('.qo').forEach(o=>{if(o.textContent===ct)o.classList.add('right')})}
  document.getElementById('qnw').style.display='block';
}

// ===== CYCLE BUILDER =====
function renderCycle(){
  const c=document.getElementById('sec-cycle');let h=`<div class="cyc-nav" style="margin-bottom:16px">`;
  cycles.forEach((cy,i)=>{h+=`<button class="cyc-navbtn" onclick="cycIdx=${i};renderCycle()" style="${i===cycIdx?'background:var(--p);border-color:var(--p)':''}">${cy.title[lang].split('—')[0].trim()}</button>`});
  h+=`</div>`;const cy=cycles[cycIdx];const sh=[...cy.steps[lang]].sort(()=>Math.random()-.5);cycSlots=new Array(cy.steps[lang].length).fill(null);
  h+=`<div class="cyc-wrap"><div class="cyc-title">${cy.title[lang]}</div><div class="cyc-desc">${cy.desc[lang]}</div><div class="cyc-slots" id="cyc-slots">`;
  cy.steps[lang].forEach((_,i)=>{h+=`<div class="cyc-slot" id="slot-${i}" onclick="removeSlot(${i})"><span class="snum">${i+1}</span><span id="slot-txt-${i}" style="color:var(--txd)">${lang==='en'?'Click a step...':'Klik een stap...'}</span></div>`});
  h+=`</div><div class="cyc-bank" id="cyc-bank">`;
  sh.forEach((s,i)=>{h+=`<div class="cyc-chip" id="chip-${i}" onclick="pickChip(${i},'${s.replace(/'/g,"\\'")}')">${s}</div>`});
  h+=`</div><div style="display:flex;gap:8px"><button class="cyc-check" onclick="checkCycle()">${T.check[lang]}</button><button class="cyc-navbtn" onclick="renderCycle()">${T.reset[lang]}</button></div><div class="cyc-result" id="cyc-result"></div></div>`;c.innerHTML=h;
}
function pickChip(i,txt){sfxClick();const ch=document.getElementById('chip-'+i);if(ch.classList.contains('used'))return;let t=-1;for(let s=0;s<cycSlots.length;s++){if(!cycSlots[s]){t=s;break}}if(t===-1)return;cycSlots[t]={ci:i,text:txt};ch.classList.add('used');document.getElementById('slot-txt-'+t).textContent=txt;document.getElementById('slot-txt-'+t).style.color='var(--tx)';document.getElementById('slot-'+t).classList.add('filled')}
function removeSlot(i){if(!cycSlots[i])return;sfxClick();document.getElementById('chip-'+cycSlots[i].ci).classList.remove('used');cycSlots[i]=null;document.getElementById('slot-txt-'+i).textContent=lang==='en'?'Click a step...':'Klik een stap...';document.getElementById('slot-txt-'+i).style.color='var(--txd)';document.getElementById('slot-'+i).classList.remove('filled')}
function checkCycle(){const cy=cycles[cycIdx];let ok=0;cycSlots.forEach((s,i)=>{const sl=document.getElementById('slot-'+i);if(s&&s.text===cy.steps[lang][i]){sl.classList.add('correct-slot');sl.classList.remove('wrong-slot');ok++}else if(s){sl.classList.add('wrong-slot');sl.classList.remove('correct-slot')}});const r=document.getElementById('cyc-result');if(ok===cy.steps[lang].length){r.className='cyc-result show';r.style.cssText='background:rgba(0,184,148,.12);border:1px solid rgba(0,184,148,.3);color:var(--ok)';r.textContent=T.perfect[lang];sfxOk();streak+=ok;addXP(ok*10);confetti()}else{r.className='cyc-result show';r.style.cssText='background:rgba(225,112,85,.12);border:1px solid rgba(225,112,85,.3);color:var(--no)';r.textContent=`${ok}/${cy.steps[lang].length} — ${T.tryAgain[lang]}`;sfxNo();if(ok>0)addXP(ok*3)}}

// ===== MATCH =====
let curMS=0,mFound=0;
function renderMatchMenu(){let h=`<div class="match-cat">`;matchSets.forEach((s,i)=>{h+=`<button class="match-catbtn${i===curMS?' on':''}" onclick="curMS=${i};startMatch()">${s.name[lang]}</button>`});h+=`</div><div id="match-area"></div>`;document.getElementById('sec-match').innerHTML=h;startMatch()}
function startMatch(){mFound=0;matchSel=null;const set=matchSets[curMS];let cards=[];set.pairs.forEach((p,i)=>{cards.push({id:'a'+i,pi:i,text:p.a[lang],type:'a'});cards.push({id:'b'+i,pi:i,text:p.b[lang],type:'b'})});cards.sort(()=>Math.random()-.5);let h=`<div class="match-score" id="match-sc">${T.pairs[lang]}: 0/${set.pairs.length}</div><div class="mgrid">`;cards.forEach(c=>{const bg=c.type==='a'?'border-color:rgba(108,92,231,.3)':'border-color:rgba(0,206,201,.3)';h+=`<div class="mcard" id="mc-${c.id}" data-p="${c.pi}" data-t="${c.type}" onclick="pickM(this)" style="${bg}">${c.text}</div>`});h+=`</div>`;document.getElementById('match-area').innerHTML=h;document.querySelectorAll('.match-catbtn').forEach((b,i)=>b.classList.toggle('on',i===curMS))}
function pickM(el){if(el.classList.contains('matched'))return;sfxClick();if(!matchSel){matchSel=el;el.classList.add('selected');return}if(matchSel===el){matchSel.classList.remove('selected');matchSel=null;return}if(matchSel.dataset.p===el.dataset.p&&matchSel.dataset.t!==el.dataset.t){matchSel.classList.remove('selected');matchSel.classList.add('matched');el.classList.add('matched');mFound++;sfxMatch();streak++;addXP(12);document.getElementById('match-sc').textContent=`${T.pairs[lang]}: ${mFound}/${matchSets[curMS].pairs.length}`;if(mFound===matchSets[curMS].pairs.length){sfxLvl();confetti();document.getElementById('match-sc').innerHTML=`<span style="color:var(--ok);font-size:1.2em">${T.matchDone[lang]}</span>`;addXP(30)}matchSel=null}else{sfxNo();el.classList.add('wrong-match');matchSel.classList.add('wrong-match');const pr=matchSel;streak=0;updateUI();setTimeout(()=>{pr.classList.remove('selected','wrong-match');el.classList.remove('wrong-match')},500);matchSel=null}}

// ===== SPEED (FIXED: stops on tab switch) =====
let spShuf=[];
function renderSpeed(){document.getElementById('sec-speed').innerHTML=`<div style="text-align:center"><div class="sptimer" id="spt">10</div><div class="spq"><div id="spqt" style="font-size:1.1em;font-weight:700;margin-bottom:10px">${lang==='en'?'Type the answer, hit Enter. 10 sec per question!':'Typ het antwoord, druk Enter. 10 sec per vraag!'}</div><input class="spin" id="spi" placeholder="${lang==='en'?'Answer...':'Antwoord...'}" autocomplete="off"><div id="spr" style="margin-top:10px;font-weight:700"></div></div><button class="spstart" id="spgo" onclick="goSpeed()">⚡ ${T.startSp[lang]}</button><div class="fccount" id="spsc"></div></div>`}
function goSpeed(){spShuf=[...speedQs].sort(()=>Math.random()-.5);spIdx=0;spCor=0;spTot=0;speedActive=true;document.getElementById('spgo').style.display='none';document.getElementById('spsc').textContent='';nextSp()}
function nextSp(){if(spIdx>=spShuf.length||!speedActive){endSp();return}const q=spShuf[spIdx];document.getElementById('spqt').textContent=q.q[lang];document.getElementById('spi').value='';document.getElementById('spr').textContent='';document.getElementById('spi').focus();spTime=10;updSpT();if(spInt)clearInterval(spInt);spInt=setInterval(()=>{if(!speedActive){clearInterval(spInt);return}spTime--;updSpT();sfxTick();if(spTime<=0){clearInterval(spInt);spTot++;document.getElementById('spr').innerHTML=`<span style="color:var(--no)">⏰ ${T.wrongPre[lang]}${spShuf[spIdx].a[lang]}</span>`;streak=0;updateUI();sfxNo();spIdx++;setTimeout(nextSp,1800)}},1000)}
function updSpT(){const e=document.getElementById('spt');if(e){e.textContent=spTime;e.className='sptimer'+(spTime<=3?' urg':'')}}
function endSp(){speedActive=false;if(spInt)clearInterval(spInt);const st=document.getElementById('spt');if(st)st.textContent='✓';if(st)st.className='sptimer';const qt=document.getElementById('spqt');if(qt)qt.textContent=T.done[lang];const si=document.getElementById('spi');if(si)si.style.display='none';const sr=document.getElementById('spr');if(sr)sr.innerHTML=`<span style="color:var(--ok)">${spCor}/${spTot}</span>`;const sg=document.getElementById('spgo');if(sg)sg.style.display='inline-block';if(si)si.style.display='block';const ss=document.getElementById('spsc');if(ss)ss.textContent=`${T.score[lang]}: ${spCor}/${spTot}`}
document.addEventListener('keydown',e=>{if(!speedActive||e.key!=='Enter')return;const inp=document.getElementById('spi').value.trim().toLowerCase();const ans=spShuf[spIdx].a[lang].toLowerCase();spTot++;clearInterval(spInt);if(inp===ans||(ans.includes(inp)&&inp.length>1)){document.getElementById('spr').innerHTML=`<span style="color:var(--ok)">${T.correct[lang]}</span>`;spCor++;streak++;sfxOk();addXP(20+Math.min(streak*3,30))}else{document.getElementById('spr').innerHTML=`<span style="color:var(--no)">${T.wrongPre[lang]}${spShuf[spIdx].a[lang]}</span>`;streak=0;sfxNo();updateUI()}spIdx++;setTimeout(nextSp,1400)});

// ===== WHAT-IF SCENARIOS =====
let wiShuf=[],wiAnswered=false;
function renderWI(){
  wiShuf=[...whatIfs].sort(()=>Math.random()-.5);wiIdx=0;wiAnswered=false;renderWIQ();
}
function renderWIQ(){
  if(wiIdx>=wiShuf.length){wiIdx=0;wiShuf.sort(()=>Math.random()-.5)}
  wiAnswered=false;const w=wiShuf[wiIdx];const a=document.getElementById('sec-whatif');
  const idx=[0,1,2,3].sort(()=>Math.random()-.5);const ci=idx.indexOf(w.c);
  let h=`<div class="wi-card"><div class="wi-scenario"><span class="emoji">${w.scenario[lang].slice(0,2)}</span>${w.scenario[lang].slice(2)}</div><div class="wi-q">${w.q[lang]}</div><div class="wi-opts">`;
  idx.forEach((oi,di)=>{h+=`<div class="wi-opt" onclick="ansWI(this,${di===ci})">${w.opts[lang][oi]}</div>`});
  h+=`</div><div class="wi-explain" id="wi-exp"><div><strong>${T.whyRight[lang]}</strong> ${w.why[lang]}</div><div class="wi-chain">${T.chain[lang]}<br><pre style="margin-top:6px;white-space:pre-wrap;font-family:inherit">${w.chain[lang]}</pre></div></div></div>`;
  h+=`<div class="wi-num">${wiIdx+1} ${T.of[lang]} ${wiShuf.length}</div>`;
  h+=`<div style="text-align:center;margin-top:12px"><button class="qnxt" onclick="wiIdx++;renderWIQ()">${T.next[lang]}</button></div>`;
  a.innerHTML=h;
}
function ansWI(el,ok){
  if(wiAnswered)return;wiAnswered=true;
  document.querySelectorAll('.wi-opt').forEach(o=>o.style.pointerEvents='none');
  if(ok){el.classList.add('right');sfxOk();streak++;addXP(25+Math.min(streak*3,30))}
  else{el.classList.add('wrong');sfxNo();streak=0;updateUI();const w=wiShuf[wiIdx];const ct=w.opts[lang][w.c];document.querySelectorAll('.wi-opt').forEach(o=>{if(o.textContent===ct)o.classList.add('right')})}
  document.getElementById('wi-exp').classList.add('show');sfxReveal();
}

// ===== VISUAL MAP =====
function renderMap(){
  const a=document.getElementById('sec-map');vmActiveNode=null;
  let h=`<div class="vm-nav">`;vmMaps.forEach((m,i)=>{h+=`<button class="vm-navbtn${i===vmIdx?' on':''}" onclick="vmIdx=${i};renderMap()">${m.name[lang]}</button>`});h+=`</div>`;
  const m=vmMaps[vmIdx];
  h+=`<div class="vm-wrap"><div class="vm-diagram" id="vm-dia">`;
  // SVG for arrows
  h+=`<svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1" id="vm-svg"></svg>`;
  m.nodes.forEach(n=>{h+=`<div class="vm-node" id="vn-${n.id}" style="left:${n.x}%;top:${n.y}%" onclick="vmClick('${n.id}')">${n.label[lang]}</div>`});
  h+=`</div><div class="vm-detail" id="vm-det"><div id="vm-det-inner"></div></div><p style="color:var(--txd);font-size:.82em;margin-top:8px;text-align:center">${T.clickNode[lang]}</p></div>`;
  a.innerHTML=h;
  // Draw arrows after DOM renders
  requestAnimationFrame(()=>drawArrows(m));
}
function drawArrows(m){
  const svg=document.getElementById('vm-svg');if(!svg)return;
  const dia=document.getElementById('vm-dia');if(!dia)return;
  const dw=dia.offsetWidth,dh=dia.offsetHeight;
  let paths='';
  m.arrows.forEach(([fromId,toId])=>{
    const fromEl=document.getElementById('vn-'+fromId);const toEl=document.getElementById('vn-'+toId);
    if(!fromEl||!toEl)return;
    const fx=fromEl.offsetLeft+fromEl.offsetWidth/2,fy=fromEl.offsetTop+fromEl.offsetHeight/2;
    const tx=toEl.offsetLeft+toEl.offsetWidth/2,ty=toEl.offsetTop+toEl.offsetHeight/2;
    // Shorten arrow to not overlap nodes
    const dx=tx-fx,dy=ty-fy,dist=Math.sqrt(dx*dx+dy*dy);
    const ux=dx/dist,uy=dy/dist;
    const sx=fx+ux*25,sy=fy+uy*20,ex=tx-ux*25,ey=ty-uy*20;
    paths+=`<line x1="${sx}" y1="${sy}" x2="${ex}" y2="${ey}" stroke="rgba(108,92,231,0.35)" stroke-width="2" marker-end="url(#arrowhead)"/>`;
  });
  svg.innerHTML=`<defs><marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="rgba(108,92,231,0.5)"/></marker></defs>${paths}`;
}
function vmClick(id){
  sfxClick();
  const m=vmMaps[vmIdx];const n=m.nodes.find(x=>x.id===id);if(!n)return;
  // Highlight
  document.querySelectorAll('.vm-node').forEach(el=>el.classList.remove('active'));
  document.getElementById('vn-'+id).classList.add('active');
  // Show detail
  const det=document.getElementById('vm-det');
  document.getElementById('vm-det-inner').innerHTML=`<h4>${n.label[lang]}</h4><p>${n.detail[lang]}</p><div class="mem">💡 ${n.mem[lang]}</div>`;
  det.classList.add('show');sfxReveal();addXP(3);
}

// ===== GO =====
init();
</script>
