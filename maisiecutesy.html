<body>
<div class="wrap">
  <header>
    <div>
      <div class="title" id="titleText">Maatschappijkunde Crunch</div>
      <div class="sub" id="subText">VMBO GL/TL — Centraal Examen 2026</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <div class="audio-bar">
        <button id="btnMusic" class="audio-btn off" title="Lofi music" onclick="toggleMusicPanel(event)">🎵</button>
        <button id="btnSfx" class="audio-btn on" title="Sound effects" onclick="toggleSfx()">🔔</button>
      </div>
      <div class="lang" role="group" aria-label="language">
        <button id="btnNL" class="on" onclick="setLang('nl')">🇳🇱 NL</button>
        <button id="btnEN" onclick="setLang('en')">🇬🇧 EN</button>
      </div>
    </div>
  </header>

  <div id="musicPanel" class="music-panel" onclick="event.stopPropagation()">
    <h4 id="musicTitle">🎶 Concentratie-muziek</h4>
    <label id="musicTypeLabel">Sfeer</label>
    <select id="musicType" onchange="changeMusicType(this.value)">
      <option value="lofi">Groove Salad — ambient downtempo</option>
      <option value="chillhop">Lush — mellow vocal chill</option>
      <option value="rain">Drone Zone — deep ambient</option>
      <option value="forest">Mission Control — space ambient</option>
      <option value="brown">Brown noise (offline)</option>
      <option value="ambient">Ambient pads — synth (offline)</option>

/* =========================================================================
   AUDIO ENGINE — procedural lofi/ambient music + UI sound effects
   No external files needed; everything is generated with Web Audio API
   ========================================================================= */

const AudioEngine = {
  ctx:null, master:null, musicBus:null, fxBus:null, noiseBus:null,
  playing:false, musicType:"lofi", volume:0.35, sfxOn:true,
  sources:[], timers:[],

  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 1;
    this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = this.volume;
    this.fxBus = this.ctx.createGain(); this.fxBus.gain.value = 0.55;
    this.musicBus.connect(this.master);
    this.fxBus.connect(this.master);
  },

  // ----- SFX -----
  blip(freq, dur, type, vol){
    if(!this.sfxOn) return;
    this.ensure();
    if(this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type||"sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol||0.18, t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.1));
    o.connect(g).connect(this.fxBus);
    o.start(t); o.stop(t+(dur||0.1)+0.05);
  },
  flip(){ this.blip(900, 0.04, "square", 0.09); },
  click(){ this.blip(660, 0.04, "triangle", 0.08); },
  tap(){ this.blip(880, 0.025, "sine", 0.06); },
  pop(){
    if(!this.sfxOn) return;
    this.ensure();
    [520, 760].forEach((f,i)=> setTimeout(()=>this.blip(f, 0.06, "triangle", 0.09), i*40));
  },
  correct(){
    if(!this.sfxOn) return;
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.18, "sine", 0.16), i*70);
    });
  },
  wrong(){
    if(!this.sfxOn) return;
    [330, 247].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.18, "sawtooth", 0.1), i*100);
    });
  },
  almost(){
    if(!this.sfxOn) return;
    [440, 523].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.12, "sine", 0.12), i*80);
    });
  },

  // ----- MUSIC -----
  // Free 24/7 ambient/downtempo streams from SomaFM (CC-licensed).
  // We use HTML5 <audio> with these direct MP3 URLs because it works on iOS
  // Safari, unlike a YouTube iframe — and lets the in-app volume slider
  // control playback through audio.volume.
  YT_TRACKS: {
    lofi:     "https://ice1.somafm.com/groovesalad-128-mp3",    // Groove Salad — ambient/downtempo
    chillhop: "https://ice1.somafm.com/lush-128-mp3",            // Lush — mellow vocal chill
    rain:     "https://ice1.somafm.com/dronezone-128-mp3",       // Drone Zone — deep ambient
    forest:   "https://ice1.somafm.com/missioncontrol-128-mp3"   // Mission Control — ambient + space audio
  },

  start(){
    this.ensure();
    if(this.ctx.state === "suspended") this.ctx.resume();
    if(this.playing) return;
    this.playing = true;

    if(this.YT_TRACKS[this.musicType]){
      this._startYT(this.YT_TRACKS[this.musicType]);
    } else if(this.musicType === "brown"){
      this._startBrownNoise();
    } else if(this.musicType === "ambient"){
      this._startPads();
    }
  },

  stop(){
    this.playing = false;
    this.sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
    this.sources = [];
    this.timers.forEach(t=>clearTimeout(t));
    this.timers = [];
    this._stopYT();
  },

  setVolume(v){
    this.volume = v;
    this.ensure();
    this.musicBus.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
    // Apply to the streaming <audio> element when present
    const audio = document.getElementById("streamAudio");
    if(audio && typeof audio.volume === "number"){
      try{ audio.volume = Math.max(0, Math.min(1, v)); }catch(e){}
    }
  },

  changeType(t){
    const wasPlaying = this.playing;
    this.stop();
    this.musicType = t;
    if(wasPlaying) this.start();
  },

  // ----- Streaming audio (HTML5 <audio>) — works on iOS Safari.
  // SomaFM streams are direct MP3 URLs; <audio> plays them natively with no
  // CORS / autoplay-policy issues that the YouTube iframe had.
  _startYT(streamUrl){
    const host = document.getElementById("ytHost");
    if(!host) return;
    host.innerHTML = `<audio id="streamAudio" src="${streamUrl}" preload="none" playsinline></audio>`;
    const audio = document.getElementById("streamAudio");
    if(!audio){ return; }
    audio.volume = Math.max(0, Math.min(1, this.volume));
    audio.loop = true;
    // play() must be called from a user-gesture handler; the music panel's
    // "Play" button click counts, so this should succeed.
    const p = audio.play();
    if(p && p.catch) p.catch(err => console.warn("audio play failed:", err && err.message));
    this._yt = audio;
  },
  _stopYT(){
    const audio = document.getElementById("streamAudio");
    if(audio){
      try{ audio.pause(); }catch(e){}
      try{ audio.removeAttribute("src"); audio.load(); }catch(e){}
    }
    const host = document.getElementById("ytHost");
    if(host) host.innerHTML = "";
    this._yt = null;
  },

  // ----- Brown noise (deeper, more relaxing than white noise) -----
  _startBrownNoise(){
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr*4, sr); // 4s loop
    const data = buf.getChannelData(0);
    let lastOut = 0;
    for(let i=0;i<data.length;i++){
      const white = Math.random()*2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5; // amplify
    }
    const s = this.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 1000;
    const g = this.ctx.createGain();
    g.gain.value = 0.55;
    s.connect(filt).connect(g).connect(this.musicBus);
    s.start();
    this.sources.push(s);
  },

  _startPads(){
    const chordDur = 6; // seconds per chord
    const playChord = (notes, startT) => {
      notes.forEach((freq, idx) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const filt = this.ctx.createBiquadFilter();
        filt.type = "lowpass";
        filt.frequency.value = 900;
        filt.Q.value = 1.4;
        o.type = idx === 0 ? "sine" : "triangle";
        o.frequency.value = freq * 0.5; // warmer low octave
        g.gain.setValueAtTime(0, startT);
        g.gain.linearRampToValueAtTime(0.13, startT + 1.6);
        g.gain.linearRampToValueAtTime(0.10, startT + chordDur - 1.4);
        g.gain.linearRampToValueAtTime(0, startT + chordDur);
        // slow gentle detune
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.value = 0.15 + Math.random()*0.2;
        lfoGain.gain.value = 2.5;
        lfo.connect(lfoGain).connect(o.frequency);
        o.connect(filt).connect(g).connect(this.musicBus);
        lfo.start(startT); lfo.stop(startT + chordDur + 0.1);
        o.start(startT); o.stop(startT + chordDur + 0.2);
        this.sources.push(o, lfo);
      });
    };

    const loop = (offset) => {
      this.CHORDS.forEach((c,i) => playChord(c, offset + i*chordDur));
    };

    let t = this.ctx.currentTime + 0.1;
    loop(t);
    const loopLen = this.CHORDS.length * chordDur;
    const schedule = () => {
      if(!this.playing) return;
      t += loopLen;
      loop(t);
      this.timers.push(setTimeout(schedule, (loopLen - 1.5)*1000));
    };
    this.timers.push(setTimeout(schedule, (loopLen - 1.5)*1000));
  },

  _startBeat(){
    // Slow lofi-ish beat ~70 BPM: soft kick + brushed hat
    const bpm = 70;
    const beat = 60/bpm;
    const step = (i, startT) => {
      // Kick on 1 and 3
      if(i % 2 === 0){
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.frequency.setValueAtTime(120, startT);
        o.frequency.exponentialRampToValueAtTime(45, startT + 0.18);
        g.gain.setValueAtTime(0, startT);
        g.gain.linearRampToValueAtTime(0.18, startT + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, startT + 0.22);
        o.connect(g).connect(this.musicBus);
        o.start(startT); o.stop(startT + 0.25);
        this.sources.push(o);
      }
      // Hat on every offbeat (i % 2 === 1) at lower volume
      if(i % 2 === 1){
        const buf = this._noiseBuffer(0.08);
        const s = this.ctx.createBufferSource();
        const filt = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        filt.type = "highpass"; filt.frequency.value = 6000;
        s.buffer = buf;
        g.gain.setValueAtTime(0.05, startT);
        g.gain.exponentialRampToValueAtTime(0.001, startT + 0.07);
        s.connect(filt).connect(g).connect(this.musicBus);
        s.start(startT); s.stop(startT + 0.1);
        this.sources.push(s);
      }
    };

    let counter = 0;
    let t0 = this.ctx.currentTime + 0.1;
    const schedule = () => {
      if(!this.playing) return;
      for(let i=0;i<8;i++){ step(counter++, t0 + i*beat); }
      t0 += 8*beat;
      this.timers.push(setTimeout(schedule, 8*beat*1000 - 200));
    };
    schedule();
  },

  _noiseBuffer(seconds){
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr*seconds, sr);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2 - 1); }
    return buf;
  },

  _startRain(level){
    // Use a long noise loop through a lowpass for soft rain
    const buf = this._noiseBuffer(2);
    const s = this.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 1400; filt.Q.value = 0.5;
    const g = this.ctx.createGain();
    g.gain.value = (level != null ? level : 0.18);
    s.connect(filt).connect(g).connect(this.musicBus);
    s.start();
    this.sources.push(s);
  }
};

/* YouTube IFrame API loader */
function loadYTAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(window._ytLoading){ window._ytWaiters.push(cb); return; }
  window._ytLoading = true;
  window._ytWaiters = [cb];
  window.onYouTubeIframeAPIReady = () => {
    window._ytWaiters.forEach(f => { try{ f(); }catch(e){} });
    window._ytWaiters = [];
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.async = true;
  document.head.appendChild(s);
}

/* UI hooks for music panel */
function toggleMusicPanel(e){
  if(e) e.stopPropagation();
  const p = document.getElementById("musicPanel");
  p.classList.toggle("open");
}
function togglePlay(){
  AudioEngine.click();
  const NL = state.lang === "nl";
  if(AudioEngine.playing){
    AudioEngine.stop();
    document.getElementById("musicPlayBtn").innerHTML = "▶️ " + (NL?"Speel":"Play");
    document.getElementById("btnMusic").classList.remove("on");
    document.getElementById("btnMusic").classList.add("off");
    document.getElementById("musicHint").textContent = "";
  } else {

// Unlock audio on the very first user gesture (some browsers start AudioContext suspended)
function _unlockAudioOnce(){
  AudioEngine.ensure();
  if(AudioEngine.ctx && AudioEngine.ctx.state === "suspended"){
    AudioEngine.ctx.resume();
  }
  // Silent tap so iOS/Safari treats the context as "running"
  AudioEngine.blip(440, 0.001, "sine", 0.0001);
  document.removeEventListener("pointerdown", _unlockAudioOnce, true);
  document.removeEventListener("touchstart", _unlockAudioOnce, true);
  document.removeEventListener("keydown", _unlockAudioOnce, true);
}

/* =========================================================================
   SCORING & PROGRESS TRACKER
   - cards[<topic>:<idx>] = { seen, correct, wrong, streak, mastered, lastSeen }
   - sessions = [{ date, topic, mode, correct, wrong, total, bestStreak }]
   - daily = { lastDate, streak, longest }
   - totals = { correct, wrong, seen, sessions }
   - achievements = { id: true }
   ========================================================================= */

const SCORE_KEY = "mk_score_v1";

function loadScore(){
  try{
    const raw = localStorage.getItem(SCORE_KEY);
    if(!raw) return defaultScore();
    const s = JSON.parse(raw);
    // Fill any missing branches
    return Object.assign(defaultScore(), s, {
      cards: Object.assign({}, s.cards||{}),
      timelines: Object.assign({}, s.timelines||{}),
      sessions: s.sessions || [],
      achievements: Object.assign({}, s.achievements||{})
    });
  }catch(e){ return defaultScore(); }
}
function defaultScore(){
  return {
    cards: {},
    timelines: {},
    sessions: [],
    daily: { lastDate: null, streak: 0, longest: 0 },
    totals: { correct: 0, wrong: 0, seen: 0, sessions: 0 },
    achievements: {}
  };
}
function saveScore(s){
  try{ localStorage.setItem(SCORE_KEY, JSON.stringify(s)); }catch(e){}
}

let SCORE = loadScore();

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateMinus(daysBefore){
  const d = new Date();
  d.setDate(d.getDate()-daysBefore);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// Mastery rule: 3 correct in a row OR 5 correct overall with >=70% accuracy
function isMastered(card){
  if(!card) return false;
  if((card.streak||0) >= 3) return true;
  if((card.correct||0) >= 5 && card.correct/(card.correct+card.wrong) >= 0.7) return true;
  return false;
}

function recordCard(topicKey, cardIdx, gotRight){
  const k = topicKey+":"+cardIdx;
  const c = SCORE.cards[k] || { seen:0, correct:0, wrong:0, streak:0, mastered:false, lastSeen:null };
  c.seen += 1;
  c.lastSeen = Date.now();
  if(gotRight){ c.correct += 1; c.streak = (c.streak||0)+1; }
  else { c.wrong += 1; c.streak = 0; }
  c.mastered = isMastered(c);
  SCORE.cards[k] = c;
  SCORE.totals.correct += gotRight ? 1 : 0;
  SCORE.totals.wrong   += gotRight ? 0 : 1;
  SCORE.totals.seen    += 1;
  saveScore(SCORE);
}

function updateDailyStreak(){
  const today = todayKey();
  if(SCORE.daily.lastDate === today) return; // already counted today
  const yest = dateMinus(1);
  if(SCORE.daily.lastDate === yest) SCORE.daily.streak += 1;
  else SCORE.daily.streak = 1;
  SCORE.daily.lastDate = today;
  if(SCORE.daily.streak > (SCORE.daily.longest||0)) SCORE.daily.longest = SCORE.daily.streak;
  saveScore(SCORE);
}

function recordSession(sess){
  SCORE.sessions.unshift({ ...sess, date: new Date().toISOString() });
  if(SCORE.sessions.length > 30) SCORE.sessions.length = 30;
  SCORE.totals.sessions += 1;
  updateDailyStreak();
  checkAchievements(sess);
  saveScore(SCORE);
}

/* Mastery rule for a single timeline: 2 perfect (no-mistake) runs. */
function isTimelineMastered(t){
  if(!t) return false;
  return (t.perfectRuns||0) >= 2;
}

function recordTimeline(id, type, ok, bad){
  const t = SCORE.timelines[id] || {
    runs:0, perfectRuns:0, correct:0, wrong:0, mastered:false, lastDone:null, type
  };
  t.type = type;
  t.runs    += 1;
  t.correct += ok;
  t.wrong   += bad;
  t.lastDone = Date.now();
  if(bad === 0) t.perfectRuns = (t.perfectRuns||0) + 1;
  t.mastered = isTimelineMastered(t);
  SCORE.timelines[id] = t;
  // Roll up into shared totals so streaks/sessions count
  SCORE.totals.correct += ok;
  SCORE.totals.wrong   += bad;
  SCORE.totals.seen    += (ok + bad);
  SCORE.totals.sessions += 1;
  // Treat the practice as a one-off session for daily-streak/badge purposes
  SCORE.sessions.unshift({
    kind: "timeline", id, type, total: ok+bad, correct: ok, wrong: bad,
    bestStreak: bad === 0 ? (ok) : 0,
    date: new Date().toISOString()
  });
  if(SCORE.sessions.length > 30) SCORE.sessions.length = 30;
  updateDailyStreak();
  checkAchievements(SCORE.sessions[0]);
  saveScore(SCORE);
}

function timelineMasteryPct(s){
  const total = (typeof TIMELINES !== "undefined") ? TIMELINES.length : 0;
  if(!total) return 0;
  const tl = s.timelines || {};
  let m = 0;
  Object.values(tl).forEach(t => { if(t.mastered) m++; });
  return Math.round((m/total)*100);
}
function timelinesTouched(s){
  return Object.keys(s.timelines||{}).length;
}
function timelinesPerfectCount(s){
  return Object.values(s.timelines||{}).filter(t => (t.perfectRuns||0) >= 1).length;
}
function sequenceMasteryAll(s){
  if(typeof TIMELINES === "undefined") return false;
  const seqIds = TIMELINES.filter(t => t.type === "sequence").map(t => t.id);
  return seqIds.length && seqIds.every(id => (s.timelines[id] && s.timelines[id].mastered));
}

function topicMasteryPct(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  if(!total) return 0;
  let mastered = 0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(c && c.mastered) mastered++;
  }
  return Math.round((mastered/total)*100);
}

// Dutch exam-style 1-10 grade per topic + passing status.
// 5.5+ with at least 50% coverage = "passing" (geslaagd).
// 4.0-5.4 = "almost" (bijna). Below 4 = "needs work" (meer oefenen).
// Too few cards seen = "starting" (aan het leren). None seen = "untouched".
function topicGrade(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  if(!total) return { status:"untouched" };
  let correct=0, wrong=0, seen=0, mastered=0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(!c) continue;
    seen++;
    correct += c.correct||0;
    wrong   += c.wrong||0;
    if(c.mastered) mastered++;
  }
  if(seen === 0) return { status:"untouched", grade:null, total };
  const attempts = correct + wrong;
  const accuracy = attempts ? correct/attempts : 0;
  const coverage = seen / total;
  const masteryPct = mastered / total;
  // Effective grade: blend accuracy (60%) with mastery (40%) and scale by coverage.
  // Coverage below 50% drags the grade down (you might be lucky but unprepared).
  const coverageFactor = Math.min(1, coverage / 0.5);
  const rawGrade = ((accuracy * 0.6) + (masteryPct * 0.4)) * 10 * coverageFactor;
  const grade = Math.round(rawGrade * 10) / 10;
  let status;
  if(seen < Math.min(8, Math.ceil(total*0.2))) status = "starting";
  else if(grade >= 5.5 && coverage >= 0.5) status = "passing";
  else if(grade >= 4.0) status = "almost";
  else status = "needsWork";
  return { status, grade, coverage, accuracy, masteryPct, seen, total };
}

function statusInfo(status, lang){
  const NL = lang === "nl";
  switch(status){
    case "passing":   return { ico:"✅", cls:"st-pass",   label: NL?"Geslaagd":"Passing" };
    case "almost":    return { ico:"⚠️", cls:"st-almost", label: NL?"Bijna":"Almost" };
    case "needsWork": return { ico:"❗", cls:"st-low",    label: NL?"Meer oefenen":"Keep studying" };
    case "starting":  return { ico:"📚", cls:"st-start",  label: NL?"Aan het leren":"Learning" };
    default:          return { ico:"⭕", cls:"st-none",   label: NL?"Start hier":"Start here" };
  }
}
function topicCounts(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  let seen=0, mastered=0, struggling=0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(!c) continue;
    seen++;
    if(c.mastered) mastered++;
    else if(c.wrong > c.correct) struggling++;
  }
  return { total, seen, mastered, struggling };
}

function checkAchievements(lastSession){
  let newOnes = [];
  ACHIEVEMENTS.forEach(a => {
    if(!SCORE.achievements[a.id] && a.test(SCORE, lastSession)){
      SCORE.achievements[a.id] = Date.now();
      newOnes.push(a);
    }
  });
  if(newOnes.length){
    setTimeout(()=>{
      AudioEngine.correct();
      confetti(60);
      // Show a tiny toast
      newOnes.forEach((a,i)=>{
        setTimeout(()=> showToast(`${a.ico} ${a.ttl[state.lang]} ${state.lang==="nl"?"behaald!":"unlocked!"}`), i*900);
      });
    }, 300);
  }
}

function showToast(msg){
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;box-shadow:0 10px 24px rgba(0,0,0,.25);z-index:9999;font-size:.9rem;animation:toastIn .3s ease;";
  document.body.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s, transform .4s"; t.style.opacity="0"; t.style.transform="translateX(-50%) translateY(20px)"; setTimeout(()=>t.remove(),420); }, 2400);
}

const STAR_KEY = "mkstarred";
function getStars(){ try{ return JSON.parse(localStorage.getItem(STAR_KEY)||"{}"); }catch(e){ return {}; } }
function setStar(topic, idx, on){

/* =========================================================================
   HELPERS
   ========================================================================= */

function L(){ return i18n[state.lang]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalize(s){
  return (s||"").toLowerCase()
    .replace(/[áàäâã]/g,"a").replace(/[éèëê]/g,"e").replace(/[íìïî]/g,"i")
    .replace(/[óòöôõ]/g,"o").replace(/[úùüû]/g,"u").replace(/ç/g,"c")
    .replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim();
}
function keyWords(s){
  const stop = new Set(["the","a","an","of","to","in","is","are","be","by","or","and","with","that","this","on","for","as","it","een","de","het","van","en","of","is","zijn","te","door","bij","op","met","aan","dat","die","ook","of","voor"]);
  return normalize(s).split(" ").filter(w=>w.length>3 && !stop.has(w));
}
function similarity(user, answer){
  const u = new Set(keyWords(user));
  const a = keyWords(answer);
  if(a.length===0) return 0;
  let hits = 0;
  a.forEach(w => { if(u.has(w)) hits++; });
  return hits / a.length;
}

function closeShareModal(){

  const m = document.getElementById("shareModal");
  if(m) m.remove();
}
function copyShareText(){
  const ta = document.getElementById("shareText");
  if(!ta) return;
  const NL = state.lang === "nl";
  const status = document.getElementById("shareCopyStatus");
  const ok = NL ? "Gekopieerd! Plak het nu in WhatsApp ✿" : "Copied! Now paste it in WhatsApp ✿";
  const fail = NL ? "Hmm, kon niet kopiëren — selecteer de tekst en kopieer handmatig." : "Hmm, couldn't copy — select the text and copy manually.";
  const text = ta.value;
  const done = (good) => {
    if(status){
      status.textContent = good ? ok : fail;
      status.className = "share-copy-status " + (good ? "ok" : "bad");
    }
    if(good && AudioEngine.correct) AudioEngine.correct();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>{
      // Fallback to execCommand
      try{
        ta.focus(); ta.setSelectionRange(0, ta.value.length);
        const did = document.execCommand("copy");
        done(did);
      }catch(e){ done(false); }
    });
  } else {
    try{
      ta.focus(); ta.setSelectionRange(0, ta.value.length);
      const did = document.execCommand("copy");
      done(did);
    }catch(e){ done(false); }
  }
}
function sysShareReport(){
  const ta = document.getElementById("shareText");
  if(!ta || !navigator.share) return;
  const NL = state.lang === "nl";
  navigator.share({
    title: NL ? "Maisie's studievoortgang" : "Maisie's study progress",
    text: ta.value
  }).catch(()=>{});
}

  const lines = [];
  lines.push(NL ? `Hi mam! Hier is mijn voortgang ☆.｡` : `Hi mom! Here's my progress ☆.｡`);
  lines.push("");
  if(d !== null) lines.push(NL ? `Examen over: ${d} dag${d===1?"":"en"}` : `Exam in: ${d} day${d===1?"":"s"}`);
  lines.push(NL ? `Dagstreak: ${SCORE.daily.streak||0} dag${(SCORE.daily.streak||0)===1?"":"en"}` : `Day streak: ${SCORE.daily.streak||0} day${(SCORE.daily.streak||0)===1?"":"s"}`);
  lines.push(NL ? `Sessies totaal: ${SCORE.totals.sessions}` : `Total sessions: ${SCORE.totals.sessions}`);
  lines.push(NL ? `Kaarten gezien: ${SCORE.totals.seen}` : `Cards seen: ${SCORE.totals.seen}`);
  lines.push(NL ? `Totale nauwkeurigheid: ${acc}% (${SCORE.totals.correct} goed / ${SCORE.totals.wrong} fout)`
                : `Overall accuracy: ${acc}% (${SCORE.totals.correct} right / ${SCORE.totals.wrong} wrong)`);
  lines.push("");
  lines.push(NL ? "— ONDERWERPEN —" : "— TOPICS —");
  ["politiek","criminaliteit","media","analyse","invalshoeken"].forEach(k => {
    const g = topicGrade(SCORE, k);
    const tc = topicCounts(SCORE, k);
    const label = (DATA[k]||{label:{nl:k,en:k}}).label[NL?"nl":"en"];
    const grade = (g.grade!=null) ? g.grade.toFixed(1) : "–";
    const statusTxt = ({passing: NL?"geslaagd":"passing", almost: NL?"bijna":"almost", needsWork: NL?"meer oefenen":"keep studying", starting: NL?"net begonnen":"just started", untouched: NL?"nog niet":"untouched"})[g.status] || "";
    lines.push(`• ${label}: ${tc.mastered}/${tc.total} ${NL?"beheerst":"mastered"} · ${NL?"cijfer":"grade"} ${grade} (${statusTxt})`);
  });
  lines.push("");
  if(typeof TIMELINES !== "undefined"){
    const tl = SCORE.timelines || {};
    const masteredTl = Object.values(tl).filter(t=>t.mastered).length;
    lines.push(NL ? `— TIJDLIJNEN & VOLGORDES — (${masteredTl}/${TIMELINES.length} ${NL?"beheerst":"mastered"})` : `— TIMELINES & SEQUENCES — (${masteredTl}/${TIMELINES.length} mastered)`);
    TIMELINES.forEach(t => {
      const p = tl[t.id];
      const title = t.title[NL?"nl":"en"];
      if(!p) lines.push(`• ${title}: ${NL?"nog niet geprobeerd":"not tried"}`);
      else if(p.mastered) lines.push(`• ${title}: ★ ${NL?"beheerst":"mastered"} (${p.perfectRuns}× ${NL?"foutloos":"flawless"}, ${p.runs} ${NL?"runs":"runs"})`);
      else lines.push(`• ${title}: ${p.runs} ${NL?"runs":"runs"}, ${p.correct} ${NL?"juist":"right"} / ${p.wrong} ${NL?"fout":"wrong"}, ${p.perfectRuns||0}× ${NL?"foutloos":"flawless"}`);
    });
    lines.push("");
  }
  const unlocked = ACHIEVEMENTS.filter(a => SCORE.achievements[a.id]);
  lines.push(NL ? `— BADGES — (${unlocked.length}/${ACHIEVEMENTS.length})` : `— BADGES — (${unlocked.length}/${ACHIEVEMENTS.length})`);
  unlocked.forEach(a => lines.push(`• ${a.ttl[NL?"nl":"en"]} — ${a.sub[NL?"nl":"en"]}`));
  if(!unlocked.length) lines.push(NL ? `(nog geen badges)` : `(no badges yet)`);
  lines.push("");
  lines.push(NL ? `xo, Maisie ♡` : `xo, Maisie ♡`);
  return lines.join("\n");
}

// Fetch a Wikipedia lead image via MediaWiki's pageimages API.
// `redirects=1` follows article redirects so we don't have to know exact titles.
async function fetchWikiImage(title){
  const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail%7Coriginal&pithumbsize=600&redirects=1&titles=${encodeURIComponent(title)}&origin=*`;
  try{
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok){ console.warn("Wiki fetch HTTP", r.status, title); return null; }
    const data = await r.json();
    const pages = data && data.query && data.query.pages;
    if(!pages){ console.warn("Wiki fetch no pages", title); return null; }
    for(const k in pages){
      const p = pages[k];
      const src = (p.thumbnail && p.thumbnail.source) || (p.original && p.original.source);
      if(src) return src;
    }
    console.warn("Wiki fetch no thumbnail", title);
    return null;
  }catch(e){
    console.warn("Wiki image fetch failed for", title, e.message);
    return null;
  }
}

function injectPraktijkImage(wikiTitle, src){
  if(!src) return;
  const wrap = document.querySelector(`[data-prk-img="${wikiTitle}"]`);
  if(!wrap || wrap.querySelector("img")) return;
  // Force wrap shape via inline styles so cached/old CSS can't crop the image
  wrap.style.cssText += ";min-height:120px;max-height:none;padding:8px;display:flex;align-items:center;justify-content:center;overflow:visible;";
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.loading = "lazy";
  // Inline styles win over any cached CSS — guarantees the image isn't cropped
  img.style.cssText = "max-width:100%;max-height:180px;width:auto;height:auto;object-fit:contain;display:block;border-radius:10px;";
  img.onerror = () => { img.remove(); };
  const credit = document.createElement("a");
  credit.className = "prk-img-credit";
  credit.target = "_blank";
  credit.rel = "noopener";
  credit.href = `https://en.wikipedia.org/wiki/${wikiTitle}`;
  credit.textContent = "Wikipedia ↗";
  const placeholder = wrap.querySelector(".prk-img-placeholder");
  if(placeholder) placeholder.remove();
  wrap.appendChild(img);
  wrap.appendChild(credit);
}

  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function currentlyToday(lang){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  if(lang === "nl"){

  return `${days[d.getDay()]} · ${dd}.${mm}.${yyyy}`;
}

const MOOD_KEY = "mk_mood_v1";

function getMoodId(){
  try{ return localStorage.getItem(MOOD_KEY) || "auto"; }catch(e){ return "auto"; }
}
function getMoodOption(id){
  return MOOD_OPTIONS.find(m => m.id === id) || MOOD_OPTIONS[0];
}
function setMood(id){
  try{ localStorage.setItem(MOOD_KEY, id); }catch(e){}
  if(state.view === "home"){
    // Re-render just the mood cell, don't rebuild the whole home page
    const el = document.getElementById("curMood");
    if(el){
      el.innerHTML = renderMoodCell();
    }
  }
}
function renderMoodCell(){
  const id = getMoodId();
  const opt = getMoodOption(id);
  if(id === "auto"){
    const today = new Date();
    const exam = new Date(state.examDate+"T08:00:00");
    const daysToExam = Math.max(0, Math.ceil((exam - today)/(1000*60*60*24)));
    const wRaw = (function(){ try{ return JSON.parse(localStorage.getItem(CURRENTLY_WEATHER_KEY)||"null"); }catch(e){ return null;} })();
    const code = wRaw ? wRaw.code : null;
    const computed = currentlyMood(daysToExam, code, state.lang);
    return `<span class="cur-mood-ico">✦</span>` + buildMoodSelect("auto", computed);
  }
  const labelText = state.lang === "nl" ? opt.nl : opt.en;
  return `<span class="cur-mood-ico">${opt.ico}</span>` + buildMoodSelect(id, labelText);
}
function buildMoodSelect(currentId, displayLabel){
  // Render the <select> with options; the currently-selected one shows in the closed state.
  // Icons live in the external .cur-mood-ico span — don't repeat them inside options.
  const opts = MOOD_OPTIONS.map(m => {
    const lab = state.lang === "nl" ? m.nl : m.en;
    const sel = m.id === currentId ? " selected" : "";
    // For "auto", show the live computed label so the closed select reads naturally
    const shown = (m.id === "auto" && currentId === "auto")
      ? displayLabel
      : lab;
    return `<option value="${m.id}"${sel}>${shown}</option>`;
  }).join("");
  return `<select class="mood-select" onchange="setMood(this.value)">${opts}</select>`;
}

function currentlyMood(daysToExam, weatherCode, lang){
  // Mood is exam-pressure first, weather second, kept light.
  let phrase;
  if(daysToExam <= 1)      phrase = lang==="nl" ? "klaar voor de strijd" : "ready for it";
  else if(daysToExam <= 3) phrase = lang==="nl" ? "vol focus"            : "in deep focus";
  else if(daysToExam <= 7) phrase = lang==="nl" ? "lekker bezig"          : "on a roll";
  else                     phrase = lang==="nl" ? "rustig aan"            : "taking it slow";

  const w = WMO[weatherCode];
  if(w && w.mood){
    if(w.mood === "knus")    phrase += lang==="nl" ? " · knus binnen"  : " · cozy inside";
    if(w.mood === "zonnig")  phrase += lang==="nl" ? " · zonnig"        : " · sunny vibes";
    if(w.mood === "dromerig")phrase += lang==="nl" ? " · dromerig"      : " · dreamy";
    if(w.mood === "intens")  phrase += lang==="nl" ? " · alles op alles": " · all in";
    if(w.mood === "licht")   phrase += lang==="nl" ? " · luchtig"       : " · breezy";
  }
  return phrase;
}

const CURRENTLY_WEATHER_KEY = "mk_weather_v1";

async function loadWeather(){
  if(state.view !== "home") return;
  const el = document.getElementById("curWeather");
  if(!el) return;
  const NL = state.lang === "nl";

  // Cached value (re-use for 30 minutes)
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CURRENTLY_WEATHER_KEY) || "null"); }catch(e){}
  if(cached && (Date.now() - cached.t) < 30 * 60 * 1000){
    applyWeatherToCurrently(cached.temp, cached.code);
    return;
  }

  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CURRENTLY_COORDS.lat}&longitude=${CURRENTLY_COORDS.lon}&current_weather=true&temperature_unit=celsius`;
    const r = await fetch(url);
    if(!r.ok){ el.textContent = NL ? "—" : "—"; return; }
    const data = await r.json();
    const cw = data && data.current_weather;
    if(!cw){ el.textContent = "—"; return; }
    const temp = Math.round(cw.temperature);
    const code = cw.weathercode;
    try{ localStorage.setItem(CURRENTLY_WEATHER_KEY, JSON.stringify({temp, code, t: Date.now()})); }catch(e){}
    applyWeatherToCurrently(temp, code);
  }catch(e){
    el.textContent = NL ? "—" : "—";
  }
}

function applyWeatherToCurrently(temp, code){
  const el = document.getElementById("curWeather");
  const moodEl = document.getElementById("curMood");
  if(!el) return;
  const w = WMO[code] || { nl:"—", en:"—" };
  el.innerHTML = `<b>${temp}°C</b> · ${w[state.lang] || w.nl}`;
  // Only refresh the mood line if user has it on "auto"
  if(moodEl && getMoodId() === "auto"){
    moodEl.innerHTML = renderMoodCell();
  }
}

/* ═══════════════════════════════════════════════
   GUESTBOOK — every GitHub Issue is one note.
   To leave a new message, open a new issue in the
   repo from any device (the GitHub mobile app's
   "+" button is fastest). Title becomes the note
   headline, body becomes the message. The page
   reads them all via the public API.
   ═══════════════════════════════════════════════ */
const GUESTBOOK_REPO = "mrawson85/mrawson85.github.io";
// Show every open issue as a note. (Use ["maisie"] etc. to filter by title.)
const GUESTBOOK_TITLE_MATCH = [""];

function guestbookWriteURL(){
  return `https://github.com/${GUESTBOOK_REPO}/issues/new?title=To%20Maisie&body=`;
}

function guestbookFmtDate(iso, lang){
  try{
    const d = new Date(iso);
    const months = lang === "nl"
      ? ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"]
      : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${d.getDate()} ${months[d.getMonth()]}`;
  }catch(e){ return ""; }
}

async function loadGuestbook(force){
  if(state.view !== "home") return;
  const list = document.getElementById("guestList");
  if(!list) return;
  const NL = state.lang === "nl";

  const CACHE_KEY = "mk_guest_v3";
  // wipe older caches so a previously-filtered list can't haunt the panel
  try{ localStorage.removeItem("mk_guest_v1"); localStorage.removeItem("mk_guest_v2"); }catch(e){}
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(e){}
  if(!force && cached && cached.items && (Date.now() - (cached.t||0) < 10*60*1000)){
    renderGuestbook(cached.items);
  } else if(force){
    list.innerHTML = `<div class="guest-empty">${NL?"berichtjes verversen…":"refreshing…"}</div>`;
  }

  const repoUrl = `https://github.com/${GUESTBOOK_REPO}/issues`;
  const apiUrl  = `https://api.github.com/repos/${GUESTBOOK_REPO}/issues?state=open&per_page=30&sort=created&direction=desc&_=${Date.now()}`;
  const onFileProto = (typeof location !== "undefined" && location.protocol === "file:");
  // Multiple CORS proxy fallbacks — if api.github.com is blocked (extension,
  // corporate firewall, browser quirk), retry through a public proxy.
  const proxies = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(u)}`
  ];
  const urlsToTry = onFileProto
    ? [proxies[0](apiUrl), apiUrl, proxies[1](apiUrl), proxies[2](apiUrl)]
    : [apiUrl, proxies[0](apiUrl), proxies[1](apiUrl), proxies[2](apiUrl)];

  const renderErr = (mainMsg, detail) => {
    if(cached && cached.items && cached.items.length){
      renderGuestbook(cached.items, mainMsg);
      return;
    }
    list.innerHTML = `
      <div class="guest-empty">
        <div style="margin-bottom:6px;">${mainMsg}</div>
        ${detail ? `<div style="font-size:.72rem;color:var(--ink-mute);">${detail}</div>` : ""}
        <div style="font-size:.7rem;margin-top:8px;font-family:'Pixelify Sans',monospace;letter-spacing:.1em;">
          ${NL?"Ingesteld op":"Configured for"}: <a href="${repoUrl}" target="_blank" rel="noopener" style="color:var(--accent);">${GUESTBOOK_REPO}</a>
        </div>
      </div>`;
  };

  let data = null, lastStatus = 0, lastError = null;
  for(const u of urlsToTry){
    try{
      const r = await fetch(u, {
        headers: { "Accept": "application/vnd.github+json", "Cache-Control": "no-cache" },
        cache: "no-store"
      });
      lastStatus = r.status;
      if(r.ok){
        data = await r.json();
        break;
      }
    }catch(e){
      lastError = e;
      console.warn("Guestbook fetch attempt failed", u, e && e.message);
      // continue to next URL
    }
  }
  if(data === null){
    let main, detail;
    if(lastStatus === 403){
      main   = NL ? "te vaak ververst — even wachten" : "rate limited — wait a minute";
      detail = NL ? "GitHub staat 60 verzoeken per uur toe zonder login." : "GitHub allows 60 requests/hour unauthenticated.";
    } else if(lastStatus === 404){
      main   = NL ? "repo niet gevonden" : "repo not found";
      detail = NL ? "Pas GUESTBOOK_REPO bovenaan het script aan." : "Edit GUESTBOOK_REPO at the top of the script.";
    } else if(lastError){
      main   = NL ? "netwerkfout bij het laden van berichtjes" : "network error loading messages";
      detail = onFileProto
        ? (NL ? "Werkt het beste via GitHub Pages (file:// blokkeert vaak)." : "Works best via GitHub Pages (file:// often blocks fetch).")
        : (lastError.message || "");
    } else {
      main   = NL ? `kon berichtjes niet laden (HTTP ${lastStatus})` : `couldn't load messages (HTTP ${lastStatus})`;
      detail = "";
    }
    renderErr(main, detail);
    return;
  }
  try{
    const matches = GUESTBOOK_TITLE_MATCH.map(s => String(s).toLowerCase());
    const items = (Array.isArray(data) ? data : [])
      // GitHub's /issues endpoint returns PRs too — filter them out
      .filter(it => !it.pull_request)
      // Title filter (case-insensitive substring)
      .filter(it => {
        if(!matches.length || matches[0] === "") return true;
        const t = String(it.title || "").toLowerCase();
        return matches.some(m => t.includes(m));
      })
      .map(it => ({
        title:  String(it.title || "").trim(),
        author: (it.user && it.user.login) || "Anon",
        body:   String(it.body || "").trim(),
        date:   it.created_at,
        url:    it.html_url,
        number: it.number
      }))
      .filter(it => it.body.length > 0);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items, t: Date.now()})); }catch(e){}
    renderGuestbook(items);
  }catch(e){
    console.warn("Guestbook render error", e && e.message);
    const main = NL ? "fout bij verwerken van berichtjes" : "couldn't process messages";
    renderErr(main, e && e.message ? e.message : "");
  }
}

  AudioEngine.click();

    localStorage.removeItem("mk_guest_v3");
    localStorage.removeItem("mk_guest_v2");

function renderGuestbook(items, warning){
  const list = document.getElementById("guestList");
  if(!list) return;
  const NL = state.lang === "nl";
  if(!items.length){
    list.innerHTML = `<div class="guest-empty">${NL?"nog geen berichtjes — schrijf de eerste!":"no notes yet — write the first one!"}</div>`;
    return;
  }
  let html = items.map(it => `
    <div class="guest-card">
      <div class="meta"><b>${escapeText(it.author)}</b> · ${guestbookFmtDate(it.date, state.lang)}</div>
      <div class="body">${escapeText(it.body).replace(/\n+/g, "<br>")}</div>
      ${it.title ? `<div class="title">— ${escapeText(it.title)}</div>` : ""}
    </div>
  `).join("");
  if(warning){
    html += `<div class="guest-empty" style="text-align:right;">${warning}</div>`;
  }
  list.innerHTML = html;
}

function escapeText(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function loadPraktijkImages(){
  if(state.view !== "praktijk") return;
  const cache = getPraktijkImageCache();

  // 1) inject anything we already have cached
  PRAKTIJK_EXAMPLES.forEach(ex => {
    if(ex.wiki && cache[ex.wiki] && cache[ex.wiki].src){
      injectPraktijkImage(ex.wiki, cache[ex.wiki].src);
    }
  });

  // 2) fetch the rest in parallel
  const todo = PRAKTIJK_EXAMPLES.filter(ex => ex.wiki && !(cache[ex.wiki] && cache[ex.wiki].src));
  if(todo.length === 0) return;

  // Update placeholder to "loading…"
  todo.forEach(ex => {
    const ph = document.querySelector(`[data-prk-img="${ex.wiki}"] .prk-img-placeholder`);
    if(ph) ph.innerHTML = `<div style="font-size:.78rem;color:#94a3b8;font-weight:700;">🌐 ${state.lang==="nl"?"foto laden…":"loading photo…"}</div>`;
  });

  const results = await Promise.all(todo.map(ex => fetchWikiImage(ex.wiki).then(src => ({ex, src}))));
  let changed = false;
  results.forEach(({ex, src}) => {
    if(src){
      cache[ex.wiki] = { src, t: Date.now() };
      changed = true;
      injectPraktijkImage(ex.wiki, src);
    } else {
      const ph = document.querySelector(`[data-prk-img="${ex.wiki}"] .prk-img-placeholder`);
      if(ph) ph.textContent = ex.icon;
    }
  });
  if(changed) savePraktijkImageCache(cache);
}

/* ── Practice-mode state ──────────────────────────── */
let tlPrac = null;  // {id, type, lang, order:[shuffledIndices], placed:[], wrongIdx:null, qIdx:0, questions:[...], score:{ok,bad}, done:false}

function openTlPractice(id){
  AudioEngine.pop();
  const tl = TIMELINES.find(t => t.id === id);
  if(!tl) return;
  tlPrac = startTlPracticeSession(tl);
  state.view = "tlPractice";
  render();
}

function startTlPracticeSession(tl){
  const sess = { id: tl.id, type: tl.type, score: { ok: 0, bad: 0 }, done: false };
  if(tl.type === "sequence"){
    // shuffled visible chip indices
    const idxs = tl.steps.map((_, i) => i);
    // Fisher–Yates
    for(let i=idxs.length-1; i>0; i--){
      const j = Math.floor(Math.random() * (i+1));
      [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
    }
    sess.order   = idxs;        // the shuffled positions on screen
    sess.placed  = [];          // user's chosen indices so far (must match 0,1,2,...)
    sess.wrong   = new Set();   // currently-flashing wrong chips (visual only)
  } else {
    // numbers / cycles / date → multiple-choice quiz
    sess.questions = buildTlQuiz(tl);
    sess.qIdx      = 0;
    sess.answered  = false;
    sess.picked    = -1;
  }
  return sess;
}

function buildTlQuiz(tl){
  const NL_Q = {
    leeftijden:  "Vanaf welke leeftijd:",
    vasthoudtijden: "Hoeveel uur:",
    cycli:       "Hoe vaak:",
    prinsjesdag: "Wanneer / wat:"
  };
  const EN_Q = {
    leeftijden:  "From which age:",
    vasthoudtijden: "How many hours:",
    cycli:       "How often:",
    prinsjesdag: "When / what:"
  };
  // Distractor pools per timeline id
  const POOLS = {
    leeftijden:    ["10","12","14","16","18","21","23","25"],
    vasthoudtijden:["3 u","6 u","9 u","12 u","24 u","48 u","+"],
    cycli:         ["1 jr","2 jr","3 jr","4 jr","5 jr","6 jr","10 jr"]
  };
  const questions = [];

  if(tl.id === "prinsjesdag"){
    // Q1: When is Prinsjesdag?
    questions.push({
      prompt: { nl: "Wanneer is Prinsjesdag?", en: "When is Prinsjesdag?" },
      correct: { nl: "Derde dinsdag van september", en: "Third Tuesday of September" },
      options: [
        { nl: "Derde dinsdag van september", en: "Third Tuesday of September" },
        { nl: "Eerste maandag van september", en: "First Monday of September" },
        { nl: "Tweede dinsdag van januari", en: "Second Tuesday of January" },
        { nl: "Laatste zondag van mei", en: "Last Sunday of May" }
      ]
    });
    // Q2: What does the king read?
    questions.push({
      prompt: { nl: "Wat leest de koning op Prinsjesdag voor?", en: "What does the king read on Prinsjesdag?" },
      correct: { nl: "De Troonrede — de plannen van de regering", en: "The Throne Speech — the government's plans" },
      options: [
        { nl: "De Troonrede — de plannen van de regering", en: "The Throne Speech — the government's plans" },
        { nl: "Het regeerakkoord — de coalitie-afspraken", en: "The coalition agreement — coalition deal" },
        { nl: "De grondwet — de basiswetten",                en: "The constitution — the basic laws" },
        { nl: "Het partijprogramma — verkiezingsbeloftes",   en: "The party programme — election promises" }
      ]
    });
    // Q3: Miljoenennota
    questions.push({
      prompt: { nl: "Wat is de miljoenennota?", en: "What is the miljoenennota?" },
      correct: { nl: "De begroting voor het komende jaar", en: "Next year's budget" },
      options: [
        { nl: "De begroting voor het komende jaar", en: "Next year's budget" },
        { nl: "De jaarrekening van het afgelopen jaar", en: "Last year's accounts" },
        { nl: "De troonrede zelf", en: "The Throne Speech itself" },
        { nl: "Het regeerakkoord", en: "The coalition agreement" }
      ]
    });
    return questions;
  }

  // For numeric / cycle timelines: each step becomes one question
  const pool = POOLS[tl.id] || [];
  tl.steps.forEach(s => {
    if(!s.num) return;
    const correct = s.num;
    // Build distractors: 3 different values from pool (or close numbers)
    const others = pool.filter(p => p !== correct);
    // shuffle others
    for(let i=others.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [others[i], others[j]] = [others[j], others[i]];
    }
    const distract = others.slice(0, 3);
    const optsRaw = [correct, ...distract];
    // shuffle final
    for(let i=optsRaw.length-1; i>0; i--){
      const j = Math.floor(Math.random()*(i+1));
      [optsRaw[i], optsRaw[j]] = [optsRaw[j], optsRaw[i]];
    }
    questions.push({
      prompt:  { nl: (NL_Q[tl.id] || "") + " " + s.nl, en: (EN_Q[tl.id] || "") + " " + s.en },
      correct: { nl: correct, en: correct },
      options: optsRaw.map(v => ({ nl: v, en: v }))
    });
  });
  return questions;
}

/* — sequence interaction — */
function tlTapStep(visIdx){
  if(!tlPrac || tlPrac.done) return;
  const tl = TIMELINES.find(t => t.id === tlPrac.id);
  if(!tl) return;
  const targetIdx = tlPrac.order[visIdx];   // the underlying step the user tapped
  const expected  = tlPrac.placed.length;   // we want them in 0,1,2,…
  if(tlPrac.placed.includes(visIdx)) return; // already placed

  if(targetIdx === expected){
    tlPrac.placed.push(visIdx);
    tlPrac.score.ok++;
    AudioEngine.correct && AudioEngine.correct();
    if(tlPrac.placed.length === tl.steps.length){
      tlPrac.done = true;
      AudioEngine.win && AudioEngine.win();
      recordTimeline(tl.id, tl.type, tlPrac.score.ok, tlPrac.score.bad);
    }
  } else {
    tlPrac.score.bad++;
    tlPrac.wrong.add(visIdx);
    AudioEngine.wrong && AudioEngine.wrong();
    // visual reset after a short flash
    setTimeout(() => {
      if(tlPrac && tlPrac.wrong){
        tlPrac.wrong.delete(visIdx);
        renderTlPracticeOnly();
      }
    }, 700);
  }
  renderTlPracticeOnly();
}

function tlResetSequence(){
  if(!tlPrac) return;
  const tl = TIMELINES.find(t => t.id === tlPrac.id);
  if(!tl) return;
  AudioEngine.click && AudioEngine.click();
  tlPrac = startTlPracticeSession(tl);
  renderTlPracticeOnly();
}

/* — quiz interaction — */
function tlPickOption(optIdx){
  if(!tlPrac || tlPrac.done) return;
  if(tlPrac.answered) return;
  const q = tlPrac.questions[tlPrac.qIdx];
  const picked = q.options[optIdx];
  const correct = picked[state.lang] === q.correct[state.lang];
  tlPrac.picked   = optIdx;
  tlPrac.answered = true;
  if(correct){ tlPrac.score.ok++; AudioEngine.correct && AudioEngine.correct(); }
  else       { tlPrac.score.bad++; AudioEngine.wrong   && AudioEngine.wrong(); }
  renderTlPracticeOnly();
}
function tlQuizNext(){
  if(!tlPrac) return;
  AudioEngine.click && AudioEngine.click();
  if(tlPrac.qIdx + 1 >= tlPrac.questions.length){
    tlPrac.done = true;
    AudioEngine.win && AudioEngine.win();
    const tl = TIMELINES.find(t => t.id === tlPrac.id);
    if(tl) recordTimeline(tl.id, tl.type, tlPrac.score.ok, tlPrac.score.bad);
  } else {
    tlPrac.qIdx++;
    tlPrac.answered = false;
    tlPrac.picked = -1;
  }
  renderTlPracticeOnly();
}

function renderTlPracticeOnly(){
  const el = document.getElementById("tlPracBody");
  if(!el) return;
  el.innerHTML = renderTlPracticeBody();
}

function renderTlPracticeBody(){
  if(!tlPrac) return "";
  const tl = TIMELINES.find(t => t.id === tlPrac.id);
  if(!tl) return "";
  const NL = state.lang === "nl";

  if(tl.type === "sequence"){
    const chips = tlPrac.order.map((stepIdx, visIdx) => {
      const placedIndex = tlPrac.placed.indexOf(visIdx);
      const isPlaced = placedIndex >= 0;
      const isWrong  = tlPrac.wrong && tlPrac.wrong.has(visIdx);
      const cls = isPlaced ? "ok" : (isWrong ? "bad" : "");
      const order = isPlaced ? `<span class="tlc-n">${placedIndex+1}</span>` : `<span class="tlc-n">·</span>`;
      const label = tl.steps[stepIdx][state.lang] || tl.steps[stepIdx].nl;
      return `<button class="tl-chip ${cls}" onclick="tlTapStep(${visIdx})" ${isPlaced?"disabled":""}>${order}<span class="tlc-t">${label}</span></button>`;
    }).join("");
    const status = tlPrac.done
      ? `<div class="tl-prac-done">★ ${NL?"Helemaal goed!":"All correct!"} · ${tlPrac.score.ok} ${NL?"juist":"right"} · ${tlPrac.score.bad} ${NL?"fout":"wrong"}</div>`
      : `<div class="tl-prac-status">${NL?"tik in juiste volgorde":"tap in correct order"} · ${tlPrac.placed.length}/${tl.steps.length}</div>`;
    return `
      ${status}
      <div class="tl-chips">${chips}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
        <button class="tl-prac-btn" onclick="tlResetSequence()">↻ ${NL?"opnieuw schudden":"reshuffle"}</button>
        <button class="tl-prac-btn primary" onclick="openTijdlijnen()">← ${NL?"terug":"back"}</button>
      </div>`;
  }

  // quiz
  if(tlPrac.done){
    const tot = tlPrac.questions.length;
    const ok = tlPrac.score.ok;
    return `
      <div class="tl-prac-done">★ ${NL?"Klaar!":"Done!"} · ${ok}/${tot} ${NL?"juist":"right"}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
        <button class="tl-prac-btn" onclick="openTlPractice('${tlPrac.id}')">↻ ${NL?"nog een keer":"again"}</button>
        <button class="tl-prac-btn primary" onclick="openTijdlijnen()">← ${NL?"terug":"back"}</button>
      </div>`;
  }
  const q = tlPrac.questions[tlPrac.qIdx];
  const opts = q.options.map((o, i) => {
    const isPicked  = tlPrac.picked === i;
    const isCorrect = o[state.lang] === q.correct[state.lang];
    let cls = "";
    if(tlPrac.answered){
      if(isCorrect) cls = "ok";
      else if(isPicked) cls = "bad";
    }
    return `<button class="tl-opt ${cls}" onclick="tlPickOption(${i})" ${tlPrac.answered?"disabled":""}>${o[state.lang]}</button>`;
  }).join("");
  const feedback = tlPrac.answered
    ? (q.options[tlPrac.picked][state.lang] === q.correct[state.lang]
        ? `<div class="tl-fb ok">✓ ${NL?"juist!":"correct!"}</div>`
        : `<div class="tl-fb bad">✗ ${NL?"juist was:":"correct was:"} <b>${q.correct[state.lang]}</b></div>`)
    : "";
  return `
    <div class="tl-prac-status">${NL?"vraag":"question"} ${tlPrac.qIdx+1}/${tlPrac.questions.length} · ${tlPrac.score.ok} ${NL?"juist":"right"} · ${tlPrac.score.bad} ${NL?"fout":"wrong"}</div>
    <div class="tl-q">${q.prompt[state.lang]}</div>
    <div class="tl-opts">${opts}</div>
    ${feedback}
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
      ${tlPrac.answered ? `<button class="tl-prac-btn primary" onclick="tlQuizNext()">${NL?"volgende":"next"} →</button>` : ""}
      <button class="tl-prac-btn" onclick="openTijdlijnen()">← ${NL?"terug":"back"}</button>
    </div>`;
}

  if(!tlPrac) return viewTijdlijnen();
  const tl = TIMELINES.find(t => t.id === tlPrac.id);

  const intro = (tl.type === "sequence")

      <span style="width:54px;"></span>
    </div>

function buildDeck(){
  const all = DATA[state.topic].terms.map((c,i)=>({...c, _i:i}));
  let deck = all;
  if(state.starredOnly){
    deck = all.filter(c => isStarred(state.topic, c._i));
    if(deck.length === 0) deck = all; // fall back if nothing starred
  }
  deck = shuffle(deck);
  if(state.sessionLen && state.sessionLen > 0 && deck.length > state.sessionLen){
    deck = deck.slice(0, state.sessionLen);
  }
  return deck;
}

  AudioEngine.pop();
  state.mode = mode;
  state.deck = buildDeck();
  state.idx = 0;
  state.correct = 0;
  state.wrong = 0;
  state.curStreak = 0;
  state.bestStreak = 0;
  state.sessionFinished = false;
  state.flipped = false;
  state.feedback = null;

  state.matchBoard = null;
  state.matchSelected = null;
  state.matchLockedPairs = new Set();
  state.matchWrongPair = null;
  state.matchStart = null;
  state.matchElapsed = null;
  state.matchPenalty = 0;
  state.matchNewBest = false;
  if(mode === "match"){
    // For Match, default to short rounds if user picked "All"
    if(!state.sessionLen) state.matchSessionLen = 12;
    else state.matchSessionLen = state.sessionLen;
    state.deck = state.deck.slice(0, state.matchSessionLen);

  state.view = "study";
  render();
}

    topic: state.topic,
    mode: state.mode,
    correct: state.correct,
    wrong: state.wrong,
    total: state.correct + state.wrong,
    bestStreak: state.bestStreak || 0

}
