const GUESTBOOK_REPO  = "mrawson85/mrawson85.github.io";
const GUESTBOOK_ISSUE = 1;

function guestbookWriteURL(){
  return `https://github.com/${GUESTBOOK_REPO}/issues/${GUESTBOOK_ISSUE}`;
}

function guestbookFmtDate(iso, lang){
  try{
    const d = new Date(iso);
    const months = lang === "nl"
      ? ["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"]
      : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${d.getDate()} ${months[d.getMonth()]}`;
  }catch(e){ return ""; }
}

async function loadGuestbook(){
  if(state.view !== "home") return;
  const list = document.getElementById("guestList");
  if(!list) return;
  const NL = state.lang === "nl";

  // 1) Show cached immediately so it never looks empty
  const CACHE_KEY = "mk_guest_v1";
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(e){}
  if(cached && cached.items && cached.items.length){
    renderGuestbook(cached.items);
  }

  // 2) Fetch via JSONP-safe fetch (GitHub API supports CORS for public repos)
  try{
    const url = `https://api.github.com/repos/${GUESTBOOK_REPO}/issues/${GUESTBOOK_ISSUE}/comments?per_page=30`;
    const r = await fetch(url, { headers: { "Accept": "application/vnd.github+json" } });
    if(!r.ok){
      if(!cached) {
        list.innerHTML = `<div class="guest-empty">${NL?"nog geen berichtjes — schrijf de eerste!":"no notes yet — write the first one!"}</div>`;
      }
      return;
    }
    const data = await r.json();
    const items = (Array.isArray(data) ? data : []).map(c => ({
      author: (c.user && c.user.login) || "Anon",
      body:   String(c.body || "").trim(),
      date:   c.created_at,
      url:    c.html_url
    })).filter(i => i.body.length > 0);
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify({items, t: Date.now()})); }catch(e){}
    renderGuestbook(items);
  }catch(e){
    if(!cached){
      list.innerHTML = `<div class="guest-empty">${NL?"berichtjes konden niet geladen worden":"couldn't load messages"}</div>`;
    }
  }
}

function renderGuestbook(items){
  const list = document.getElementById("guestList");
  if(!list) return;
  const NL = state.lang === "nl";
  if(!items.length){
    list.innerHTML = `<div class="guest-empty">${NL?"nog geen berichtjes — schrijf de eerste!":"no notes yet — write the first one!"}</div>`;
    return;
  }
  list.innerHTML = items.slice().reverse().map(it => `
    <div class="guest-card">
      <div class="meta"><b>${escapeText(it.author)}</b> · ${guestbookFmtDate(it.date, state.lang)}</div>
      <div class="body">${escapeText(it.body).replace(/\n+/g, "<br>")}</div>
    </div>
  `).join("");
}

function escapeText(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
}

async function loadPraktijkImages(){
  if(state.view !== "praktijk") return;
  const cache = getPraktijkImageCache();

  // 1) inject anything we already have cached
  PRAKTIJK_EXAMPLES.forEach(ex => {
    if(ex.wiki && cache[ex.wiki] && cache[ex.wiki].src){
      injectPraktijkImage(ex.wiki, cache[ex.wiki].src);
    }
  });

  // 2) fetch the rest in parallel
  const todo = PRAKTIJK_EXAMPLES.filter(ex => ex.wiki && !(cache[ex.wiki] && cache[ex.wiki].src));
  if(todo.length === 0) return;

  // Update placeholder to "loading…"
  todo.forEach(ex => {
    const ph = document.querySelector(`[data-prk-img="${ex.wiki}"] .prk-img-placeholder`);
    if(ph) ph.innerHTML = `<div style="font-size:.78rem;color:#94a3b8;font-weight:700;">🌐 ${state.lang==="nl"?"foto laden…":"loading photo…"}</div>`;
  });

  const results = await Promise.all(todo.map(ex => fetchWikiImage(ex.wiki).then(src => ({ex, src}))));
  let changed = false;
  results.forEach(({ex, src}) => {
    if(src){
      cache[ex.wiki] = { src, t: Date.now() };
      changed = true;
      injectPraktijkImage(ex.wiki, src);
    } else {
      const ph = document.querySelector(`[data-prk-img="${ex.wiki}"] .prk-img-placeholder`);
      if(ph) ph.textContent = ex.icon;
    }
  });
  if(changed) savePraktijkImageCache(cache);
}

function setSessionLen(v){
  state.sessionLen = v;

function buildDeck(){
  const all = DATA[state.topic].terms.map((c,i)=>({...c, _i:i}));
  let deck = all;
  if(state.starredOnly){
    deck = all.filter(c => isStarred(state.topic, c._i));
    if(deck.length === 0) deck = all; // fall back if nothing starred
  }
  deck = shuffle(deck);
  if(state.sessionLen && state.sessionLen > 0 && deck.length > state.sessionLen){
    deck = deck.slice(0, state.sessionLen);
  }
  return deck;
}

function startMode(mode){
  AudioEngine.pop();
  state.mode = mode;
  state.deck = buildDeck();
  state.idx = 0;
  state.correct = 0;
  state.wrong = 0;
  state.curStreak = 0;
  state.bestStreak = 0;
  state.sessionFinished = false;
  state.flipped = false;
  state.feedback = null;
  // Reset match state
  state.matchBoard = null;
  state.matchSelected = null;
  state.matchLockedPairs = new Set();
  state.matchWrongPair = null;
  state.matchStart = null;
  state.matchElapsed = null;
  state.matchPenalty = 0;
  state.matchNewBest = false;
  if(mode === "match"){
    // For Match, default to short rounds if user picked "All"
    if(!state.sessionLen) state.matchSessionLen = 12;
    else state.matchSessionLen = state.sessionLen;
    state.deck = state.deck.slice(0, state.matchSessionLen);
  }
  state.view = "study";
  render();
}

function recordCurrentCardResult(gotRight){
  const c = state.deck[state.idx];
  if(c && c._i !== undefined){
    recordCard(state.topic, c._i, gotRight);

  if(gotRight){
    state.curStreak = (state.curStreak||0) + 1;
    if(state.curStreak > (state.bestStreak||0)) state.bestStreak = state.curStreak;
  } else {
    state.curStreak = 0;
  }
}

  if(!state.deck.length) return `<div class="empty">Geen kaarten</div>`;
  const t = DATA[state.topic];
  const total = state.deck.length;
  const cur = state.idx + 1;
  const pct = Math.round((state.idx/total)*100);

  const header = `
    <div class="top-bar">
      <button class="back" onclick="backToMode()">← ${L().back}</button>
      <div class="topic-title">${t.icon} ${t.label[state.lang]}</div>
      <div class="stats">
        <span class="pill good">✓ ${state.correct}</span>
        <span class="pill bad">✗ ${state.wrong}</span>
        <span class="pill">${cur}/${total}</span>
      </div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
  `;

  if(state.mode === "flash") return header + viewFlash();
  if(state.mode === "type")  return header + viewType();
  if(state.mode === "quiz")  return header + viewQuiz();
  if(state.mode === "match") return viewMatchWrap();
}

function currentCard(){ return state.deck[state.idx]; }

function nextCard(wasRight){
  recordCurrentCardResult(wasRight);
  if(wasRight){ state.correct++; AudioEngine.correct(); }
  else { state.wrong++; AudioEngine.wrong(); }
  state.idx++;
  state.flipped = false;
  state.feedback = null;
  if(state.idx >= state.deck.length){
    finishSession();
    state.view = "done";
  }
  render();
}

function finishSession(){
  if(state.sessionFinished) return;
  state.sessionFinished = true;
  recordSession({
    topic: state.topic,
    mode: state.mode,
    correct: state.correct,
    wrong: state.wrong,
    total: state.correct + state.wrong,
    bestStreak: state.bestStreak || 0
  });
}

/* ----- FLASH ----- */

function viewFlash(){
  const c = currentCard();
  const starred = isStarred(state.topic, c._i);
  const NL = state.lang === "nl";
  const starTitle = NL
    ? (starred ? "Markering verwijderen" : "Markeer als lastig — verschijnt later in 'Alleen ⭐'")
    : (starred ? "Remove mark" : "Mark as tough — appears later in 'Starred only'");
  const def = c.d[state.lang] || "";
  const isLong = def.includes("<br>") || def.length > 220;
  return `
    <div class="flash ${state.flipped?'flipped':''}" id="flashCard" onclick="flipCard()">
      <div class="flash-inner">
        <div class="flash-face">
          <div class="term">${c.t[state.lang]}</div>
          <div class="tap-hint"><span class="ico">👆</span>${NL?"Tik om antwoord te zien":"Tap to see the answer"}</div>
        </div>
        <div class="flash-face flash-back">
          <div class="def ${isLong?'long':''}">${def}</div>
          ${c.m && c.m[state.lang] ? `
            <div class="mnemonic">
              <span class="ezelsbrug-label">💡 ${NL?'Ezelsbruggetje':'Memory trick'}</span>
              ${c.m[state.lang]}
            </div>` : ''}
          <div class="tap-hint"><span class="ico">👆</span>${NL?"Tik om terug te draaien":"Tap to flip back"}</div>
        </div>
      </div>
    </div>
    <div style="text-align:center;font-size:.8rem;color:#6b5b95;font-weight:700;margin:-4px 0 10px;">
      ${state.flipped
        ? (NL?"Wist je het? Kies hieronder:":"Did you know it? Choose below:")
        : (NL?"Bedenk het antwoord, tik dan op de kaart":"Think of the answer, then tap the card")}
    </div>
    <div class="flash-controls">
      <button class="ctrl hard" onclick="event.stopPropagation();nextCard(false)">
        ❌ ${NL?"Wist ik niet":"Didn't know"}
        <span class="lbl-sub">${NL?"nog oefenen":"practice again"}</span>
      </button>
      <button class="ctrl star ${starred?'on':''}" onclick="event.stopPropagation();toggleStar()" title="${starTitle}">
        ${starred? "★" : "☆"}
        <span class="lbl-sub">${NL?"lastig":"tough"}</span>
      </button>
      <button class="ctrl easy" onclick="event.stopPropagation();nextCard(true)">
        ✅ ${NL?"Wist ik":"Knew it"}
        <span class="lbl-sub">${NL?"top!":"nice!"}</span>
      </button>
    </div>
  `;
}

function flipCard(){ AudioEngine.flip(); state.flipped = !state.flipped; render(); }
function toggleStar(){
  AudioEngine.pop();
  const c = currentCard();
  setStar(state.topic, c._i, !isStarred(state.topic, c._i));
  render();
}

/* ----- TYPE ----- */

function viewType(){
  const c = currentCard();
  // ALWAYS: show definition, ask the student to type the term (begrip)
  const promptText = c.d[state.lang];
  const answer = c.t[state.lang];
  const fb = state.feedback;

  return `
    <div class="type-card">
      <div class="type-q">${L().promptLabel} →  ${L().promptLabel2}</div>
      <div class="type-prompt">${promptText}</div>
      <input id="typeInput" class="type-input" style="min-height:auto;" placeholder="${L().yourAnswer}" ${fb?'disabled':''} value="${fb?escapeAttr(fb.user):''}" autocomplete="off" autocorrect="off" autocapitalize="off" />
      <div class="type-actions">
        ${ fb ? `
          <button class="btn btn-primary" onclick="nextAfterType()">${L().next} →</button>
          ${fb.score >= 0.5 && fb.score < 1 ? `<button class="btn btn-ghost" onclick="overrideTypeWrong()">${state.lang==="nl"?"Toch fout":"Mark wrong"}</button>` : ''}
          ${fb.score < 0.5 ? `<button class="btn btn-ghost" onclick="overrideTypeRight()">${state.lang==="nl"?"Toch goed":"Mark right"}</button>` : ''}
        ` : `
          <button class="btn btn-primary" onclick="checkTypeAnswer()">✓ ${L().check}</button>
          <button class="btn btn-ghost" onclick="skipType()">${L().skip}</button>
        `}
      </div>
      ${ fb ? `
        <div class="feedback ${fb.score>=0.7?'right':(fb.score>=0.4?'almost':'wrong')}">
          <b>${fb.score>=0.7 ? L().correct : (fb.score>=0.4 ? L().almost : L().wrong)}</b>
          <div style="font-size:.9rem;margin-top:6px;"><b>${L().correctAns}</b><br>${answer}</div>
        </div>` : ''}
    </div>
  `;
}

function escapeAttr(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

// Smarter scoring for short terms. Returns 0..1.
function scoreTerm(user, answer){
  const nu = normalize(user);
  const na = normalize(answer);
  if(!nu) return 0;
  if(nu === na) return 1;
  // strip leading article (de/het/een/the/a/an)
  const strip = s => s.replace(/^(de|het|een|the|a|an)\s+/, "");
  if(strip(nu) === strip(na)) return 1;
  if(na.includes(nu) && nu.length >= Math.max(4, na.length*0.6)) return 0.9;
  if(nu.includes(na)) return 0.95;
  // keyword overlap
  return similarity(user, answer);
}

function checkTypeAnswer(){
  const c = currentCard();
  const user = document.getElementById("typeInput").value;
  const score = scoreTerm(user, c.t[state.lang]);
  state.feedback = { user, score };
  if(score >= 0.7) AudioEngine.correct();
  else if(score >= 0.4) AudioEngine.almost();
  else AudioEngine.wrong();
  render();
}

function nextAfterType(){
  AudioEngine.click();
  const ok = state.feedback && state.feedback.score >= 0.7;
  recordCurrentCardResult(ok);
  // suppress double-sfx from nextCard since we already played one
  state.correct += ok ? 1 : 0;
  state.wrong   += ok ? 0 : 1;
  state.idx++;
  state.flipped = false;
  state.feedback = null;
  if(state.idx >= state.deck.length){
    finishSession();
    state.view = "done";
  }
  render();
}
function overrideTypeWrong(){ state.feedback.score = 0; AudioEngine.click(); render(); }
function overrideTypeRight(){ state.feedback.score = 1; AudioEngine.click(); render(); }
function skipType(){
  AudioEngine.click();
  state.feedback = { user: "", score: 0 };
  render();
}

/* ----- QUIZ ----- */

function buildQuizOptions(){
  const c = currentCard();
  const all = DATA[state.topic].terms.filter((x,i)=>i!==c._i);
  const distractors = shuffle(all).slice(0,3).map(x=>x.d[state.lang]);
  return shuffle([c.d[state.lang], ...distractors]);
}

function viewQuiz(){
  const c = currentCard();
  if(!state.quizOptions || state.quizForIdx !== state.idx){
    state.quizOptions = buildQuizOptions();
    state.quizForIdx = state.idx;
    state.quizAnswered = null;
    state.quizCorrectIdx = state.quizOptions.findIndex(opt => opt === c.d[state.lang]);
  }
  const correctIdx = state.quizCorrectIdx;
  return `
    <div class="quiz-card">
      <div class="type-q">${L().promptLabel2}</div>
      <div class="type-prompt">${c.t[state.lang]}</div>
      ${ state.quizOptions.map((opt,i)=>{
        let cls = "quiz-opt";
        if(state.quizAnswered !== null){
          if(i === correctIdx) cls += " correct";
          else if(i === state.quizAnswered) cls += " wrong";
          cls += " disabled";
        }
        // Pass correctness directly so click handler doesn't depend on state arrays
        return `<button class="${cls}" onclick="answerQuiz(${i}, ${correctIdx})">${opt}</button>`;
      }).join("") }
      ${ state.quizAnswered !== null ? `
        <button class="btn btn-primary" style="margin-top:8px;width:100%;" onclick="quizNext()">${L().next} →</button>
      `:''}
    </div>
  `;
}

function answerQuiz(i, correctIdx){
  try{
    if(state.quizAnswered !== null) return;
    state.quizAnswered = i;
    const correct = (i === correctIdx);
    state.lastQuizRight = correct;
    if(correct){ confetti(); AudioEngine.correct(); }
    else { AudioEngine.wrong(); }
    render();
  }catch(e){
    console.error("answerQuiz error:", e);
  }
}

function quizNext(){
  // Reset the per-question state BEFORE incrementing idx, so viewQuiz
  // unambiguously sees a fresh state and rebuilds options.
  const wasRight = !!state.lastQuizRight;
  state.quizOptions = null;
  state.quizAnswered = null;
  state.quizForIdx = undefined;
  state.quizCorrectIdx = undefined;
  state.lastQuizRight = null;
  nextCard(wasRight);
}

/* ----- MATCH game -----
   Pair terms with their definitions. 4 pairs visible at once. Timed.
   "Cards" in state.deck are the pairs in this session. After all matched → done.
*/

function startMatch(){
  // Pull next 4 cards from deck for this round
  const round = state.deck.slice(state.idx, state.idx + 4);
  state.matchRound = round;
  state.matchBoard = shuffle([
    ...round.map(c => ({type:"t", pairId:c._i, text:c.t[state.lang]})),
    ...round.map(c => ({type:"d", pairId:c._i, text:shortDef(c.d[state.lang])}))
  ]);
  state.matchSelected = null;
  state.matchLockedPairs = new Set();
  state.matchWrongPair = null;
  if(!state.matchStart) state.matchStart = Date.now();
}

function shortDef(s){
  // Strip HTML tags (some defs include <br>) and trim long definitions
  const plain = String(s).replace(/<br\s*\/?>/gi, " · ").replace(/<[^>]+>/g, "");
  if(plain.length > 110) return plain.slice(0, 105).replace(/\s+\S*$/,"") + "…";
  return plain;
}

function viewMatchWrap(){
  const t = DATA[state.topic];
  const total = state.deck.length;
  const done = state.idx;
  const pct = Math.round((done/total)*100);

  if(!state.matchBoard) startMatch();

  // HUD with timer
  const elapsedSec = state.matchStart ? Math.floor((Date.now() - state.matchStart)/1000) : 0;
  const mm = String(Math.floor(elapsedSec/60)).padStart(2,"0");
  const ss = String(elapsedSec%60).padStart(2,"0");

  const NL = state.lang === "nl";
  const best = bestMatchTime(state.topic);
  const bestStr = best ? `${String(Math.floor(best/60)).padStart(2,"0")}:${String(best%60).padStart(2,"0")}` : "—";

  const board = state.matchBoard.map((card, i) => {
    const matched = state.matchLockedPairs.has(card.pairId);
    const selected = state.matchSelected === i;
    const wrong = state.matchWrongPair && state.matchWrongPair.includes(i);
    let cls = "match-card " + (card.type==="t" ? "term" : "def");
    if(matched) cls += " gone";
    if(selected) cls += " selected";
    if(wrong) cls += " wrong";
    return `<button class="${cls}" onclick="matchTap(${i})">${card.text}</button>`;
  }).join("");

  return `
    <div class="top-bar">
      <button class="back" onclick="backToMode()">← ${L().back}</button>
      <div class="topic-title">${t.icon} ${t.label[state.lang]} 🧩</div>
      <div class="stats">
        <span class="pill good">✓ ${state.correct}</span>
        <span class="pill bad">✗ ${state.wrong}</span>
        <span class="pill">${done}/${total}</span>
      </div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="match-hud">
      <div>
        <div class="lb">${NL?"Tijd":"Time"}</div>
        <div class="tm" id="matchTimer">${mm}:${ss}</div>
      </div>
      <div style="text-align:center;">
        <div class="lb">${NL?"Foutjes":"Misses"}</div>
        <div class="tm" style="color:#ef4444;">${state.wrong||0}</div>
      </div>
      <div style="text-align:right;">
        <div class="lb">${NL?"Beste":"Best"}</div>
        <div class="tm" style="color:#10b981;font-size:1rem;">${bestStr}</div>
      </div>
    </div>
    <div class="match-board">${board}</div>
    <div style="text-align:center;font-size:.78rem;color:#6b5b95;font-weight:700;">
      ${NL?"Tik een geel begrip en daarna de bijbehorende paarse definitie":"Tap a yellow term, then its matching purple definition"}
    </div>
  `;
}

function matchTap(i){
  if(!state.matchBoard) return;
  const card = state.matchBoard[i];
  if(state.matchLockedPairs.has(card.pairId)) return;
  if(state.matchWrongPair) return; // wait for shake to finish
  if(state.matchSelected === null){
    state.matchSelected = i;
    AudioEngine.tap();
    render();
    return;
  }
  if(state.matchSelected === i){
    // Deselect
    state.matchSelected = null;
    AudioEngine.click();
    render();
    return;
  }
  const prev = state.matchBoard[state.matchSelected];
  const isPair = prev.pairId === card.pairId && prev.type !== card.type;
  if(isPair){
    AudioEngine.correct();
    state.matchLockedPairs.add(card.pairId);
    recordCard(state.topic, card.pairId, true);
    state.correct = (state.correct||0) + 1;
    state.matchSelected = null;
    // If all 4 pairs in this round done, advance
    if(state.matchLockedPairs.size === state.matchRound.length){
      state.idx += state.matchRound.length;
      state.matchBoard = null;
      state.matchLockedPairs = new Set();
      if(state.idx >= state.deck.length){
        finishMatch();
        return;
      }
    }
    render();
  } else {
    AudioEngine.wrong();
    state.matchWrongPair = [state.matchSelected, i];
    // Record mismatch as a wrong for both involved cards
    recordCard(state.topic, prev.pairId, false);
    recordCard(state.topic, card.pairId, false);
    state.wrong = (state.wrong||0) + 1;
    render();
    setTimeout(()=>{
      state.matchWrongPair = null;
      state.matchSelected = null;
      render();
    }, 450);
  }
}

function finishMatch(){
  if(state.sessionFinished) return;
  const elapsedSec = Math.floor((Date.now() - state.matchStart)/1000);
  state.matchElapsed = elapsedSec;
  state.matchPenalty = state.wrong || 0;
  // Save best time per topic (with penalty)
  saveMatchBest(state.topic, elapsedSec + state.matchPenalty*5);
  state.bestStreak = state.matchRound ? state.matchRound.length : 0;
  finishSessionMatch();
  state.view = "done";
  render();
}

function finishSessionMatch(){
  state.sessionFinished = true;
  recordSession({
    topic: state.topic,
    mode: "match",
    correct: state.correct||0,
    wrong: state.wrong||0,
    total: (state.correct||0)+(state.wrong||0),
    bestStreak: state.bestStreak || 0,
    timeSec: state.matchElapsed
  });
}

function bestMatchTime(topicKey){
  try{
    const v = localStorage.getItem("mk_match_best_"+topicKey);
    return v ? parseInt(v,10) : null;
  }catch(e){ return null; }
}
function saveMatchBest(topicKey, timeWithPenalty){
  const cur = bestMatchTime(topicKey);
  if(cur === null || timeWithPenalty < cur){
    localStorage.setItem("mk_match_best_"+topicKey, String(timeWithPenalty));
    state.matchNewBest = true;
  }
}

// Timer tick: re-render only the timer to avoid disturbing taps
setInterval(()=>{
  if(state.view === "study" && state.mode === "match" && state.matchStart && !state.sessionFinished){
    const el = document.getElementById("matchTimer");
    if(el){
      const s = Math.floor((Date.now()-state.matchStart)/1000);
      const mm = String(Math.floor(s/60)).padStart(2,"0");
      const ss = String(s%60).padStart(2,"0");
      el.textContent = mm+":"+ss;
    }
  }
}, 500);

/* ----- DONE ----- */

function viewDone(){
  const NL = state.lang === "nl";
  if(state.mode === "match"){
    const elapsed = state.matchElapsed || 0;
    const mm = String(Math.floor(elapsed/60)).padStart(2,"0");
    const ss = String(elapsed%60).padStart(2,"0");
    const penalty = state.matchPenalty || 0;
    confetti(50);
    return `
      <div class="done">
        <div style="font-size:3rem;">${state.matchNewBest ? "🏆" : "🧩"}</div>
        <h2>${state.matchNewBest ? (NL?"Nieuw record!":"New record!") : (NL?"Ronde compleet!":"Round complete!")}</h2>
        <div class="score-num">${mm}:${ss}</div>
        <div style="margin:6px 0 18px;color:#6b5b95;font-weight:700;">
          ${state.deck.length} ${NL?"paren":"pairs"} · ${penalty} ${NL?"foutjes":"misses"}
        </div>
        <div style="margin-bottom:18px;font-size:.85rem;color:#6b5b95;">
          ${NL?"Je beste tijd voor dit onderwerp:":"Your best time for this topic:"} <b>${(()=>{const b=bestMatchTime(state.topic); if(!b) return "—"; return String(Math.floor(b/60)).padStart(2,"0")+":"+String(b%60).padStart(2,"0");})()}</b>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="startMode('match')">🔁 ${L().playAgain}</button>
          <button class="btn btn-ghost" onclick="backToMode()">${L().back}</button>
        </div>
      </div>
    `;
  }
  const total = state.correct + state.wrong;
  const pct = total ? Math.round((state.correct/total)*100) : 0;
  let emoji = "🥳", msg = "";
  if(pct >= 90){ emoji = "🏆"; msg = NL?"WOW! Examen-klaar!":"WOW! Exam-ready!"; }
  else if(pct >= 70){ emoji = "🚀"; msg = NL?"Lekker bezig — bijna daar!":"Great going — almost there!"; }
  else if(pct >= 50){ emoji = "💪"; msg = NL?"Goed begin — nog een rondje!":"Solid start — one more round!"; }
  else { emoji = "📚"; msg = NL?"Nog even oefenen. Probeer flashcards eerst!":"Practise some more. Try flashcards first!"; }
  if(pct >= 70) confetti(40);
  return `
    <div class="done">
      <div style="font-size:3rem;">${emoji}</div>
      <h2>${L().sessionDone}</h2>
      <div class="score-num">${pct}%</div>
      <div style="margin:6px 0 18px;color:#6b5b95;font-weight:700;">
        ${state.correct} ${L().correctCount} · ${state.wrong} ${L().wrongCount} ${L().of} ${state.correct+state.wrong}
      </div>
      <div style="margin-bottom:18px">${msg}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startMode('${state.mode}')">🔁 ${L().playAgain}</button>
        <button class="btn btn-ghost" onclick="backToMode()">${L().back}</button>
      </div>
    </div>
  `;
}

/* ----- Confetti ----- */

function confetti(n=18){
  const colors = ["#ec4899","#7c3aed","#10b981","#f59e0b","#3b82f6","#ef4444"];
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.4 + Math.random()*1.2)+"s";
    el.style.animationDelay = (Math.random()*.3)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
}

/* ----- RENDER ----- */

function render(){
  const el = document.getElementById("app");
  if(state.view === "home"){
    el.innerHTML = viewHome();
    setTimeout(() => { loadWeather(); loadGuestbook(); }, 0);
  }
  else if(state.view === "stats") el.innerHTML = viewStats();
  else if(state.view === "praktijk") {
    el.innerHTML = viewPraktijk();
    // Re-inject cached images + fetch any new ones every time praktijk renders
    setTimeout(loadPraktijkImages, 0);
  }
  else if(state.view === "mode")  el.innerHTML = viewMode();
  else if(state.view === "study") el.innerHTML = viewStudy();
  else if(state.view === "done")  el.innerHTML = viewDone();

  // Focus type input
  if(state.view === "study" && state.mode === "type" && !state.feedback){
    setTimeout(()=>{ const ti = document.getElementById("typeInput"); ti && ti.focus(); }, 60);
  }
}

document.addEventListener("keydown", e=>{
  if(state.view !== "study") return;
  if(state.mode === "flash"){
    if(e.code === "Space" || e.code === "Enter"){ e.preventDefault(); flipCard(); }
    if(e.code === "ArrowRight"){ nextCard(true); }
    if(e.code === "ArrowLeft"){ nextCard(false); }
  }
  if(state.mode === "type"){
    if(e.ctrlKey && e.code === "Enter" && !state.feedback){ e.preventDefault(); checkTypeAnswer(); }
    if(state.feedback && e.code === "Enter"){ e.preventDefault(); nextAfterType(); }
  }
});

setLang(state.lang);
restoreAudioPrefs();
render();

/* ════════════════════════════════════════════
     ✦  Tiny sparkle trail (typographic, no emoji)  ✦
   ════════════════════════════════════════════ */
(function(){
  if(window.matchMedia && window.matchMedia('(hover: none)').matches) return;

  const SPARKLES = ["✦","✧","·","✶","❅"];
  const COLORS = ["#7a9270","#a89065","#8a4a3a","#c4ad7e","#5d7556"];
  let lastTime = 0;
  let lastX = 0, lastY = 0;

  document.addEventListener("pointermove", (e) => {
    const now = Date.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(now - lastTime < 55 || dist < 8) return;
    lastTime = now;
    lastX = e.clientX; lastY = e.clientY;

    const s = document.createElement("span");
    s.textContent = SPARKLES[Math.floor(Math.random() * SPARKLES.length)];
    s.style.cssText = `
      position: fixed;
      left: ${e.clientX}px;
      top: ${e.clientY}px;
      pointer-events: none;
      color: ${COLORS[Math.floor(Math.random() * COLORS.length)]};
      font-size: ${10 + Math.random()*10}px;
      z-index: 9999;
      user-select: none;
      animation: sparkleFade 800ms ease-out forwards;
      text-shadow: 0 0 4px #fff;
      transform: translate(-50%, -50%) rotate(${Math.random()*60-30}deg);
    `;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }, { passive: true });

  // Inject the keyframes once
  const style = document.createElement("style");
  style.textContent = `
    @keyframes sparkleFade{
      0%   { opacity: 0;   transform: translate(-50%, -50%) scale(.4) rotate(0deg); }
      30%  { opacity: 1;   transform: translate(-50%, -50%) scale(1) rotate(15deg); }
      100% { opacity: 0;   transform: translate(-50%, calc(-50% - 24px)) scale(.5) rotate(45deg); }
    }
  `;
  document.head.appendChild(style);
})();
</script>
</body>
</html>
