           en:"Left: focus on collective interest, less socio-economic inequality, active government. Right: focus on individuals, economic freedom, smaller government."}},
      { t:{nl:"Progressief vs. conservatief", en:"Progressive vs. conservative"},
        d:{nl:"Progressief = veranderingsgezind, veel persoonlijke vrijheid. Conservatief = behoudend, vasthouden aan traditionele waarden en normen.",
           en:"Progressive = open to change, personal freedom. Conservative = preserving, holding on to traditional values and norms."}},
      { t:{nl:"Liberalisme", en:"Liberalism"},
        d:{nl:"Stroming met nadruk op individuele vrijheid, eigen verantwoordelijkheid en de vrije markt; beperkte overheid die zich richt op kerntaken.",
           en:"Stream emphasising individual freedom, personal responsibility and the free market; limited government focused on core tasks."},
        m:{nl:"<b>5 stromingen — LSCEN</b>: <b>L</b>iberaal, <b>S</b>ociaaldemocratisch, <b>C</b>hristendemocratisch, <b>E</b>cologisch, <b>N</b>ationalistisch.<br>+ stijlen: <b>P</b>opulisme & <b>E</b>xtremisme.",
           en:"<b>5 streams — LSCEN</b>: <b>L</b>iberal, <b>S</b>ocial-democratic, <b>C</b>hristian-democratic, <b>E</b>cological, <b>N</b>ationalist.<br>+ styles: <b>P</b>opulism & <b>E</b>xtremism."}},
      { t:{nl:"Sociaaldemocratie", en:"Social democracy"},
        d:{nl:"Stroming die streeft naar meer sociaaleconomische gelijkheid via een actieve overheid en verzorgingsstaat, en internationale solidariteit.",
           en:"Stream pursuing more socio-economic equality via active government and welfare state, plus international solidarity."}},
      { t:{nl:"Christendemocratie", en:"Christian democracy"},
        d:{nl:"Stroming gebaseerd op christelijke waarden zoals naastenliefde, gespreide verantwoordelijkheid en samenwerking tussen groepen.",
           en:"Stream rooted in Christian values like charity, distributed responsibility and cooperation between groups."}},
      { t:{nl:"Ecologische stroming", en:"Ecological / green stream"},
        d:{nl:"Stroming die duurzame, groene consumptie boven economische groei plaatst; sterke overheidsmaatregelen voor milieu.",
           en:"Stream placing sustainable green consumption above economic growth; strong government action for the environment."}},
      { t:{nl:"Nationalisme", en:"Nationalism"},
        d:{nl:"Stroming die de oorspronkelijke bewoners centraal stelt, onafhankelijkheid nastreeft en globalisering en immigratie als bedreiging ziet.",
           en:"Stream centering original inhabitants, pursuing independence and viewing globalisation and immigration as threats."}},
      { t:{nl:"Populisme", en:"Populism"},
        d:{nl:"Politieke stijl/stroming die zich afzet tegen de 'elite' en zegt te spreken namens 'het volk'; nadruk op (charismatisch) leiderschap.",
           en:"Political style/stream that opposes 'the elite' and claims to speak for 'the people'; emphasis on charismatic leadership."}},
      { t:{nl:"Extremisme", en:"Extremism"},
        d:{nl:"Bewegingen die ingrijpende ondemocratische veranderingen willen, haat of angst verspreiden en bereid zijn geweld te gebruiken.",
           en:"Movements seeking far-reaching undemocratic change, spreading hate or fear and willing to use violence."}},
      { t:{nl:"Pressie- of belangengroep", en:"Pressure / interest group"},
        d:{nl:"Groep die opkomt voor bepaalde belangen en druk uitoefent op politieke besluitvorming (bijv. via lobbyen).",
           en:"Group that promotes certain interests and pressures political decision-making (e.g. through lobbying)."}},
      { t:{nl:"Lobbyen", en:"Lobbying"},
        d:{nl:"Achter de schermen politici proberen te beïnvloeden om beleid in het voordeel van een belang te krijgen.",
           en:"Trying to influence politicians behind the scenes to shape policy in favour of an interest."}},
      { t:{nl:"Fasen van besluitvorming", en:"Phases of decision-making"},
        d:{nl:"1) Agendavorming, 2) Beleidsvoorbereiding, 3) Beleidsbepaling, 4) Beleidsuitvoering — daarna terugkoppeling.",
           en:"1) Agenda-setting, 2) Policy preparation, 3) Policy decision, 4) Implementation — then feedback."},
        m:{nl:"<b>AVBU</b> + T — <b>A</b>genda → <b>V</b>oorbereiding → <b>B</b>epaling → <b>U</b>itvoering → <b>T</b>erugkoppeling. Denk: 'Anna Vond Boeken Uit Tilburg'.",
           en:"<b>APDI</b> + F — <b>A</b>genda → <b>P</b>reparation → <b>D</b>ecision → <b>I</b>mplementation → <b>F</b>eedback."}},
      { t:{nl:"Verzorgingsstaat", en:"Welfare state"},
        d:{nl:"Staat waarin de overheid zorgt voor bestaanszekerheid: sociale zekerheid, gezondheidszorg, onderwijs en werkgelegenheid.",
           en:"State in which the government secures basic livelihoods: social security, healthcare, education and employment."}},
      { t:{nl:"Doelen Europese Unie", en:"Goals of the European Union"},
        d:{nl:"Vrede, welzijn, garanderen van Europese waarden (vrijheid, gelijkheid, veiligheid) en economische samenwerking (vrij verkeer goederen, diensten, kapitaal, personen).",
           en:"Peace, welfare, safeguarding European values (freedom, equality, security) and economic cooperation (free movement of goods, services, capital and people)."},
        m:{nl:"<b>VWEE</b> — <b>V</b>rede, <b>W</b>elzijn, <b>E</b>uropese waarden, <b>E</b>conomische samenwerking.",
           en:"<b>PWVE</b> — <b>P</b>eace, <b>W</b>elfare, European <b>V</b>alues, <b>E</b>conomic cooperation."}},
      { t:{nl:"Europese Commissie", en:"European Commission"},
        d:{nl:"Enige EU-instelling die wetgeving mag voorstellen; voert wetgeving uit en controleert of lidstaten zich eraan houden.",
           en:"Only EU body allowed to propose legislation; implements EU law and checks that member states comply."}},
      { t:{nl:"Europees Parlement", en:"European Parliament"},
        d:{nl:"Eens in de vijf jaar gekozen door EU-burgers; stemt samen met de Raad over voorstellen van de Europese Commissie.",
           en:"Elected every five years by EU citizens; votes on Commission proposals together with the Council."}},
      { t:{nl:"Referendum", en:"Referendum"},
        d:{nl:"Volksraadpleging waarbij burgers direct over een onderwerp kunnen stemmen.",
           en:"Direct vote in which citizens decide on a specific issue."}},
      { t:{nl:"Burgerinitiatief", en:"Citizens' initiative"},
        d:{nl:"Voorstel dat burgers met voldoende handtekeningen kunnen indienen om een onderwerp op de politieke agenda te krijgen.",
           en:"Proposal that citizens with enough signatures can submit to put a topic on the political agenda."}},
      { t:{nl:"Gemeenteraad", en:"Municipal council"},
        d:{nl:"Door inwoners gekozen volksvertegenwoordiging van de gemeente; neemt besluiten over gemeentelijk beleid en controleert het college van B&W.",
           en:"Locally elected representatives of the municipality; decides on local policy and oversees the B&W board."}},
      { t:{nl:"College van B&W", en:"Mayor & aldermen board (B&W)"},
        d:{nl:"Dagelijks bestuur van de gemeente: burgemeester en wethouders. Wethouders worden door de raad voorgedragen.",
           en:"Daily executive of the municipality: mayor and aldermen. Aldermen are nominated by the council."}},
      { t:{nl:"Burgemeester", en:"Mayor"},
        d:{nl:"Voorzitter van zowel college van B&W als gemeenteraad, benoemd door de Kroon; verantwoordelijk voor handhaving van de openbare orde en de veiligheid in de gemeente.",
           en:"Chair of both the B&W board and the council, appointed by the Crown; responsible for maintaining public order and safety in the municipality."}},
      { t:{nl:"Provinciale Staten", en:"Provincial council"},
        d:{nl:"Door burgers van de provincie gekozen volksvertegenwoordiging; benoemt de gedeputeerden van het College van Gedeputeerde Staten.",
           en:"Council elected by provincial residents; appoints the deputies of the Provincial Executive."}},
      { t:{nl:"Commissaris van de Koning", en:"King's Commissioner"},
        d:{nl:"Voorzitter van het College van Gedeputeerde Staten en de Provinciale Staten; vertegenwoordigt de Kroon in de provincie.",
           en:"Chair of the Provincial Executive and the Provincial Council; represents the Crown in the province."}},
      { t:{nl:"Ambtenaren", en:"Civil servants"},
        d:{nl:"Werknemers in dienst van de overheid (beleidsmakers, leraren, politie, etc.). Vallen onder de politieke verantwoordelijkheid van het dagelijks bestuur.",
           en:"Government employees (policy makers, teachers, police, etc.). They fall under the political responsibility of the executive."}},
      { t:{nl:"Beleidsambtenaren", en:"Policy civil servants"},
        d:{nl:"Hebben specialistische kennis, bereiden wetsvoorstellen voor en spelen een grote rol bij de uitvoering van wet- en regelgeving; hierdoor grote invloed op beleid.",
           en:"Have specialist knowledge, prepare bills and play a major role in implementing laws; this gives them great influence on policy."}},
      { t:{nl:"Compromis", en:"Compromise"},
        d:{nl:"Overeenkomst tussen groepen of individuen waarbij elke kant toegeeft; noodzakelijk om coalities te vormen en meerderheden in het parlement te krijgen.",
           en:"Agreement between groups in which each side gives ground; necessary for coalitions and for getting parliamentary majorities."}},
      { t:{nl:"Kabinetscrisis", en:"Cabinet crisis"},
        d:{nl:"Onenigheid binnen het kabinet of tussen kabinet en parlement, waardoor (delen van) het kabinet aftreden en er vervroegde verkiezingen kunnen volgen.",
           en:"Disagreement within the cabinet or between cabinet and parliament that causes (parts of) the cabinet to resign and may trigger early elections."}},
      { t:{nl:"Machtsmiddelen kabinet", en:"Power tools of the cabinet"},
        d:{nl:"Steun van een meerderheid van het parlement, deskundige ambtenaren, het regeerakkoord en dreigen met een kabinetscrisis (aftreden).",
           en:"Support of a parliamentary majority, expert civil servants, the coalition agreement, and threatening to resign (cabinet crisis)."}},
      { t:{nl:"Knelpunten parlementaire democratie", en:"Problems of parliamentary democracy"},
        d:{nl:"Veel compromissen leiden tot onbegrip bij kiezers, kloof tussen burgers en politiek, losse achterban, versplinterd partijlandschap en korte-termijndenken.",
           en:"Many compromises cause voter frustration, a gap between citizens and politics, weaker party loyalty, fragmented party landscape and short-termism."}},
      { t:{nl:"Voorwaarden EU-toetreding", en:"EU accession requirements"},
        d:{nl:"Een land moet in Europa liggen, een functionerende rechtsstaat zijn, een democratische bestuursvorm hebben, een werkende markteconomie hebben en mensenrechten garanderen.",
           en:"A country must be in Europe, be a functioning rule-of-law state, have a democratic system of government, have a working market economy and guarantee human rights."},
        m:{nl:"<b>5 eisen</b>: <b>E</b>uropa, <b>R</b>echtsstaat, <b>D</b>emocratie, <b>M</b>arkteconomie, <b>M</b>ensenrechten. 'Echte Romeinen Doen Mooi Mee'.",
           en:"<b>5 must-haves</b>: <b>E</b>urope, <b>R</b>ule of law, <b>D</b>emocracy, <b>M</b>arket economy, human <b>R</b>ights."}},
      { t:{nl:"Beleidsterreinen EU", en:"EU policy areas"},
        d:{nl:"O.a. buitenlands beleid (asiel/integratie), milieu (emissie-eisen), justitie (misdaad- en terreurbestrijding), economische samenwerking (euro, markt), consumentenrecht, voedselveiligheid en EU-burgerschap.",
           en:"Including foreign policy (asylum/integration), environment (emission rules), justice (crime and terrorism), economic cooperation (euro, market), consumer rights, food safety and EU citizenship."}},
      { t:{nl:"Kritiek op de EU", en:"Criticism of the EU"},
        d:{nl:"De EU zou te veel zelfstandigheid van lidstaten inperken, besluitvorming zou onvoldoende transparant zijn en grote landen hebben meer macht dan kleine.",
           en:"Critics say the EU restricts member-state autonomy too much, decision-making isn't transparent enough, and big countries have more power than small ones."}},
      { t:{nl:"Petitie", en:"Petition"},
        d:{nl:"Schriftelijk verzoek met handtekeningen aan de overheid om iets te veranderen of in te voeren; een manier voor burgers om invloed uit te oefenen.",
           en:"Written request with signatures asking the government to change or introduce something; a way for citizens to exert influence."}},
      { t:{nl:"Nationale ombudsman", en:"National ombudsman"},
        d:{nl:"Onafhankelijk klachteninstituut waar burgers klachten kunnen indienen over gedrag van overheidsorganen, ambtenaren en politie.",
           en:"Independent complaints body where citizens can file complaints about government bodies, civil servants and police."}}
    ]
  },

  criminaliteit: {
    icon: "⚖️",
    label: { nl: "Criminaliteit & Rechtsstaat", en: "Crime & Rule of Law" },
    blurb: { nl: "Strafrecht, rechten verdachte, theorieën, straffen", en: "Criminal law, rights of suspect, theories, sanctions" },
    terms: [
      { t:{nl:"Criminaliteit", en:"Crime"},
        d:{nl:"Het geheel van gedragingen dat door de wet strafbaar is gesteld.",
           en:"All behaviour that the law has made punishable."}},
      { t:{nl:"Delict / strafbaar feit", en:"Offence / criminal act"},
        d:{nl:"Juridische omschrijving van strafbaar gedrag. Wordt onderverdeeld in overtredingen en misdrijven.",
           en:"Legal description of punishable behaviour. Divided into minor offences and serious crimes."}},
      { t:{nl:"Overtreding", en:"Minor offence (overtreding)"},
        d:{nl:"Lichte schending van de wet (bv. wildplassen, dronkenschap). Lagere maximumstraf; geen strafblad. Vrijheidsstraf heet hechtenis.",
           en:"Minor breach of the law (e.g. public urination, drunkenness). Lower maximum penalty; no criminal record. Imprisonment is called 'hechtenis'."}},
      { t:{nl:"Misdrijf", en:"Serious crime (misdrijf)"},
        d:{nl:"Zware schending van de wet (bv. diefstal, mishandeling). Hogere maximumstraf en altijd een strafblad bij veroordeling.",
           en:"Serious breach of the law (e.g. theft, assault). Higher maximum penalty and always leaves a criminal record."}},
      { t:{nl:"Waarde", en:"Value"},
        d:{nl:"Een opvatting over wat goed of nastrevenswaardig is in de samenleving.",
           en:"A view about what is good or worth pursuing in society."}},
      { t:{nl:"Norm", en:"Norm"},
        d:{nl:"Gedragsregel die voortkomt uit een waarde; kan geschreven (wet) of ongeschreven zijn.",
           en:"Rule of behaviour deriving from a value; can be written (law) or unwritten."}},
      { t:{nl:"Rechtsregel", en:"Legal rule"},
        d:{nl:"Geschreven norm die door de overheid is vastgelegd in wetgeving en die afgedwongen kan worden.",
           en:"Written norm set by the government in legislation that can be enforced."}},
      { t:{nl:"Wetboek van Strafrecht", en:"Criminal Code"},
        d:{nl:"Boek waarin de belangrijkste misdrijven zoals geweld, diefstal en fraude zijn opgenomen.",
           en:"Code containing the main crimes such as violence, theft and fraud."}},
      { t:{nl:"Veelvoorkomende criminaliteit", en:"High-volume crime"},
        d:{nl:"Massaal voorkomende strafbare gedragingen die veel schade en gevoelens van onveiligheid veroorzaken; meestal licht bestraft.",
           en:"Common offences that cause much damage and insecurity; usually lightly punished."}},
      { t:{nl:"Geregistreerde vs. ongeregistreerde criminaliteit", en:"Recorded vs. unrecorded crime"},
        d:{nl:"Geregistreerd = bekend bij de politie. Ongeregistreerd = nooit aangegeven of opgespoord (het 'dark number').",
           en:"Recorded = known to the police. Unrecorded = never reported or detected (the 'dark number')."}},
      { t:{nl:"Slachtofferonderzoek", en:"Victim survey"},
        d:{nl:"Enquête onder een steekproef van de bevolking om te meten of mensen slachtoffer zijn geweest van een misdrijf, ook als ze geen aangifte deden.",
           en:"Survey of a sample of the population to measure who has been a victim, also when they did not report it."}},
      { t:{nl:"Daderonderzoek", en:"Self-report offender survey"},
        d:{nl:"Enquête waarin respondenten zelf aangeven of zij delicten hebben gepleegd.",
           en:"Survey in which respondents indicate whether they have committed offences."}},
      { t:{nl:"Rechtsbescherming", en:"Legal protection"},
        d:{nl:"Bescherming van de burger tegen te grote overheidsmacht en willekeur door de overheid.",
           en:"Protecting citizens from excessive government power and arbitrary state action."}},
      { t:{nl:"Rechtshandhaving", en:"Law enforcement"},
        d:{nl:"De taak van de overheid om de rechtsorde te handhaven en wetten af te dwingen.",
           en:"The government's task of maintaining the legal order and enforcing the law."}},
      { t:{nl:"Dilemma van de rechtsstaat", en:"Dilemma of the rule of law"},
        d:{nl:"Spanning tussen rechtsbescherming (vrijheid van de burger) en rechtshandhaving (veiligheid van de samenleving).",
           en:"Tension between protecting citizens' freedoms and maintaining law and order."}},
      { t:{nl:"Legaliteitsbeginsel", en:"Principle of legality"},
        d:{nl:"Het handelen van de overheid moet altijd gebaseerd zijn op een wet.",
           en:"Government action must always be based on a law."}},
      { t:{nl:"Onschuldpresumptie", en:"Presumption of innocence"},
        d:{nl:"Iedereen wordt voor onschuldig gehouden tot zijn schuld door de rechter is bewezen.",
           en:"Everyone is presumed innocent until proven guilty by a judge."}},
      { t:{nl:"Officier van justitie", en:"Public prosecutor"},
        d:{nl:"Leidt het opsporingsonderzoek, beslist over vervolgen of seponeren en treedt op de zitting op als aanklager.",
           en:"Leads the criminal investigation, decides on prosecution or dismissal and acts as prosecutor in court."}},
      { t:{nl:"Seponeren", en:"To dismiss (a case)"},
        d:{nl:"Het besluit van het OM om een verdachte niet te vervolgen.",
           en:"Decision by the prosecution service not to prosecute a suspect."}},
      { t:{nl:"Reclassering", en:"Probation service"},
        d:{nl:"Organisatie die werkt met (ex-)daders om herhaling van strafbaar gedrag te voorkomen; adviseert OM en rechter, begeleidt en voert werkstraffen uit.",
           en:"Organisation working with (ex-)offenders to prevent reoffending; advises prosecution and judges, supervises offenders, executes community service."}},
      { t:{nl:"Jeugdstrafrecht", en:"Juvenile criminal law"},
        d:{nl:"Apart strafrecht voor jongeren van 12–18 jaar (soms 16–23) met lagere maximumstraffen, kinderrechter en besloten zittingen.",
           en:"Separate criminal law for youths aged 12–18 (sometimes 16–23) with lower maximum sentences, a juvenile judge and closed sessions."}},
      { t:{nl:"Halt-straf", en:"Halt sentence"},
        d:{nl:"Alternatieve afdoening voor jongeren (12–18) die een licht vergrijp pleegden: leer- of werkopdracht, gesprekken en eventueel excuses aan slachtoffer.",
           en:"Alternative disposal for youths (12–18) who commit a minor offence: learning/work task, conversations and possibly apology to the victim."}},
      { t:{nl:"Kantonrechter", en:"Sub-district judge (kantonrechter)"},
        d:{nl:"Rechter die overtredingen behandelt.",
           en:"Judge who handles minor offences (overtredingen)."}},
      { t:{nl:"Politierechter", en:"Single-judge criminal court"},
        d:{nl:"Rechter die alleen misdrijven met max. 12 maanden gevangenisstraf afhandelt en direct uitspraak doet.",
           en:"Judge who handles crimes with up to 12 months in prison and delivers an immediate verdict."}},
      { t:{nl:"Meervoudige kamer", en:"Three-judge bench"},
        d:{nl:"Drie rechters die zwaardere of ingewikkelder misdrijven behandelen; uitspraak na 14 dagen.",
           en:"Three judges who hear heavier or more complex crimes; verdict after 14 days."}},
      { t:{nl:"Hoger beroep & cassatie", en:"Appeal & cassation"},
        d:{nl:"Hoger beroep: opnieuw beoordelen door het gerechtshof. Cassatie: de Hoge Raad toetst of het recht goed is toegepast.",
           en:"Appeal: reassessment by the court of appeal. Cassation: the Supreme Court checks correct application of law."}},
      { t:{nl:"Klassenjustitie", en:"Class justice"},
        d:{nl:"Verschillende behandeling van mensen uit verschillende sociale klassen of etnische groepen door politie, justitie of rechter.",
           en:"Different treatment of people from different social classes or ethnic groups by police, prosecution or courts."}},
      { t:{nl:"Aangeleerd-gedragstheorie", en:"Social learning theory"},
        d:{nl:"Crimineel gedrag wordt aangeleerd via contact met mensen in de directe omgeving (familie, vrienden).",
           en:"Criminal behaviour is learned through contact with people in one's environment (family, friends)."},
        m:{nl:"<b>6 theorieën — AABREN</b>: <b>A</b>angeleerd, <b>A</b>nomie, <b>B</b>inding, <b>R</b>ationele keuze, <b>E</b>tiketten, <b>N</b>eutralisering.",
           en:"<b>6 theories — SABREN</b>: <b>S</b>ocial learning, <b>A</b>nomie, <b>B</b>onding, <b>R</b>ational choice, <b>E</b>tiketten (labelling), <b>N</b>eutralisation."}},
      { t:{nl:"Anomietheorie", en:"Anomie theory"},
        d:{nl:"Criminaliteit ontstaat doordat mensen door de samenleving gestelde levensdoelen nastreven, maar daarvoor te weinig legale middelen hebben.",
           en:"Crime arises when people pursue society-imposed life goals but lack the legal means to achieve them."}},
      { t:{nl:"Bindingstheorie", en:"Social bonding theory"},
        d:{nl:"Hoe sterker iemands binding met gezin, school of vrienden, hoe kleiner de kans op crimineel gedrag.",
           en:"The stronger one's bond with family, school or friends, the smaller the chance of criminal behaviour."}},
      { t:{nl:"Rationele-keuzetheorie", en:"Rational choice theory"},
        d:{nl:"Een dader maakt een rationele afweging van kosten (pakkans) en baten (opbrengst) voordat hij een delict pleegt.",
           en:"An offender rationally weighs costs (chance of getting caught) against benefits before committing a crime."}},
      { t:{nl:"Etikettentheorie", en:"Labeling theory"},
        d:{nl:"Als de omgeving iemand het etiket 'crimineel' opplakt, gaat die persoon zich ook zo gedragen.",
           en:"When the environment labels someone 'criminal', that person starts behaving accordingly."}},
      { t:{nl:"Neutraliseringstheorie", en:"Neutralization theory"},
        d:{nl:"Jongeren in een groep ontkennen hun verantwoordelijkheid voor crimineel gedrag of dat er een slachtoffer is.",
           en:"Youths in groups deny their responsibility for criminal acts or that there is any real victim."}},
      { t:{nl:"Recidivist", en:"Repeat offender (recidivist)"},
        d:{nl:"Iemand die zich bij herhaling schuldig maakt aan strafbare feiten.",
           en:"Someone who repeatedly commits criminal offences."}},
      { t:{nl:"Preventief beleid", en:"Preventive policy"},
        d:{nl:"Beleid dat criminaliteit probeert te voorkómen (bv. voorlichting, sociale projecten, betere verlichting).",
           en:"Policy aimed at preventing crime (e.g. education, social programmes, better street lighting)."}},
      { t:{nl:"Repressief beleid", en:"Repressive policy"},
        d:{nl:"Beleid dat criminaliteit aanpakt na het feit (bv. politie-inzet, strenger straffen).",
           en:"Policy that fights crime after the fact (e.g. policing, harsher punishment)."}},
      { t:{nl:"Doelen van straf", en:"Goals of punishment"},
        d:{nl:"Vergelding, afschrikking/preventie, beveiliging van de samenleving, handhaving van de rechtsorde, voorkomen van eigenrichting, resocialisatie en genoegdoening.",
           en:"Retribution, deterrence, protection of society, upholding legal order, preventing vigilantism, resocialisation and satisfaction."},
        m:{nl:"<b>7 doelen — VAB-HER-G</b>: <b>V</b>ergelding, <b>A</b>fschrikking, <b>B</b>eveiliging, <b>H</b>andhaving rechtsorde, <b>E</b>igenrichting voorkomen, <b>R</b>esocialisatie, <b>G</b>enoegdoening.",
           en:"<b>7 goals — RDP-UPR-S</b>: <b>R</b>etribution, <b>D</b>eterrence, <b>P</b>rotection, <b>U</b>pholding order, <b>P</b>revent vigilantism, <b>R</b>esocialisation, <b>S</b>atisfaction."}},
      { t:{nl:"Hoofdstraffen", en:"Main sanctions"},
        d:{nl:"Taakstraf/werkstraf, gevangenisstraf, geldboete en hechtenis.",
           en:"Community service, imprisonment, fine and short-term detention (hechtenis)."},
        m:{nl:"<b>TGGH</b> — <b>T</b>aakstraf, <b>G</b>evangenisstraf, <b>G</b>eldboete, <b>H</b>echtenis. Denk: 'Twee Gele Giraffen Huppelen'.",
           en:"<b>CIFD</b> — <b>C</b>ommunity service, <b>I</b>mprisonment, <b>F</b>ine, short-term <b>D</b>etention."}},
      { t:{nl:"TBS", en:"TBS (compulsory psychiatric treatment)"},
        d:{nl:"Maatregel waarbij iemand met een psychische stoornis verplicht wordt behandeld om de samenleving te beschermen.",
           en:"Measure forcing someone with a mental disorder into treatment to protect society."}},
      { t:{nl:"Voorwaardelijke straf", en:"Suspended sentence"},
        d:{nl:"Straf die niet wordt uitgevoerd zolang de veroordeelde binnen de proeftijd geen nieuw delict pleegt.",
           en:"Sentence not carried out as long as the convict commits no new offence during the probation period."}},
      { t:{nl:"Driehoeksoverleg", en:"Local 'triangle' meeting"},
        d:{nl:"Lokaal overleg tussen burgemeester, officier van justitie en politie over openbare orde en veiligheid.",
           en:"Local meeting of the mayor, public prosecutor and police on public order and safety."}},
      { t:{nl:"Rechtsbronnen", en:"Sources of law"},
        d:{nl:"Bronnen waaruit recht voortkomt: de Nederlandse wet, jurisprudentie (rechterlijke uitspraken) en internationale wetgeving (EU, mensenrechtenverdragen).",
           en:"Sources from which law flows: Dutch legislation, case law (court rulings) and international law (EU, human rights treaties)."}},
      { t:{nl:"Jurisprudentie", en:"Case law (jurisprudence)"},
        d:{nl:"Het geheel van rechterlijke uitspraken die de wet interpreteren en richtinggevend zijn voor latere uitspraken.",
           en:"The body of court rulings that interpret the law and guide later judgments."}},
      { t:{nl:"Relativiteit van criminaliteit", en:"Relativity of crime"},
        d:{nl:"Wat strafbaar is verschilt per land en verandert in de tijd (bv. homoseksualiteit, abortus zijn gelegaliseerd; lijfstraffen, illegaal downloaden zijn juist verboden).",
           en:"What counts as criminal varies between countries and changes over time (e.g. homosexuality, abortion have been legalised; corporal punishment, illegal downloading are now banned)."}},
      { t:{nl:"Materiële gevolgen criminaliteit", en:"Material consequences of crime"},
        d:{nl:"Geldelijke gevolgen: kosten van preventie, hogere verzekeringspremies, schade aan goederen en overheidsuitgaven voor criminaliteitsbestrijding.",
           en:"Financial consequences: prevention costs, higher insurance premiums, damage to property and government spending on crime control."}},
      { t:{nl:"Immateriële gevolgen criminaliteit", en:"Non-material consequences of crime"},
        d:{nl:"Niet-financiële gevolgen: angst- en onveiligheidsgevoelens, emotionele schade, aantasting rechtsgevoel, normvervaging, verlies van vertrouwen, eigenrichting.",
           en:"Non-financial consequences: fear and insecurity, emotional harm, erosion of trust in the law, blurred norms, loss of confidence, vigilantism."}},
      { t:{nl:"Politiestatistieken", en:"Police statistics"},
        d:{nl:"Cijfers over door de politie geregistreerde strafbare feiten (uit opsporing en aangiften). Nadeel: veel misdrijven worden niet bekend, aangiftebereidheid verschilt.",
           en:"Numbers on offences known to the police (from investigation and reports). Drawback: many crimes stay unknown and reporting rates differ."}},
      { t:{nl:"Veiligheidsmonitor", en:"Safety monitor"},
        d:{nl:"Tweejaarlijkse enquête van de overheid om te meten hoe veilig burgers zich voelen en of zij slachtoffer of overlast hebben ervaren.",
           en:"Biennial government survey measuring how safe citizens feel and whether they've experienced victimisation or nuisance."}},
      { t:{nl:"Uitgangspunten strafrecht", en:"Principles of criminal law"},
        d:{nl:"Strafbaar gedrag moet menselijk zijn en in de wet staan; de wet bepaalt de maximale straf; verjaring kan; onschuldpresumptie; rekening met dader en omstandigheden; jeugdstrafrecht voor jongeren.",
           en:"Punishable behaviour must be human and listed in the law; the law sets the maximum penalty; offences can lapse; presumption of innocence; allowance for offender and context; juvenile law for youths."}},
      { t:{nl:"Verjaring", en:"Statute of limitations"},
        d:{nl:"Na een bepaalde periode kan een strafbaar feit niet meer worden vervolgd; de zwaarte van het delict bepaalt de termijn.",
           en:"After a set period a crime can no longer be prosecuted; the seriousness of the offence sets the timeframe."}},
      { t:{nl:"Noodweer", en:"Self-defence (noodweer)"},
        d:{nl:"Verdediging tegen een ogenblikkelijke wederrechtelijke aanranding; het gedrag is dan niet strafbaar.",
           en:"Defence against an immediate unlawful attack; the act is then not punishable."}},
      { t:{nl:"Overmacht", en:"Force majeure / duress"},
        d:{nl:"Omstandigheid waarin iemand niet anders kon handelen dan hij deed; het gedrag is dan niet strafbaar.",
           en:"Situation where someone could not have acted otherwise; the act is then not punishable."}},
      { t:{nl:"Ontoerekenbaarheid", en:"Non-imputability"},
        d:{nl:"De dader kan door een psychische stoornis zijn handelen niet verweten worden; geen straf, maar wel een maatregel zoals tbs mogelijk.",
           en:"Due to a mental disorder the offender cannot be blamed; no punishment, but a measure such as tbs is possible."}},
      { t:{nl:"Strafprocesrecht", en:"Criminal procedural law"},
        d:{nl:"Regels over hoe een strafzaak verloopt: recht op een eerlijk proces, onafhankelijke rechter, recht op advocaat en tolk, openbaarheid van zittingen, taken en bevoegdheden vastgelegd.",
           en:"Rules on how a criminal case proceeds: right to a fair trial, independent judge, right to a lawyer and interpreter, public sessions, defined tasks and powers."}},
      { t:{nl:"Rechten van de verdachte", en:"Rights of the suspect"},
        d:{nl:"Recht om te weten waarvan je verdacht wordt, recht op advocaat (ook gratis), zwijgrecht, beperkte tijd vasthouden, hoger beroep, recht op een eerlijk proces.",
           en:"Right to know the charge, right to a lawyer (free if needed), right to remain silent, limited detention time, right to appeal, right to a fair trial."},
        m:{nl:"<b>WAZBHE</b> — <b>W</b>eten waarvan, <b>A</b>dvocaat, <b>Z</b>wijgrecht, <b>B</b>eperkte tijd, <b>H</b>oger beroep, <b>E</b>erlijk proces.",
           en:"<b>KLSDAF</b> — <b>K</b>now charge, <b>L</b>awyer, <b>S</b>ilence, <b>D</b>etention limit, <b>A</b>ppeal, <b>F</b>air trial."}},
      { t:{nl:"Zwijgrecht", en:"Right to remain silent"},
        d:{nl:"Een verdachte hoeft geen antwoord te geven; wel moet hij meewerken aan identificatie, foto's, vingerafdrukken en DNA-onderzoek.",
           en:"A suspect doesn't have to answer questions; they must still cooperate with ID, photos, fingerprints and DNA testing."}},
      { t:{nl:"Rechten van het slachtoffer", en:"Rights of the victim"},
        d:{nl:"Spreekrecht op de zitting, schadevergoeding vragen via OM, recht op slachtofferhulp, recht op informatie en inzage in het dossier.",
           en:"Right to speak in court, right to claim compensation via the prosecutor, right to victim support, right to information and case-file access."}},
      { t:{nl:"Spreekrecht", en:"Right to speak (in court)"},
        d:{nl:"Slachtoffer (of nabestaande) van een ernstig misdrijf mag op de zitting vertellen wat het misdrijf voor hem heeft betekend.",
           en:"The victim (or surviving relatives) of a serious crime may tell the court what the crime meant for them."}},
      { t:{nl:"Schadevergoeding", en:"Compensation (damages)"},
        d:{nl:"Bedrag dat de dader moet betalen om materiële of immateriële schade van het slachtoffer te vergoeden; iets anders dan een boete.",
           en:"Money the offender must pay to compensate material or non-material harm to the victim; not the same as a fine."}},
      { t:{nl:"Taken van de politie", en:"Tasks of the police"},
        d:{nl:"Handhaven van de openbare orde, opsporen van strafbare feiten (onder leiding van de officier van justitie), preventie en hulpverlening.",
           en:"Maintaining public order, investigating crimes (under the prosecutor's direction), prevention and assistance."}},
      { t:{nl:"Bevoegdheden van de politie", en:"Police powers"},
        d:{nl:"Staande houden, fouilleren, bekeuren, vragen naar identiteit/ID, aanhouden, max. 6–9 uur vasthouden voor verhoor (langer met toestemming OvJ), proces-verbaal opmaken.",
           en:"Stop, search, fine, request ID, arrest, hold up to 6–9 hours for questioning (longer with prosecutor's approval), write up the official report."}},
      { t:{nl:"BOA", en:"BOA (special investigating officer)"},
        d:{nl:"Buitengewoon Opsporingsambtenaar: vult de politie aan bij handhaving van openbare orde en veiligheid; controleert bv. parkeren en milieuregels.",
           en:"Special investigating officer: assists the police in maintaining order and safety; enforces e.g. parking and environmental rules."}},
      { t:{nl:"Volgorde rechtszitting", en:"Order of a court hearing"},
        d:{nl:"1) Opening door rechter, 2) aanklacht (OvJ), 3) verhoor van getuigen, 4) verhoor verdachte, 5) requisitoir, 6) pleidooi advocaat, 7) laatste woord verdachte, 8) uitspraak/vonnis.",
           en:"1) Opening by judge, 2) charges (prosecutor), 3) witness questioning, 4) suspect questioning, 5) prosecutor's closing, 6) defence pleading, 7) suspect's last word, 8) verdict."},
        m:{nl:"<b>8 stappen — O-A-Vg-Vv-R-P-L-U</b>. Verhaaltje: 'Op Avond Vroeg Verdachte: Requisitoir of Pleidooi? Laatste woord, Uitspraak.' OvJ → Advocaat → Verdachte → Rechter.",
           en:"<b>8 steps — O-C-Wq-Sq-Pc-Dp-Lw-V</b>. Story: 'Open, Charges, Witnesses, Suspect, Prosecutor close, Defence plead, Last word, Verdict.'"}},
      { t:{nl:"Requisitoir", en:"Prosecution's closing speech"},
        d:{nl:"Slotbetoog van de officier van justitie waarin hij/zij vertelt waarom de verdachte schuldig is en welke straf hij eist.",
           en:"Closing speech by the prosecutor stating why the suspect is guilty and what sentence is demanded."}},
      { t:{nl:"Pleidooi", en:"Defence pleading"},
        d:{nl:"Slotbetoog van de advocaat ter verdediging van de verdachte.",
           en:"Closing speech by the defence lawyer in defence of the suspect."}},
      { t:{nl:"Transactie / schikkingsvoorstel", en:"Settlement offer"},
        d:{nl:"Voorstel van de OvJ aan de verdachte: betaal een bedrag of doe een taakstraf en de zaak wordt afgesloten zonder rechter.",
           en:"Offer by the prosecutor to the suspect: pay a sum or do community service and the case is closed without trial."}},
      { t:{nl:"Strafbeschikking", en:"Penalty order"},
        d:{nl:"Straf die de OvJ zelf oplegt voor lichte feiten; bezwaar maken kan, dan komt de zaak alsnog voor de rechter.",
           en:"Sentence imposed directly by the prosecutor for minor offences; the suspect can object and have the case heard by a judge."}},
      { t:{nl:"Risicofactoren criminaliteit", en:"Risk factors for crime"},
        d:{nl:"Psychische/gedragsproblemen, onveilige opvoeding, problematisch drank/drugsgebruik en foute vrienden/groepsdruk vergroten de kans op crimineel gedrag.",
           en:"Mental/behavioural problems, an unsafe upbringing, problematic drink/drug use, and bad friends/peer pressure increase the chance of criminal behaviour."}},
      { t:{nl:"Beschermende factoren", en:"Protective factors"},
        d:{nl:"Werk of opleiding, een hecht gezin/relatie en goede sociale vaardigheden verkleinen de kans op crimineel gedrag.",
           en:"Having a job or schooling, a close family/relationship, and good social skills reduce the chance of criminal behaviour."}},
      { t:{nl:"Beleidsterreinen criminaliteit", en:"Crime policy areas"},
        d:{nl:"Opsporingsbeleid, vervolgingsbeleid, gevangenisbeleid en beleid t.a.v. jeugdcriminaliteit.",
           en:"Investigation, prosecution, prison and juvenile-crime policy."}},
      { t:{nl:"Stromingen over criminaliteit", en:"Streams on crime control"},
        d:{nl:"Sociaaldemocratisch: maatschappelijke oorzaken, preventie, taakstraffen. Liberaal: eigen verantwoordelijkheid, repressie, ruimere bevoegdheden. Christendemocratisch: waarden/normen, rol gezin en school.",
           en:"Social-democratic: social causes, prevention, community service. Liberal: personal responsibility, repression, broader powers. Christian-democratic: values/norms, role of family and school."}},
      { t:{nl:"Bijkomende straffen", en:"Additional sanctions"},
        d:{nl:"Straffen die meestal samen met een hoofdstraf worden opgelegd, zoals openbaar maken van de uitspraak of afnemen van het rijbewijs.",
           en:"Sanctions usually imposed alongside a main sentence, e.g. publishing the verdict or revoking a driver's licence."}},
      { t:{nl:"Maatregelen (strafrecht)", en:"Measures (criminal law)"},
        d:{nl:"Geen straf, maar gericht op herstel of bescherming: afnemen van goederen/winst, schadevergoeding aan slachtoffer, tbs.",
           en:"Not a punishment but aimed at recovery or protection: confiscation of goods/profit, compensation to the victim, tbs."}},
      { t:{nl:"Eigenrichting", en:"Vigilantism (eigenrichting)"},
        d:{nl:"Burgers nemen het recht in eigen hand omdat ze geen vertrouwen meer hebben in politie/justitie — wat de overheid juist wil voorkomen.",
           en:"Citizens take the law into their own hands because they've lost trust in the police/courts — something the government tries to prevent."}}
    ]
  },

  media: {
    icon: "📰",
    label: { nl: "Media", en: "Media" },
    blurb: { nl: "Functies, selectie, beïnvloeding & beeldvorming", en: "Functions, selection, influence & framing" },
    terms: [
      { t:{nl:"Massamedia", en:"Mass media"},
        d:{nl:"Communicatiemiddelen die een groot, gevarieerd publiek bereiken (tv, kranten, radio, internet, sociale media).",
           en:"Communication channels reaching a large and varied public (TV, papers, radio, internet, social media)."}},
      { t:{nl:"Informatiefunctie", en:"Information function"},
        d:{nl:"Media informeren burgers over wat er in politiek en maatschappij gebeurt, zodat zij een eigen mening kunnen vormen.",
           en:"Media inform citizens about politics and society so they can form their own opinions."},
        m:{nl:"<b>3 functies in democratie — ICA</b>: <b>I</b>nformatie, <b>C</b>ontrole (waakhond), <b>A</b>genda.<br>+ algemeen: <b>ASIM</b> — <b>A</b>musement, <b>S</b>ocialiseren, <b>I</b>nformatie, <b>M</b>eningsvorming.",
           en:"<b>3 democratic — ICA</b>: <b>I</b>nformation, <b>C</b>ontrol (watchdog), <b>A</b>genda.<br>+ general: <b>ESIO</b> — <b>E</b>ntertainment, <b>S</b>ocialising, <b>I</b>nformation, <b>O</b>pinion-forming."}},
      { t:{nl:"Controle-/waakhondfunctie", en:"Watchdog function"},
        d:{nl:"Media controleren de macht en stellen politieke en maatschappelijke misstanden aan de kaak.",
           en:"Media monitor those in power and expose political and social wrongs."}},
      { t:{nl:"Agendafunctie", en:"Agenda function"},
        d:{nl:"Via vrije pluriforme media kunnen actoren proberen onderwerpen op de publieke en politieke agenda te zetten.",
           en:"Through free, plural media, actors can try to put issues on the public and political agenda."}},
      { t:{nl:"Amusementsfunctie", en:"Entertainment function"},
        d:{nl:"Media bieden ontspanning en vermaak.",
           en:"Media provide relaxation and entertainment."}},
      { t:{nl:"Socialiserende functie", en:"Socialising function"},
        d:{nl:"Media dragen waarden, normen en gedragsregels over en helpen mensen zich aan te passen aan de samenleving.",
           en:"Media transmit values, norms and behaviour rules and help people adjust to society."}},
      { t:{nl:"Meningsvormende functie", en:"Opinion-forming function"},
        d:{nl:"Media helpen mensen een mening te vormen door achtergronden, analyses en commentaar te bieden.",
           en:"Media help people form opinions through background, analysis and commentary."}},
      { t:{nl:"Persvrijheid", en:"Freedom of the press"},
        d:{nl:"De overheid mag zich niet bemoeien met de inhoud van de media en mag geen censuur vooraf uitoefenen.",
           en:"The government may not interfere with media content or impose prior censorship."}},
      { t:{nl:"Pluriformiteit", en:"Pluralism (of media)"},
        d:{nl:"Aanwezigheid van diverse media met verschillende meningen, levensovertuigingen en doelgroepen.",
           en:"Presence of diverse media voicing different opinions, beliefs and audiences."}},
      { t:{nl:"Censuur", en:"Censorship"},
        d:{nl:"De overheid (of een ander machtsorgaan) bepaalt vooraf wat in de media wel of niet verschijnt.",
           en:"The government (or other authority) decides in advance what may appear in the media."}},
      { t:{nl:"Selectieproces (nieuws)", en:"News selection process"},
        d:{nl:"Nieuws is altijd het resultaat van keuzes die journalisten, redacties en persbureaus maken — niet alles wordt nieuws.",
           en:"News is always the result of choices made by journalists, editors and news agencies — not everything becomes news."}},
      { t:{nl:"Nieuwswaarden", en:"News values"},
        d:{nl:"Criteria voor nieuwsselectie: actualiteit, uitzonderlijkheid, nabijheid, doelgroep, commerciële belangen, belangstelling publiek, identiteit medium, referentiekader journalist.",
           en:"Criteria for news selection: timeliness, exceptionality, proximity, audience, commercial interests, public interest, identity of the medium, journalist's frame of reference."}},
      { t:{nl:"Burgerjournalistiek", en:"Citizen journalism"},
        d:{nl:"Burgers verspreiden zelf nieuws via blogs, websites of sociale media; minder filters dan klassieke media.",
           en:"Citizens spread news themselves via blogs, websites or social media; with fewer filters than traditional media."}},
      { t:{nl:"Referentiekader", en:"Frame of reference"},
        d:{nl:"Het geheel van persoonlijke waarden, normen, kennis en ervaringen waarmee iemand informatie selecteert en kleurt.",
           en:"The set of personal values, norms, knowledge and experiences with which someone selects and colours information."}},
      { t:{nl:"Selectieve perceptie", en:"Selective perception"},
        d:{nl:"Mensen nemen vooral informatie waar die past binnen hun referentiekader; afwijkende informatie wordt genegeerd of vervormd.",
           en:"People mainly notice information fitting their frame of reference; conflicting information is ignored or distorted."}},
      { t:{nl:"Beeldvorming", en:"Image-building / framing"},
        d:{nl:"Het beeld dat mensen vormen van personen, groepen of gebeurtenissen, mede op basis van mediaberichtgeving; komt niet altijd overeen met de werkelijkheid.",
           en:"The image people form of persons, groups or events, partly through media reporting; not always matching reality."}},
      { t:{nl:"Stereotype", en:"Stereotype"},
        d:{nl:"Algemene, ongenuanceerde opvatting over de kenmerken van een groep en haar leden.",
           en:"General, oversimplified belief about the characteristics of a group and its members."}},
      { t:{nl:"Vooroordeel", en:"Prejudice"},
        d:{nl:"Een (meestal negatief) gevoel of oordeel over een persoon of groep, vaak zonder dat men de feiten kent.",
           en:"A (usually negative) feeling or judgement about a person or group, often without knowing the facts."}},
      { t:{nl:"Manipulatie", en:"Manipulation"},
        d:{nl:"Mensen bewust op een misleidende manier beïnvloeden via media.",
           en:"Deliberately misleading people through media to influence them."}},
      { t:{nl:"Indoctrinatie", en:"Indoctrination"},
        d:{nl:"Mensen eenzijdig en herhaaldelijk overtuigen van bepaalde ideeën, zonder ruimte voor kritiek.",
           en:"Repeatedly and one-sidedly imposing certain ideas, without room for criticism."}},
      { t:{nl:"Objectiviteit", en:"Objectivity"},
        d:{nl:"Berichtgeving die zo feitelijk en onpartijdig mogelijk is: hoor en wederhoor, feiten controleren, scheiden van feit en mening.",
           en:"Reporting that is as factual and impartial as possible: hearing both sides, fact-checking, separating fact from opinion."}},
      { t:{nl:"Subjectiviteit", en:"Subjectivity"},
        d:{nl:"Berichtgeving die gekleurd is door persoonlijke mening, gevoel of belangen.",
           en:"Reporting coloured by personal opinion, feeling or interests."}},
      { t:{nl:"Hoor en wederhoor", en:"Hearing both sides"},
        d:{nl:"Journalistieke norm: bij een conflict laat je alle betrokken partijen aan het woord.",
           en:"Journalistic norm: in a dispute, you let all parties involved have their say."}},
      { t:{nl:"Injectienaaldtheorie", en:"Hypodermic needle theory"},
        d:{nl:"Theorie dat media het publiek 'inspuiten' met ideeën en informatie; mensen zijn passieve afnemers en kunnen worden geïndoctrineerd.",
           en:"Theory that media 'inject' the public with ideas and information; people are passive receivers and can be indoctrinated."},
        m:{nl:"<b>4 beïnvloedingstheorieën — IFAS</b>: <b>I</b>njectienaald, <b>F</b>raming, <b>A</b>genda, <b>S</b>electieve perceptie. Denk: 'In Frans Avondje Slapen'.",
           en:"<b>4 influence theories — HFAS</b>: <b>H</b>ypodermic needle, <b>F</b>raming, <b>A</b>genda-setting, <b>S</b>elective perception."}},
      { t:{nl:"Framingtheorie", en:"Framing theory"},
        d:{nl:"Media belichten een onderwerp op een bepaalde manier — een 'frame' — en sturen daarmee hoe mensen erover denken en praten.",
           en:"Media highlight a topic in a particular way — a 'frame' — steering how people think and talk about it."}},
      { t:{nl:"Agendatheorie", en:"Agenda-setting theory"},
        d:{nl:"Media bepalen door hoeveel aandacht ze ergens aan besteden waarover mensen praten en wat ze belangrijk vinden, maar niet hoe ze erover denken.",
           en:"Media decide via the amount of attention what people talk about and find important, but not how they think about it."}},
      { t:{nl:"Selectieve-perceptietheorie", en:"Selective perception theory"},
        d:{nl:"Mensen filteren mediaboodschappen door hun referentiekader; alleen wat past, dringt door.",
           en:"People filter media messages through their frame of reference; only what fits gets through."}},
      { t:{nl:"Rol media in democratie", en:"Role of media in democracy"},
        d:{nl:"Media zijn de 'waakhond': informeren, controleren de macht, geven actoren toegang tot de politieke agenda en bevorderen pluriformiteit.",
           en:"Media are the 'watchdog': they inform, monitor power, give actors access to the political agenda and foster pluralism."}},
      { t:{nl:"Rol media bij criminaliteit", en:"Role of media regarding crime"},
        d:{nl:"Door oververtegenwoordiging van gewelds- en opvallende misdrijven kan het beeld over criminaliteit afwijken van de werkelijkheid en kunnen onveiligheidsgevoelens toenemen.",
           en:"Over-reporting of violent and striking crimes can distort the perceived crime picture and increase feelings of insecurity."}},
      { t:{nl:"Kopieergedrag", en:"Copycat behaviour"},
        d:{nl:"Mensen die crimineel gedrag overnemen na het zien van vergelijkbare berichten in de media.",
           en:"People copying criminal behaviour after seeing similar acts in the media."}}
    ]
  },

  analyse: {
    icon: "🔍",
    label: { nl: "Analyse Maatschappelijk Vraagstuk", en: "Analysis of a Social Issue" },
    blurb: { nl: "Vier benaderingswijzen, bronnen beoordelen, standpunt", en: "Four perspectives, source evaluation, position" },
    terms: [
      { t:{nl:"Maatschappelijk vraagstuk", en:"Social issue"},
        d:{nl:"Situatie die veel mensen onwenselijk vinden, waarover verschillende meningen bestaan, die om collectieve actie vraagt en de aandacht van media en overheid krijgt.",
           en:"Situation many people find undesirable, on which opinions differ, which calls for collective action and gets media and government attention."}},
      { t:{nl:"Kenmerken maatschappelijk vraagstuk", en:"Features of a social issue"},
        d:{nl:"1) Veel mensen vinden het ongewenst, 2) verschillende waarden/normen/belangen, 3) er zijn oplossingen denkbaar via maatschappelijke organisaties, burgers of overheid, 4) krijgt aandacht van media en publieke opinie.",
           en:"1) Many find it undesirable, 2) different values/norms/interests, 3) solutions imaginable via organisations, citizens or government, 4) gains attention from media and public opinion."}},
      { t:{nl:"Politiek-juridische benadering", en:"Political-legal approach"},
        d:{nl:"Kijkt naar beleid, wetten, machtsmiddelen, politieke partijen en de rol van de overheid bij het vraagstuk.",
           en:"Looks at policy, laws, power resources, political parties and the role of government in the issue."},
        m:{nl:"<b>4 benaderingswijzen — PSSV</b>: <b>P</b>olitiek-juridisch, <b>S</b>ociaaleconomisch, <b>S</b>ociaal-cultureel, <b>V</b>eranderings-/vergelijkend. Denk: 'Politici Spreken Slim Vooruit'.",
           en:"<b>4 perspectives — PSSC</b>: <b>P</b>olitical-legal, <b>S</b>ocio-economic, <b>S</b>ocio-cultural, <b>C</b>omparative/historical."}},
      { t:{nl:"Sociaaleconomische benadering", en:"Socio-economic approach"},
        d:{nl:"Kijkt naar belangen, maatschappelijke positie, arbeidsverhoudingen, sociale ongelijkheid en financiële aspecten.",
           en:"Looks at interests, social position, labour relations, social inequality and financial aspects."}},
      { t:{nl:"Sociaal-culturele benadering", en:"Socio-cultural approach"},
        d:{nl:"Kijkt naar waarden, normen, cultuur, identiteit, beeldvorming, socialisatie en de rol van media.",
           en:"Looks at values, norms, culture, identity, image-building, socialisation and the role of media."}},
      { t:{nl:"Veranderings- en vergelijkende benadering", en:"Comparative/historical approach"},
        d:{nl:"Kijkt naar veranderingen in de tijd en vergelijkt het vraagstuk met andere samenlevingen of perioden.",
           en:"Looks at change over time and compares the issue with other societies or periods."}},
      { t:{nl:"Algemeen belang", en:"Common good / general interest"},
        d:{nl:"Belang van de samenleving als geheel, dat boven individuele belangen kan staan.",
           en:"Interest of society as a whole, which can outweigh individual interests."}},
      { t:{nl:"Tegengestelde belangen", en:"Conflicting interests"},
        d:{nl:"Verschillende groepen willen onverenigbare dingen; centraal in veel maatschappelijke vraagstukken.",
           en:"Different groups want incompatible things; central to many social issues."}},

   No external files needed; everything is generated with Web Audio API

const AudioEngine = {
  ctx:null, master:null, musicBus:null, fxBus:null, noiseBus:null,
  playing:false, musicType:"lofi", volume:0.35, sfxOn:true,
  sources:[], timers:[],

  ensure(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    this.ctx = new AC();
    this.master = this.ctx.createGain(); this.master.gain.value = 1;
    this.master.connect(this.ctx.destination);
    this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = this.volume;
    this.fxBus = this.ctx.createGain(); this.fxBus.gain.value = 0.55;
    this.musicBus.connect(this.master);
    this.fxBus.connect(this.master);
  },

  // ----- SFX -----
  blip(freq, dur, type, vol){
    if(!this.sfxOn) return;
    this.ensure();
    if(this.ctx.state === "suspended") this.ctx.resume();
    const t = this.ctx.currentTime;
    const o = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    o.type = type||"sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol||0.18, t+0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.1));
    o.connect(g).connect(this.fxBus);
    o.start(t); o.stop(t+(dur||0.1)+0.05);
  },
  flip(){ this.blip(900, 0.04, "square", 0.09); },
  click(){ this.blip(660, 0.04, "triangle", 0.08); },
  tap(){ this.blip(880, 0.025, "sine", 0.06); },
  pop(){
    if(!this.sfxOn) return;
    this.ensure();
    [520, 760].forEach((f,i)=> setTimeout(()=>this.blip(f, 0.06, "triangle", 0.09), i*40));
  },
  correct(){
    if(!this.sfxOn) return;
    [523.25, 659.25, 783.99].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.18, "sine", 0.16), i*70);
    });
  },
  wrong(){
    if(!this.sfxOn) return;
    [330, 247].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.18, "sawtooth", 0.1), i*100);
    });
  },
  almost(){
    if(!this.sfxOn) return;
    [440, 523].forEach((f,i)=>{
      setTimeout(()=>this.blip(f, 0.12, "sine", 0.12), i*80);
    });
  },

  // ----- MUSIC -----
  // Real lofi/ambient via YouTube. Procedural fallback for synth/noise types.
  // YouTube IDs of well-known public 24/7 study streams + ambience.
  YT_TRACKS: {
    lofi:     "jfKfPfyJRdk",  // Lofi Girl - beats to relax/study to
    chillhop: "5yx6BWlEVcY",  // Chillhop Cafe / chill beats
    rain:     "mPZkdNFkNps",  // Rain on window 10 hours
    forest:   "xNN7iTA57jM"   // Forest birds ambience
  },

  start(){
    this.ensure();
    if(this.ctx.state === "suspended") this.ctx.resume();
    if(this.playing) return;
    this.playing = true;

    if(this.YT_TRACKS[this.musicType]){
      this._startYT(this.YT_TRACKS[this.musicType]);
    } else if(this.musicType === "brown"){
      this._startBrownNoise();
    } else if(this.musicType === "ambient"){
      this._startPads();
    }
  },

  stop(){
    this.playing = false;
    this.sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
    this.sources = [];
    this.timers.forEach(t=>clearTimeout(t));
    this.timers = [];
    this._stopYT();
  },

  setVolume(v){
    this.volume = v;
    this.ensure();
    this.musicBus.gain.setTargetAtTime(v, this.ctx.currentTime, 0.2);
    // YouTube iframe embed volume is controlled by the phone's volume buttons.
  },

  changeType(t){
    const wasPlaying = this.playing;
    this.stop();
    this.musicType = t;
    if(wasPlaying) this.start();
  },

  // ----- YouTube embed (real lofi tracks) — uses a plain iframe, no API.
  // The IFrame API can fail to load on file:// origins or with ad-blockers;
  // a bare <iframe> with autoplay=1 just works wherever embeds are allowed.
  _startYT(videoId){
    const host = document.getElementById("ytHost");
    if(!host) return;
    // Make the iframe visually invisible but functionally present.
    // For some browsers, the iframe must have non-zero size for audio to play reliably.
    // We keep it off-screen via fixed positioning on the host element.
    host.innerHTML = `<iframe
      width="200" height="120"
      src="https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0&playsinline=1"
      title="study music"
      frameborder="0"
      allow="autoplay; encrypted-media; fullscreen"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>`;
    this._yt = true; // flag so stop knows to clear
  },
  _stopYT(){
    const host = document.getElementById("ytHost");
    if(host) host.innerHTML = "";
    this._yt = null;
  },

  // ----- Brown noise (deeper, more relaxing than white noise) -----
  _startBrownNoise(){
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr*4, sr); // 4s loop
    const data = buf.getChannelData(0);
    let lastOut = 0;
    for(let i=0;i<data.length;i++){
      const white = Math.random()*2 - 1;
      lastOut = (lastOut + (0.02 * white)) / 1.02;
      data[i] = lastOut * 3.5; // amplify
    }
    const s = this.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 1000;
    const g = this.ctx.createGain();
    g.gain.value = 0.55;
    s.connect(filt).connect(g).connect(this.musicBus);
    s.start();
    this.sources.push(s);
  },

  _startPads(){
    const chordDur = 6; // seconds per chord
    const playChord = (notes, startT) => {
      notes.forEach((freq, idx) => {
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        const filt = this.ctx.createBiquadFilter();
        filt.type = "lowpass";
        filt.frequency.value = 900;
        filt.Q.value = 1.4;
        o.type = idx === 0 ? "sine" : "triangle";
        o.frequency.value = freq * 0.5; // warmer low octave
        g.gain.setValueAtTime(0, startT);
        g.gain.linearRampToValueAtTime(0.13, startT + 1.6);
        g.gain.linearRampToValueAtTime(0.10, startT + chordDur - 1.4);
        g.gain.linearRampToValueAtTime(0, startT + chordDur);
        // slow gentle detune
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.value = 0.15 + Math.random()*0.2;
        lfoGain.gain.value = 2.5;
        lfo.connect(lfoGain).connect(o.frequency);
        o.connect(filt).connect(g).connect(this.musicBus);
        lfo.start(startT); lfo.stop(startT + chordDur + 0.1);
        o.start(startT); o.stop(startT + chordDur + 0.2);
        this.sources.push(o, lfo);
      });
    };

    const loop = (offset) => {
      this.CHORDS.forEach((c,i) => playChord(c, offset + i*chordDur));
    };

    let t = this.ctx.currentTime + 0.1;
    loop(t);
    const loopLen = this.CHORDS.length * chordDur;
    const schedule = () => {
      if(!this.playing) return;
      t += loopLen;
      loop(t);
      this.timers.push(setTimeout(schedule, (loopLen - 1.5)*1000));
    };
    this.timers.push(setTimeout(schedule, (loopLen - 1.5)*1000));
  },

  _startBeat(){
    // Slow lofi-ish beat ~70 BPM: soft kick + brushed hat
    const bpm = 70;
    const beat = 60/bpm;
    const step = (i, startT) => {
      // Kick on 1 and 3
      if(i % 2 === 0){
        const o = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        o.frequency.setValueAtTime(120, startT);
        o.frequency.exponentialRampToValueAtTime(45, startT + 0.18);
        g.gain.setValueAtTime(0, startT);
        g.gain.linearRampToValueAtTime(0.18, startT + 0.005);
        g.gain.exponentialRampToValueAtTime(0.001, startT + 0.22);
        o.connect(g).connect(this.musicBus);
        o.start(startT); o.stop(startT + 0.25);
        this.sources.push(o);
      }
      // Hat on every offbeat (i % 2 === 1) at lower volume
      if(i % 2 === 1){
        const buf = this._noiseBuffer(0.08);
        const s = this.ctx.createBufferSource();
        const filt = this.ctx.createBiquadFilter();
        const g = this.ctx.createGain();
        filt.type = "highpass"; filt.frequency.value = 6000;
        s.buffer = buf;
        g.gain.setValueAtTime(0.05, startT);
        g.gain.exponentialRampToValueAtTime(0.001, startT + 0.07);
        s.connect(filt).connect(g).connect(this.musicBus);
        s.start(startT); s.stop(startT + 0.1);
        this.sources.push(s);
      }
    };

    let counter = 0;
    let t0 = this.ctx.currentTime + 0.1;
    const schedule = () => {
      if(!this.playing) return;
      for(let i=0;i<8;i++){ step(counter++, t0 + i*beat); }
      t0 += 8*beat;
      this.timers.push(setTimeout(schedule, 8*beat*1000 - 200));
    };
    schedule();
  },

  _noiseBuffer(seconds){
    const sr = this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, sr*seconds, sr);
    const data = buf.getChannelData(0);
    for(let i=0;i<data.length;i++){ data[i] = (Math.random()*2 - 1); }
    return buf;
  },

  _startRain(level){
    // Use a long noise loop through a lowpass for soft rain
    const buf = this._noiseBuffer(2);
    const s = this.ctx.createBufferSource();
    s.buffer = buf; s.loop = true;
    const filt = this.ctx.createBiquadFilter();
    filt.type = "lowpass"; filt.frequency.value = 1400; filt.Q.value = 0.5;
    const g = this.ctx.createGain();
    g.gain.value = (level != null ? level : 0.18);
    s.connect(filt).connect(g).connect(this.musicBus);
    s.start();
    this.sources.push(s);
  }
};

/* YouTube IFrame API loader */
function loadYTAPI(cb){
  if(window.YT && window.YT.Player){ cb(); return; }
  if(window._ytLoading){ window._ytWaiters.push(cb); return; }
  window._ytLoading = true;
  window._ytWaiters = [cb];
  window.onYouTubeIframeAPIReady = () => {
    window._ytWaiters.forEach(f => { try{ f(); }catch(e){} });
    window._ytWaiters = [];
  };
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.async = true;
  document.head.appendChild(s);
}

// Unlock audio on the very first user gesture (some browsers start AudioContext suspended)
function _unlockAudioOnce(){
  AudioEngine.ensure();
  if(AudioEngine.ctx && AudioEngine.ctx.state === "suspended"){
    AudioEngine.ctx.resume();
  }
  // Silent tap so iOS/Safari treats the context as "running"
  AudioEngine.blip(440, 0.001, "sine", 0.0001);
  document.removeEventListener("pointerdown", _unlockAudioOnce, true);
  document.removeEventListener("touchstart", _unlockAudioOnce, true);
  document.removeEventListener("keydown", _unlockAudioOnce, true);
}
document.addEventListener("pointerdown", _unlockAudioOnce, true);

/* =========================================================================
   SCORING & PROGRESS TRACKER
   - cards[<topic>:<idx>] = { seen, correct, wrong, streak, mastered, lastSeen }
   - sessions = [{ date, topic, mode, correct, wrong, total, bestStreak }]
   - daily = { lastDate, streak, longest }
   - totals = { correct, wrong, seen, sessions }
   - achievements = { id: true }
   ========================================================================= */

const SCORE_KEY = "mk_score_v1";

function loadScore(){
  try{
    const raw = localStorage.getItem(SCORE_KEY);
    if(!raw) return defaultScore();
    const s = JSON.parse(raw);
    // Fill any missing branches
    return Object.assign(defaultScore(), s, {
      cards: Object.assign({}, s.cards||{}),
      sessions: s.sessions || [],
      achievements: Object.assign({}, s.achievements||{})
    });
  }catch(e){ return defaultScore(); }
}
function defaultScore(){
  return {
    cards: {},
    sessions: [],
    daily: { lastDate: null, streak: 0, longest: 0 },
    totals: { correct: 0, wrong: 0, seen: 0, sessions: 0 },
    achievements: {}
  };
}
function saveScore(s){
  try{ localStorage.setItem(SCORE_KEY, JSON.stringify(s)); }catch(e){}
}

let SCORE = loadScore();

function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function dateMinus(daysBefore){
  const d = new Date();
  d.setDate(d.getDate()-daysBefore);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}

// Mastery rule: 3 correct in a row OR 5 correct overall with >=70% accuracy
function isMastered(card){
  if(!card) return false;
  if((card.streak||0) >= 3) return true;
  if((card.correct||0) >= 5 && card.correct/(card.correct+card.wrong) >= 0.7) return true;
  return false;
}

function recordCard(topicKey, cardIdx, gotRight){
  const k = topicKey+":"+cardIdx;
  const c = SCORE.cards[k] || { seen:0, correct:0, wrong:0, streak:0, mastered:false, lastSeen:null };
  c.seen += 1;
  c.lastSeen = Date.now();
  if(gotRight){ c.correct += 1; c.streak = (c.streak||0)+1; }
  else { c.wrong += 1; c.streak = 0; }
  c.mastered = isMastered(c);
  SCORE.cards[k] = c;
  SCORE.totals.correct += gotRight ? 1 : 0;
  SCORE.totals.wrong   += gotRight ? 0 : 1;
  SCORE.totals.seen    += 1;
  saveScore(SCORE);
}

function updateDailyStreak(){
  const today = todayKey();
  if(SCORE.daily.lastDate === today) return; // already counted today
  const yest = dateMinus(1);
  if(SCORE.daily.lastDate === yest) SCORE.daily.streak += 1;
  else SCORE.daily.streak = 1;
  SCORE.daily.lastDate = today;
  if(SCORE.daily.streak > (SCORE.daily.longest||0)) SCORE.daily.longest = SCORE.daily.streak;
  saveScore(SCORE);
}

function recordSession(sess){
  SCORE.sessions.unshift({ ...sess, date: new Date().toISOString() });
  if(SCORE.sessions.length > 30) SCORE.sessions.length = 30;
  SCORE.totals.sessions += 1;
  updateDailyStreak();
  checkAchievements(sess);
  saveScore(SCORE);
}

function topicMasteryPct(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  if(!total) return 0;
  let mastered = 0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(c && c.mastered) mastered++;
  }
  return Math.round((mastered/total)*100);
}

// Dutch exam-style 1-10 grade per topic + passing status.
// 5.5+ with at least 50% coverage = "passing" (geslaagd).
// 4.0-5.4 = "almost" (bijna). Below 4 = "needs work" (meer oefenen).
// Too few cards seen = "starting" (aan het leren). None seen = "untouched".
function topicGrade(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  if(!total) return { status:"untouched" };
  let correct=0, wrong=0, seen=0, mastered=0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(!c) continue;
    seen++;
    correct += c.correct||0;
    wrong   += c.wrong||0;
    if(c.mastered) mastered++;
  }
  if(seen === 0) return { status:"untouched", grade:null, total };
  const attempts = correct + wrong;
  const accuracy = attempts ? correct/attempts : 0;
  const coverage = seen / total;
  const masteryPct = mastered / total;
  // Effective grade: blend accuracy (60%) with mastery (40%) and scale by coverage.
  // Coverage below 50% drags the grade down (you might be lucky but unprepared).
  const coverageFactor = Math.min(1, coverage / 0.5);
  const rawGrade = ((accuracy * 0.6) + (masteryPct * 0.4)) * 10 * coverageFactor;
  const grade = Math.round(rawGrade * 10) / 10;
  let status;
  if(seen < Math.min(8, Math.ceil(total*0.2))) status = "starting";
  else if(grade >= 5.5 && coverage >= 0.5) status = "passing";
  else if(grade >= 4.0) status = "almost";
  else status = "needsWork";
  return { status, grade, coverage, accuracy, masteryPct, seen, total };
}

function statusInfo(status, lang){
  const NL = lang === "nl";
  switch(status){
    case "passing":   return { ico:"✅", cls:"st-pass",   label: NL?"Geslaagd":"Passing" };
    case "almost":    return { ico:"⚠️", cls:"st-almost", label: NL?"Bijna":"Almost" };
    case "needsWork": return { ico:"❗", cls:"st-low",    label: NL?"Meer oefenen":"Keep studying" };
    case "starting":  return { ico:"📚", cls:"st-start",  label: NL?"Aan het leren":"Learning" };
    default:          return { ico:"⭕", cls:"st-none",   label: NL?"Start hier":"Start here" };
  }
}
function topicCounts(s, topicKey){
  const total = (DATA[topicKey]||{terms:[]}).terms.length;
  let seen=0, mastered=0, struggling=0;
  for(let i=0;i<total;i++){
    const c = s.cards[topicKey+":"+i];
    if(!c) continue;
    seen++;
    if(c.mastered) mastered++;
    else if(c.wrong > c.correct) struggling++;
  }
  return { total, seen, mastered, struggling };
}

function L(){ return i18n[state.lang]; }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function normalize(s){
  return (s||"").toLowerCase()
    .replace(/[áàäâã]/g,"a").replace(/[éèëê]/g,"e").replace(/[íìïî]/g,"i")
    .replace(/[óòöôõ]/g,"o").replace(/[úùüû]/g,"u").replace(/ç/g,"c")
    .replace(/[^\w\s]/g," ").replace(/\s+/g," ").trim();
}
function keyWords(s){
  const stop = new Set(["the","a","an","of","to","in","is","are","be","by","or","and","with","that","this","on","for","as","it","een","de","het","van","en","of","is","zijn","te","door","bij","op","met","aan","dat","die","ook","of","voor"]);
  return normalize(s).split(" ").filter(w=>w.length>3 && !stop.has(w));
}
function similarity(user, answer){
  const u = new Set(keyWords(user));
  const a = keyWords(answer);
  if(a.length===0) return 0;
  let hits = 0;
  a.forEach(w => { if(u.has(w)) hits++; });
  return hits / a.length;
}

// Fetch a Wikipedia lead image via MediaWiki's pageimages API.
// `redirects=1` follows article redirects so we don't have to know exact titles.
async function fetchWikiImage(title){
  const url = `https://en.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail%7Coriginal&pithumbsize=600&redirects=1&titles=${encodeURIComponent(title)}&origin=*`;
  try{
    const r = await fetch(url, { mode: "cors" });
    if(!r.ok){ console.warn("Wiki fetch HTTP", r.status, title); return null; }
    const data = await r.json();
    const pages = data && data.query && data.query.pages;
    if(!pages){ console.warn("Wiki fetch no pages", title); return null; }
    for(const k in pages){
      const p = pages[k];
      const src = (p.thumbnail && p.thumbnail.source) || (p.original && p.original.source);
      if(src) return src;
    }
    console.warn("Wiki fetch no thumbnail", title);
    return null;
  }catch(e){
    console.warn("Wiki image fetch failed for", title, e.message);
    return null;
  }
}

function injectPraktijkImage(wikiTitle, src){
  if(!src) return;
  const wrap = document.querySelector(`[data-prk-img="${wikiTitle}"]`);
  if(!wrap || wrap.querySelector("img")) return;
  // Force wrap shape via inline styles so cached/old CSS can't crop the image
  wrap.style.cssText += ";min-height:120px;max-height:none;padding:8px;display:flex;align-items:center;justify-content:center;overflow:visible;";
  const img = document.createElement("img");
  img.src = src;
  img.alt = "";
  img.loading = "lazy";
  // Inline styles win over any cached CSS — guarantees the image isn't cropped
  img.style.cssText = "max-width:100%;max-height:180px;width:auto;height:auto;object-fit:contain;display:block;border-radius:10px;";
  img.onerror = () => { img.remove(); };
  const credit = document.createElement("a");
  credit.className = "prk-img-credit";
  credit.target = "_blank";
  credit.rel = "noopener";
  credit.href = `https://en.wikipedia.org/wiki/${wikiTitle}`;
  credit.textContent = "Wikipedia ↗";
  const placeholder = wrap.querySelector(".prk-img-placeholder");
  if(placeholder) placeholder.remove();
  wrap.appendChild(img);
  wrap.appendChild(credit);
}

const CURRENTLY_COORDS = { lat: 52.37, lon: 4.89, name: "Amsterdam" }; // override if needed

function currentlyNow(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
}
function currentlyToday(lang){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,"0");
  const mm = String(d.getMonth()+1).padStart(2,"0");
  const yyyy = d.getFullYear();
  if(lang === "nl"){
    const days = ["zon","maa","din","woe","don","vri","zat"];
    return `${days[d.getDay()]} · ${dd}.${mm}.${yyyy}`;
  }
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  return `${days[d.getDay()]} · ${dd}.${mm}.${yyyy}`;
}

];

const MOOD_KEY = "mk_mood_v1";

function getMoodId(){
  try{ return localStorage.getItem(MOOD_KEY) || "auto"; }catch(e){ return "auto"; }
}
function getMoodOption(id){
  return MOOD_OPTIONS.find(m => m.id === id) || MOOD_OPTIONS[0];
}
function setMood(id){
  try{ localStorage.setItem(MOOD_KEY, id); }catch(e){}
  if(state.view === "home"){
    // Re-render just the mood cell, don't rebuild the whole home page
    const el = document.getElementById("curMood");
    if(el){
      el.innerHTML = renderMoodCell();
    }
  }
}
function renderMoodCell(){
  const id = getMoodId();
  const opt = getMoodOption(id);
  if(id === "auto"){
    const today = new Date();
    const exam = new Date(state.examDate+"T08:00:00");
    const daysToExam = Math.max(0, Math.ceil((exam - today)/(1000*60*60*24)));
    const wRaw = (function(){ try{ return JSON.parse(localStorage.getItem(CURRENTLY_WEATHER_KEY)||"null"); }catch(e){ return null;} })();
    const code = wRaw ? wRaw.code : null;
    const computed = currentlyMood(daysToExam, code, state.lang);
    return `<span class="cur-mood-ico">✦</span>` + buildMoodSelect("auto", computed);
  }
  const labelText = state.lang === "nl" ? opt.nl : opt.en;
  return `<span class="cur-mood-ico">${opt.ico}</span>` + buildMoodSelect(id, labelText);
}
function buildMoodSelect(currentId, displayLabel){
  // Render the <select> with options; the currently-selected one shows in the closed state.
  const opts = MOOD_OPTIONS.map(m => {
    const lab = state.lang === "nl" ? m.nl : m.en;
    const sel = m.id === currentId ? " selected" : "";
    // For "auto", show the live computed label so the closed select reads naturally
    const shown = (m.id === "auto" && currentId === "auto")
      ? `${m.ico}  ${displayLabel}`
      : `${m.ico}  ${lab}`;
    return `<option value="${m.id}"${sel}>${shown}</option>`;
  }).join("");
  return `<select class="mood-select" onchange="setMood(this.value)">${opts}</select>`;
}

function currentlyMood(daysToExam, weatherCode, lang){
  // Mood is exam-pressure first, weather second, kept light.
  let phrase;
  if(daysToExam <= 1)      phrase = lang==="nl" ? "klaar voor de strijd" : "ready for it";
  else if(daysToExam <= 3) phrase = lang==="nl" ? "vol focus"            : "in deep focus";
  else if(daysToExam <= 7) phrase = lang==="nl" ? "lekker bezig"          : "on a roll";
  else                     phrase = lang==="nl" ? "rustig aan"            : "taking it slow";

  const w = WMO[weatherCode];
  if(w && w.mood){
    if(w.mood === "knus")    phrase += lang==="nl" ? " · knus binnen"  : " · cozy inside";
    if(w.mood === "zonnig")  phrase += lang==="nl" ? " · zonnig"        : " · sunny vibes";
    if(w.mood === "dromerig")phrase += lang==="nl" ? " · dromerig"      : " · dreamy";
    if(w.mood === "intens")  phrase += lang==="nl" ? " · alles op alles": " · all in";
    if(w.mood === "licht")   phrase += lang==="nl" ? " · luchtig"       : " · breezy";
  }
  return phrase;
}

const CURRENTLY_WEATHER_KEY = "mk_weather_v1";

async function loadWeather(){
  if(state.view !== "home") return;
  const el = document.getElementById("curWeather");
  if(!el) return;
  const NL = state.lang === "nl";

  // Cached value (re-use for 30 minutes)
  let cached = null;
  try{ cached = JSON.parse(localStorage.getItem(CURRENTLY_WEATHER_KEY) || "null"); }catch(e){}
  if(cached && (Date.now() - cached.t) < 30 * 60 * 1000){
    applyWeatherToCurrently(cached.temp, cached.code);
    return;
  }

  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${CURRENTLY_COORDS.lat}&longitude=${CURRENTLY_COORDS.lon}&current_weather=true&temperature_unit=celsius`;
    const r = await fetch(url);
    if(!r.ok){ el.textContent = NL ? "—" : "—"; return; }
    const data = await r.json();
    const cw = data && data.current_weather;
    if(!cw){ el.textContent = "—"; return; }
    const temp = Math.round(cw.temperature);
    const code = cw.weathercode;
    try{ localStorage.setItem(CURRENTLY_WEATHER_KEY, JSON.stringify({temp, code, t: Date.now()})); }catch(e){}
    applyWeatherToCurrently(temp, code);
  }catch(e){
    el.textContent = NL ? "—" : "—";
  }
}

function applyWeatherToCurrently(temp, code){
  const el = document.getElementById("curWeather");
  const moodEl = document.getElementById("curMood");
  if(!el) return;
  const w = WMO[code] || { nl:"—", en:"—" };
  el.innerHTML = `<b>${temp}°C</b> · ${w[state.lang] || w.nl}`;
  // Only refresh the mood line if user has it on "auto"
  if(moodEl && getMoodId() === "auto"){
    moodEl.innerHTML = renderMoodCell();
  }
}

   GUESTBOOK — reads from GitHub Issue comments.

   note, just comment on that issue from any device
