function escapeAttr(s){ return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

/* Damerau-ish Levenshtein edit distance.
   Counts inserts/deletes/substitutions; we include transpositions as 1 op too,
   so "rehctsstaat" ↔ "rechtsstaat" costs 1, not 2. */
function editDistance(a, b){
  a = a || ""; b = b || "";
  const m = a.length, n = b.length;
  if(m === 0) return n;
  if(n === 0) return m;
  // One-row DP, with previous-row & prev-prev-row to handle adjacent transposition.
  let prev2 = null;
  let prev = new Array(n+1);
  for(let j=0; j<=n; j++) prev[j] = j;
  for(let i=1; i<=m; i++){
    const cur = new Array(n+1);
    cur[0] = i;
    for(let j=1; j<=n; j++){
      const cost = a[i-1] === b[j-1] ? 0 : 1;
      cur[j] = Math.min(
        cur[j-1] + 1,      // insert
        prev[j] + 1,       // delete
        prev[j-1] + cost   // substitute
      );
      // adjacent transposition
      if(i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]){
        cur[j] = Math.min(cur[j], prev2[j-2] + 1);
      }
    }
    prev2 = prev; prev = cur;
  }
  return prev[n];
}

/* Smarter scoring for short terms. Returns 0..1.
   Forgives:
   - leading articles (de/het/een/the/a/an)
   - missing/extra spaces in compound words (tweede kamer ↔ tweedekamer)
   - tiny typos (~12% of answer length, min 1 for words ≥4 chars; min 2 for ≥10) */
function scoreTerm(user, answer){
  const nu = normalize(user);
  const na = normalize(answer);
  if(!nu) return 0;
  if(nu === na) return 1;

  // strip leading article
  const strip = s => s.replace(/^(de|het|een|the|a|an)\s+/, "");
  const sNu = strip(nu), sNa = strip(na);
  if(sNu === sNa) return 1;

  // ignore all whitespace for compound-word forgiveness
  const collapse = s => s.replace(/\s+/g, "");
  const cNu = collapse(sNu), cNa = collapse(sNa);
  if(cNu === cNa) return 1;

  // Fuzzy edit-distance: tolerate small typos.
  // Tolerance scales with answer length:
  //   <4 chars  → only exact wins
  //   4-9       → 1 typo
  //   10-19     → 2 typos
  //   20+       → ~12% of length
  const len = cNa.length;
  let tol = 0;
  if(len >= 4 && len < 10) tol = 1;
  else if(len >= 10 && len < 20) tol = 2;
  else if(len >= 20) tol = Math.max(2, Math.floor(len * 0.12));

  if(tol > 0){
    const d = editDistance(cNu, cNa);
    if(d <= tol) return 1;
    if(d <= tol * 2) return 0.7;
  }

  // Substring inclusion (e.g. she wrote a synonym phrase that includes the term)
  if(na.includes(nu) && nu.length >= Math.max(4, na.length*0.6)) return 0.9;
  if(nu.includes(na)) return 0.95;

  // keyword overlap as a last resort (mostly a no-op for single-word answers)
  return similarity(user, answer);
}

function checkTypeAnswer(){
  const c = currentCard();
  const user = document.getElementById("typeInput").value;
  const score = scoreTerm(user, c.t[state.lang]);
  state.feedback = { user, score };
  if(score >= 0.7) AudioEngine.correct();
  else if(score >= 0.4) AudioEngine.almost();
  else AudioEngine.wrong();
  render();
}

function nextAfterType(){
  AudioEngine.click();
  const ok = state.feedback && state.feedback.score >= 0.7;
  recordCurrentCardResult(ok);
  // suppress double-sfx from nextCard since we already played one
  state.correct += ok ? 1 : 0;
  state.wrong   += ok ? 0 : 1;
  state.idx++;
  state.flipped = false;
  state.feedback = null;
  if(state.idx >= state.deck.length){
    finishSession();
    state.view = "done";
  }
  render();
}
function overrideTypeWrong(){ state.feedback.score = 0; AudioEngine.click(); render(); }
function overrideTypeRight(){ state.feedback.score = 1; AudioEngine.click(); render(); }
function skipType(){
  AudioEngine.click();
  state.feedback = { user: "", score: 0 };
  render();
}

/* ----- TYPE THE DEFINITION (self-graded) -----
   Show the term, ask her to write the definition.
   After Check: side-by-side with keyword highlights, then she picks
   "Got it / Close / Missed it" — her honest self-grade drives recordCard.
*/

function viewTypeDef(){
  const c = currentCard();
  const NL = state.lang === "nl";
  const term = c.t[state.lang];
  const answer = c.d[state.lang];
  const fb = state.feedback;

  // Build keyword sets for the highlight diff
  let userHTML = "", answerHTML = "", coverage = 0;
  if(fb){
    const userText = fb.user || "";
    const userTokens = new Set(keyWords(userText));
    const answerTokens = keyWords(answer);
    const uniqueAnswerTokens = new Set(answerTokens);
    const hits = answerTokens.filter(w => userTokens.has(w)).length;
    coverage = answerTokens.length ? Math.round(hits / uniqueAnswerTokens.size * 100) : 0;

    userHTML   = highlightTokens(userText,  uniqueAnswerTokens, "tdef-hit");
    answerHTML = highlightTokens(answer,    userTokens,         "tdef-hit", uniqueAnswerTokens);
  }

  return `
    <div class="type-card tdef-card">
      <div class="type-q">${NL?"Begrip":"Term"} →  ${NL?"Definitie":"Definition"}</div>
      <div class="tdef-term">${term}</div>

      ${ fb ? `
        <div class="tdef-grade-help">${NL?"Hoe deed je dat? Wees eerlijk ☆":"How did you do? Be honest ☆"}</div>
        <div class="tdef-cmp">
          <div class="tdef-side">
            <div class="tdef-side-label">${NL?"Jouw antwoord":"Your answer"}</div>
            <div class="tdef-side-text ${userHTML.trim()?"":"empty"}">${userHTML || (NL?"(leeg)":"(empty)")}</div>
          </div>
          <div class="tdef-side">
            <div class="tdef-side-label">${NL?"Officiële definitie":"Official definition"}</div>
            <div class="tdef-side-text canon">${answerHTML}</div>
          </div>
        </div>
        <div class="tdef-meter">
          <div class="tdef-meter-bar"><div class="tdef-meter-fill" style="width:${coverage}%"></div></div>
          <div class="tdef-meter-txt">${coverage}% ${NL?"sleutelwoorden geraakt":"keywords matched"}</div>
        </div>
        <div class="tdef-rate">
          <button class="tdef-btn good"  onclick="rateTypeDef('got')">✓ ${NL?"Ik had het":"Got it"}</button>
          <button class="tdef-btn close" onclick="rateTypeDef('close')">~ ${NL?"Bijna":"Close"}</button>
          <button class="tdef-btn miss"  onclick="rateTypeDef('miss')">✗ ${NL?"Mis":"Missed it"}</button>
        </div>
      ` : `
        <textarea id="tdefInput" class="tdef-input" placeholder="${NL?'Schrijf hier de definitie in je eigen woorden… (ctrl+enter = controleer)':'Write the definition in your own words… (ctrl+enter = check)'}" rows="5" autocomplete="off" autocorrect="off" autocapitalize="sentences"></textarea>
        <div class="type-actions">
          <button class="btn btn-primary" onclick="checkTypeDefAnswer()">✓ ${L().check}</button>
          <button class="btn btn-ghost"   onclick="skipTypeDef()">${L().skip}</button>
        </div>
      `}
    </div>
  `;
}

/* Word-boundary highlight: wrap every token from `target` in <mark class>
   when it appears in `text`. Optionally requireSet limits which tokens count.
   Diacritics-insensitive via normalize(). */
function highlightTokens(text, targetSet, cls, requireSet){
  if(!text) return "";
  // We do a token walk: split text on whitespace+punctuation but keep the original glyphs
  // for display. For matching we normalize the cleaned token.
  const parts = text.split(/(\s+|[.,;:!?()"'‘’“”—–…]+)/);
  return parts.map(piece => {
    if(/^\s+$/.test(piece) || /^[.,;:!?()"'‘’“”—–…]+$/.test(piece)){
      return piece;
    }
    const norm = normalize(piece);
    if(!norm) return piece;
    const isMatch = targetSet.has(norm);
    const required = requireSet ? requireSet.has(norm) : true;
    if(isMatch && required){
      return `<mark class="${cls}">${piece}</mark>`;
    }
    // For the canonical side, also show missed keywords (in requireSet but not matched)
    if(requireSet && requireSet.has(norm) && !isMatch){
      return `<mark class="tdef-miss-kw">${piece}</mark>`;
    }
    return piece;
  }).join("");
}

function checkTypeDefAnswer(){
  const ti = document.getElementById("tdefInput");
  const user = ti ? ti.value.trim() : "";
  // We DON'T set a numeric score — she'll grade herself.
  state.feedback = { user, kind: "typedef" };
  AudioEngine.tap && AudioEngine.tap();
  render();
}
function skipTypeDef(){
  AudioEngine.click();
  state.feedback = { user: "", kind: "typedef" };
  render();
}
function rateTypeDef(rating){
  // rating: 'got' | 'close' | 'miss'
  if(rating === "got"){ AudioEngine.correct && AudioEngine.correct(); }
  else if(rating === "close"){ AudioEngine.almost && AudioEngine.almost(); }
  else { AudioEngine.wrong && AudioEngine.wrong(); }

  const ok = (rating === "got");
  recordCurrentCardResult(ok);
  state.correct += ok ? 1 : 0;
  state.wrong   += ok ? 0 : 1;
  state.idx++;
  state.feedback = null;
  if(state.idx >= state.deck.length){
    finishSession();
    state.view = "done";
  }
  render();
}

/* ----- QUIZ ----- */

/*
  Pick distractors that are PLAUSIBLE — share vocabulary with the correct
  answer — so the right one isn't visually obvious. Strategy:
    1) Score every other definition by keyword overlap with the correct one.
    2) Take the top ~8 most similar (similar enough to be tempting), drop any
       identical-text duplicates.
    3) Randomly choose 3 of those — so the quiz doesn't show the same trio
       every time you see this card.
    4) If somehow there are <3 similar candidates, fill from random.
*/
function defSimilarity(a, b){
  const A = new Set(keyWords(a));
  const B = new Set(keyWords(b));
  if(A.size === 0 || B.size === 0) return 0;
  let hit = 0;
  A.forEach(w => { if(B.has(w)) hit++; });
  // Symmetric overlap ratio — biased toward the smaller set
  return hit / Math.min(A.size, B.size);
}

function buildQuizOptions(){
  const c = currentCard();
  const correctDef = c.d[state.lang];

  // 1) Prefer hand-crafted plausible distractors when the card has them
  if(c.dist && c.dist[state.lang] && c.dist[state.lang].length >= 3){
    const fakes = shuffle(c.dist[state.lang].slice()).slice(0, 3);
    return shuffle([correctDef, ...fakes]);
  }

  // 2) Otherwise fall back to keyword-overlap similarity from same topic
  const others = DATA[state.topic].terms
    .filter((x,i) => i !== c._i)
    .map(x => ({ def: x.d[state.lang] }))
    .filter(x => x.def && x.def !== correctDef);

  // Score by similarity to the correct answer
  others.forEach(x => { x.score = defSimilarity(correctDef, x.def); });
  others.sort((a,b) => b.score - a.score);

  // Top-K most similar (but not identical-by-text)
  const topK = Math.min(8, others.length);
  let pool = others.slice(0, topK);
  // If everything's near-zero similarity, just fall back to the whole list
  if(pool.length === 0 || pool[0].score === 0) pool = others;

  const picked = shuffle(pool).slice(0, 3).map(x => x.def);

  // Fill if we somehow didn't get 3
  if(picked.length < 3){
    const remaining = shuffle(others).map(x => x.def).filter(d => !picked.includes(d));
    while(picked.length < 3 && remaining.length){ picked.push(remaining.shift()); }
  }

  return shuffle([correctDef, ...picked]);
}

function viewQuiz(){
  const c = currentCard();
  if(!state.quizOptions || state.quizForIdx !== state.idx){
    state.quizOptions = buildQuizOptions();
    state.quizForIdx = state.idx;
    state.quizAnswered = null;
    state.quizCorrectIdx = state.quizOptions.findIndex(opt => opt === c.d[state.lang]);
  }
  const correctIdx = state.quizCorrectIdx;
  return `
    <div class="quiz-card">
      <div class="type-q">${L().promptLabel2}</div>
      <div class="type-prompt">${c.t[state.lang]}</div>
      ${ state.quizOptions.map((opt,i)=>{
        let cls = "quiz-opt";
        if(state.quizAnswered !== null){
          if(i === correctIdx) cls += " correct";
          else if(i === state.quizAnswered) cls += " wrong";
          cls += " disabled";
        }
        // Pass correctness directly so click handler doesn't depend on state arrays
        return `<button class="${cls}" onclick="answerQuiz(${i}, ${correctIdx})">${opt}</button>`;
      }).join("") }
      ${ state.quizAnswered !== null ? `
        <button class="btn btn-primary" style="margin-top:8px;width:100%;" onclick="quizNext()">${L().next} →</button>
      `:''}
    </div>
  `;
}

function answerQuiz(i, correctIdx){
  try{
    if(state.quizAnswered !== null) return;
    state.quizAnswered = i;
    const correct = (i === correctIdx);
    state.lastQuizRight = correct;
    if(correct){ confetti(); AudioEngine.correct(); }
    else { AudioEngine.wrong(); }
    render();
  }catch(e){
    console.error("answerQuiz error:", e);
  }
}

function quizNext(){
  // Reset the per-question state BEFORE incrementing idx, so viewQuiz
  // unambiguously sees a fresh state and rebuilds options.
  const wasRight = !!state.lastQuizRight;
  state.quizOptions = null;
  state.quizAnswered = null;
  state.quizForIdx = undefined;
  state.quizCorrectIdx = undefined;
  state.lastQuizRight = null;
  nextCard(wasRight);
}

/* ----- MATCH game -----
   Pair terms with their definitions. 4 pairs visible at once. Timed.
   "Cards" in state.deck are the pairs in this session. After all matched → done.
*/

function startMatch(){
  // Pull next 4 cards from deck for this round
  const round = state.deck.slice(state.idx, state.idx + 4);
  state.matchRound = round;
  state.matchBoard = shuffle([
    ...round.map(c => ({type:"t", pairId:c._i, text:c.t[state.lang]})),
    ...round.map(c => ({type:"d", pairId:c._i, text:shortDef(c.d[state.lang])}))
  ]);
  state.matchSelected = null;
  state.matchLockedPairs = new Set();
  state.matchWrongPair = null;
  if(!state.matchStart) state.matchStart = Date.now();
}

function shortDef(s){
  // Strip HTML tags (some defs include <br>) and trim long definitions
  const plain = String(s).replace(/<br\s*\/?>/gi, " · ").replace(/<[^>]+>/g, "");
  if(plain.length > 110) return plain.slice(0, 105).replace(/\s+\S*$/,"") + "…";
  return plain;
}

function viewMatchWrap(){
  const t = DATA[state.topic];
  const total = state.deck.length;
  const done = state.idx;
  const pct = Math.round((done/total)*100);

  if(!state.matchBoard) startMatch();

  // HUD with timer
  const elapsedSec = state.matchStart ? Math.floor((Date.now() - state.matchStart)/1000) : 0;
  const mm = String(Math.floor(elapsedSec/60)).padStart(2,"0");
  const ss = String(elapsedSec%60).padStart(2,"0");

  const NL = state.lang === "nl";
  const best = bestMatchTime(state.topic);
  const bestStr = best ? `${String(Math.floor(best/60)).padStart(2,"0")}:${String(best%60).padStart(2,"0")}` : "—";

  const board = state.matchBoard.map((card, i) => {
    const matched = state.matchLockedPairs.has(card.pairId);
    const selected = state.matchSelected === i;
    const wrong = state.matchWrongPair && state.matchWrongPair.includes(i);
    let cls = "match-card " + (card.type==="t" ? "term" : "def");
    if(matched) cls += " gone";
    if(selected) cls += " selected";
    if(wrong) cls += " wrong";
    return `<button class="${cls}" onclick="matchTap(${i})">${card.text}</button>`;
  }).join("");

  return `
    <div class="top-bar">
      <button class="back" onclick="backToMode()">← ${L().back}</button>
      <div class="topic-title">${t.icon} ${t.label[state.lang]} 🧩</div>
      <div class="stats">
        <span class="pill good">✓ ${state.correct}</span>
        <span class="pill bad">✗ ${state.wrong}</span>
        <span class="pill">${done}/${total}</span>
      </div>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="match-hud">
      <div>
        <div class="lb">${NL?"Tijd":"Time"}</div>
        <div class="tm" id="matchTimer">${mm}:${ss}</div>
      </div>
      <div style="text-align:center;">
        <div class="lb">${NL?"Foutjes":"Misses"}</div>
        <div class="tm" style="color:#ef4444;">${state.wrong||0}</div>
      </div>
      <div style="text-align:right;">
        <div class="lb">${NL?"Beste":"Best"}</div>
        <div class="tm" style="color:#10b981;font-size:1rem;">${bestStr}</div>
      </div>
    </div>
    <div class="match-board">${board}</div>
    <div style="text-align:center;font-size:.78rem;color:#6b5b95;font-weight:700;">
      ${NL?"Tik een geel begrip en daarna de bijbehorende paarse definitie":"Tap a yellow term, then its matching purple definition"}
    </div>
  `;
}

function matchTap(i){
  if(!state.matchBoard) return;
  const card = state.matchBoard[i];
  if(state.matchLockedPairs.has(card.pairId)) return;
  if(state.matchWrongPair) return; // wait for shake to finish
  if(state.matchSelected === null){
    state.matchSelected = i;
    AudioEngine.tap();
    render();
    return;
  }
  if(state.matchSelected === i){
    // Deselect
    state.matchSelected = null;
    AudioEngine.click();
    render();
    return;
  }
  const prev = state.matchBoard[state.matchSelected];
  const isPair = prev.pairId === card.pairId && prev.type !== card.type;
  if(isPair){
    AudioEngine.correct();
    state.matchLockedPairs.add(card.pairId);
    recordCard(state.topic, card.pairId, true);
    state.correct = (state.correct||0) + 1;
    state.matchSelected = null;
    // If all 4 pairs in this round done, advance
    if(state.matchLockedPairs.size === state.matchRound.length){
      state.idx += state.matchRound.length;
      state.matchBoard = null;
      state.matchLockedPairs = new Set();
      if(state.idx >= state.deck.length){
        finishMatch();
        return;
      }
    }
    render();
  } else {
    AudioEngine.wrong();
    state.matchWrongPair = [state.matchSelected, i];
    // Record mismatch as a wrong for both involved cards
    recordCard(state.topic, prev.pairId, false);
    recordCard(state.topic, card.pairId, false);
    state.wrong = (state.wrong||0) + 1;
    render();
    setTimeout(()=>{
      state.matchWrongPair = null;
      state.matchSelected = null;
      render();
    }, 450);
  }
}

function finishMatch(){
  if(state.sessionFinished) return;
  const elapsedSec = Math.floor((Date.now() - state.matchStart)/1000);
  state.matchElapsed = elapsedSec;
  state.matchPenalty = state.wrong || 0;
  // Save best time per topic (with penalty)
  saveMatchBest(state.topic, elapsedSec + state.matchPenalty*5);
  state.bestStreak = state.matchRound ? state.matchRound.length : 0;
  finishSessionMatch();
  state.view = "done";
  render();
}

function finishSessionMatch(){
  state.sessionFinished = true;
  recordSession({
    topic: state.topic,
    mode: "match",
    correct: state.correct||0,
    wrong: state.wrong||0,
    total: (state.correct||0)+(state.wrong||0),
    bestStreak: state.bestStreak || 0,
    timeSec: state.matchElapsed
  });
}

function bestMatchTime(topicKey){
  try{
    const v = localStorage.getItem("mk_match_best_"+topicKey);
    return v ? parseInt(v,10) : null;
  }catch(e){ return null; }
}
function saveMatchBest(topicKey, timeWithPenalty){
  const cur = bestMatchTime(topicKey);
  if(cur === null || timeWithPenalty < cur){
    localStorage.setItem("mk_match_best_"+topicKey, String(timeWithPenalty));
    state.matchNewBest = true;
  }
}

// Timer tick: re-render only the timer to avoid disturbing taps
setInterval(()=>{
  if(state.view === "study" && state.mode === "match" && state.matchStart && !state.sessionFinished){
    const el = document.getElementById("matchTimer");
    if(el){
      const s = Math.floor((Date.now()-state.matchStart)/1000);
      const mm = String(Math.floor(s/60)).padStart(2,"0");
      const ss = String(s%60).padStart(2,"0");
      el.textContent = mm+":"+ss;
    }
  }
}, 500);

/* ----- DONE ----- */

function viewDone(){
  const NL = state.lang === "nl";
  if(state.mode === "match"){
    const elapsed = state.matchElapsed || 0;
    const mm = String(Math.floor(elapsed/60)).padStart(2,"0");
    const ss = String(elapsed%60).padStart(2,"0");
    const penalty = state.matchPenalty || 0;
    confetti(50);
    return `
      <div class="done">
        <div style="font-size:3rem;">${state.matchNewBest ? "🏆" : "🧩"}</div>
        <h2>${state.matchNewBest ? (NL?"Nieuw record!":"New record!") : (NL?"Ronde compleet!":"Round complete!")}</h2>
        <div class="score-num">${mm}:${ss}</div>
        <div style="margin:6px 0 18px;color:#6b5b95;font-weight:700;">
          ${state.deck.length} ${NL?"paren":"pairs"} · ${penalty} ${NL?"foutjes":"misses"}
        </div>
        <div style="margin-bottom:18px;font-size:.85rem;color:#6b5b95;">
          ${NL?"Je beste tijd voor dit onderwerp:":"Your best time for this topic:"} <b>${(()=>{const b=bestMatchTime(state.topic); if(!b) return "—"; return String(Math.floor(b/60)).padStart(2,"0")+":"+String(b%60).padStart(2,"0");})()}</b>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
          <button class="btn btn-primary" onclick="startMode('match')">🔁 ${L().playAgain}</button>
          <button class="btn btn-ghost" onclick="backToMode()">${L().back}</button>
        </div>
      </div>
    `;
  }
  const total = state.correct + state.wrong;
  const pct = total ? Math.round((state.correct/total)*100) : 0;
  let emoji = "🥳", msg = "";
  if(pct >= 90){ emoji = "🏆"; msg = NL?"WOW! Examen-klaar!":"WOW! Exam-ready!"; }
  else if(pct >= 70){ emoji = "🚀"; msg = NL?"Lekker bezig — bijna daar!":"Great going — almost there!"; }
  else if(pct >= 50){ emoji = "💪"; msg = NL?"Goed begin — nog een rondje!":"Solid start — one more round!"; }
  else { emoji = "📚"; msg = NL?"Nog even oefenen. Probeer flashcards eerst!":"Practise some more. Try flashcards first!"; }
  if(pct >= 70) confetti(40);
  return `
    <div class="done ${pct >= 70 ? 'done-success' : ''}">
      <div style="font-size:3rem;">${emoji}</div>
      <h2>${L().sessionDone}</h2>
      <div class="score-num">${pct}%</div>
      <div style="margin:6px 0 18px;color:#6b5b95;font-weight:700;">
        ${state.correct} ${L().correctCount} · ${state.wrong} ${L().wrongCount} ${L().of} ${state.correct+state.wrong}
      </div>
      <div style="margin-bottom:18px">${msg}</div>
      <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="startMode('${state.mode}')">🔁 ${L().playAgain}</button>
        <button class="btn btn-ghost" onclick="backToMode()">${L().back}</button>
      </div>
    </div>
  `;
}

/* ----- Confetti ----- */

function confetti(n=18){
  const colors = ["#ec4899","#7c3aed","#10b981","#f59e0b","#3b82f6","#ef4444"];
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className = "confetti";
    el.style.left = (Math.random()*100)+"vw";
    el.style.background = colors[Math.floor(Math.random()*colors.length)];
    el.style.animationDuration = (1.4 + Math.random()*1.2)+"s";
    el.style.animationDelay = (Math.random()*.3)+"s";
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 3000);
  }
}

/* ----- RENDER ----- */

function render(){
  const el = document.getElementById("app");
  if(state.view === "home"){
    el.innerHTML = viewHome();
    setTimeout(() => { loadWeather(); loadGuestbook(); }, 0);
  }
  else if(state.view === "stats") el.innerHTML = viewStats();
  else if(state.view === "praktijk") {
    el.innerHTML = viewPraktijk();
    // Re-inject cached images + fetch any new ones every time praktijk renders
    setTimeout(loadPraktijkImages, 0);
  }
  else if(state.view === "tijdlijnen") el.innerHTML = viewTijdlijnen();
  else if(state.view === "tlPractice") el.innerHTML = viewTlPractice();
  else if(state.view === "mode")  el.innerHTML = viewMode();
  else if(state.view === "wordlist") el.innerHTML = viewWordlist();
  else if(state.view === "study") el.innerHTML = viewStudy();
  else if(state.view === "done")  el.innerHTML = viewDone();

  // Focus type input
  if(state.view === "study" && state.mode === "type" && !state.feedback){
    setTimeout(()=>{ const ti = document.getElementById("typeInput"); ti && ti.focus(); }, 60);
  }
  if(state.view === "study" && state.mode === "typedef" && !state.feedback){
    setTimeout(()=>{ const ti = document.getElementById("tdefInput"); ti && ti.focus(); }, 60);
  }
}

document.addEventListener("keydown", e=>{
  if(state.view !== "study") return;
  if(state.mode === "flash"){
    if(e.code === "Space" || e.code === "Enter"){ e.preventDefault(); flipCard(); }
    if(e.code === "ArrowRight"){ nextCard(true); }
    if(e.code === "ArrowLeft"){ nextCard(false); }
  }
  if(state.mode === "type"){
    if(e.ctrlKey && e.code === "Enter" && !state.feedback){ e.preventDefault(); checkTypeAnswer(); }
    if(state.feedback && e.code === "Enter"){ e.preventDefault(); nextAfterType(); }
  }
  if(state.mode === "typedef"){
    if(e.ctrlKey && e.code === "Enter" && !state.feedback){ e.preventDefault(); checkTypeDefAnswer(); }
  }
});

setLang(state.lang);
restoreAudioPrefs();
render();

/* ════════════════════════════════════════════
   Silent visit ping — hits a free anonymous counter so
   mom can peek at activity from the mum-only.html page.
   Debounced to one ping per 30 min per browser.
   ════════════════════════════════════════════ */
(function visitPing(){
  try{
    const PING_KEY = "mk_last_ping_v1";
    const NS = "maisie-study-2026"; // namespace on abacus.jasoncameron.dev
    const now = Date.now();
    const last = parseInt(localStorage.getItem(PING_KEY) || "0", 10);
    if(now - last < 30 * 60 * 1000) return; // already counted recently
    localStorage.setItem(PING_KEY, String(now));
    const d = new Date();
    const ymd = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const fire = (key) => {
      const url = "https://abacus.jasoncameron.dev/hit/" + NS + "/" + encodeURIComponent(key);
      // Use a sendBeacon-style fetch — fire-and-forget, doesn't block anything.
      fetch(url, { mode: "cors", cache: "no-store", keepalive: true }).catch(()=>{});
    };
    fire("total");
    fire("d-" + ymd);
  }catch(e){ /* silent */ }
})();

/* ════════════════════════════════════════════
   If a stickers.png file exists alongside this
   HTML, swap every badge icon over to crops of
   that real sticker sheet. Otherwise the inline
   SVG fallbacks stay (so the page is never blank).
   ════════════════════════════════════════════ */
(function detectStickerSheet(){
  const probe = new Image();
  probe.onload = () => {
    document.body.classList.add("uses-sheet");
  };
  probe.onerror = () => { /* fall back to SVG defaults */ };
  probe.src = "stickers.png?_=" + Date.now();
})();

/* ════════════════════════════════════════════
     ✦  Tiny sparkle trail (typographic, no emoji)  ✦
   ════════════════════════════════════════════ */
(function(){
  if(window.matchMedia && window.matchMedia('(hover: none)').matches) return;

  const SPARKLES = ["✦","✧","·","✶","❅"];
  const COLORS = ["#7a9270","#a89065","#8a4a3a","#c4ad7e","#5d7556"];
  let lastTime = 0;
  let lastX = 0, lastY = 0;

  document.addEventListener("pointermove", (e) => {
    const now = Date.now();
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    if(now - lastTime < 55 || dist < 8) return;
    lastTime = now;
    lastX = e.clientX; lastY = e.clientY;

    const s = document.createElement("span");
    s.textContent = SPARKLES[Math.floor(Math.random() * SPARKLES.length)];
    s.style.cssText = `
      position: fixed;
      left: ${e.clientX}px;
      top: ${e.clientY}px;
      pointer-events: none;
      color: ${COLORS[Math.floor(Math.random() * COLORS.length)]};
      font-size: ${10 + Math.random()*10}px;
      z-index: 9999;
      user-select: none;
      animation: sparkleFade 800ms ease-out forwards;
      text-shadow: 0 0 4px #fff;
      transform: translate(-50%, -50%) rotate(${Math.random()*60-30}deg);
    `;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 850);
  }, { passive: true });

  // Inject the keyframes once
  const style = document.createElement("style");
  style.textContent = `
    @keyframes sparkleFade{
      0%   { opacity: 0;   transform: translate(-50%, -50%) scale(.4) rotate(0deg); }
      30%  { opacity: 1;   transform: translate(-50%, -50%) scale(1) rotate(15deg); }
      100% { opacity: 0;   transform: translate(-50%, calc(-50% - 24px)) scale(.5) rotate(45deg); }
    }
  `;
  document.head.appendChild(style);
})();

/* tiny hidden corner-dot — opens mum-only.html. shhh. */
(function momDot(){
  const a = document.createElement("a");
  a.href = "mum-only.html";
  a.target = "_blank";
  a.rel = "noopener";
  a.setAttribute("aria-hidden", "true");
  a.tabIndex = -1;
  a.style.cssText = [
    "position:fixed",
    "right:5px",
    "bottom:5px",
    "width:14px",
    "height:14px",
    "display:flex",
    "align-items:center",
    "justify-content:center",
    "font-family:'Pixelify Sans',monospace",
    "font-size:14px",
    "line-height:1",
    "color:rgba(58,42,24,0.14)",
    "text-decoration:none",
    "z-index:9999",
    "transition:color .25s",
    "cursor:default"
  ].join(";");
  a.textContent = "·";
  // a touch more visible on hover so mom can find it once she knows where to look
  a.addEventListener("mouseenter", () => { a.style.color = "rgba(58,42,24,0.55)"; });
  a.addEventListener("mouseleave", () => { a.style.color = "rgba(58,42,24,0.14)"; });
  document.body.appendChild(a);
})();
</script>
