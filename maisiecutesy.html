<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>maisie — een studieboekje</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%23f5ebd5'/%3E%3Ctext x='50' y='66' font-family='Garamond, serif' font-style='italic' font-size='60' fill='%236b5340' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Yellowtail&family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" />
<style>
  /* ────────────────────────────────────────────
     Studieboekje — a quiet personal-site theme.
     One serif (EB Garamond). Warm cream paper.
     A single soft oxblood accent. Hair-line rules.
     No emoji, no glitter — just type.
     ──────────────────────────────────────────── */
  :root{
    --bg: #f5ebd5;
    --bg-deep: #ead9b8;
    --paper: #fbf4e2;
    --paper-soft: #f7ecd0;
    --ink: #3b2a18;
    --ink-soft: #6e5a40;
    --ink-mute: #a5917a;
    --rule: #c8b48f;
    --rule-soft: #ddc9a5;
    --accent: #8a3a3a;
    --accent-soft: #c97a76;
    --good: #4f6b4a;
    --bad:  #8a3a3a;
    --warn: #a37428;
    --pol: #8a3a3a;
    --cri: #3f5876;
    --med: #6b4a7a;
    --ana: #4f6b4a;
  }

  /* Hide every decorative emoji that lives in the data/JS. */
  .topic .emoji, .mode-btn .ico, .prk-card .prk-emoji,
  .countdown .big, .maisie-inline .mq-mark,
  .done > div:first-child, .prk-entry-hd .ico { /* leave these alone where they read as labels */}

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0;
    font-family: "EB Garamond", "Iowan Old Style", "Garamond", Georgia, "Times New Roman", serif;
    color: var(--ink);
    font-size: 16px;
    line-height: 1.55;
    font-feature-settings: "liga", "kern", "onum" 1;
  }
  body{
    min-height: 100vh;
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at top, var(--paper) 0%, transparent 60%),
      radial-gradient(ellipse at bottom, var(--bg-deep) 0%, transparent 60%);
    background-attachment: fixed;
    padding: 36px 22px 96px;
  }
  .wrap{ position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }
  /* Quiet ornamental divider helper — used between sections */
  .orn{
    text-align:center;
    color: var(--ink-mute);
    letter-spacing: .8em;
    font-size: .85rem;
    margin: 18px 0 12px;
    font-style: italic;
  }
  .orn::before{ content: "❦"; }
  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom: 28px; flex-wrap:wrap; gap: 14px;
  }
  .title{
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.7rem;
    font-weight: 500;
    font-style: italic;
    color: var(--ink);
    line-height: 1.1;
    letter-spacing: .005em;
    padding: 0;
  }
  .sub{
    font-size: .82rem;
    color: var(--ink-soft);
    margin-top: 4px;
    font-style: italic;
    letter-spacing: .04em;
  }
  .lang{
    display:inline-flex; background: transparent;
    border-bottom: 1px solid var(--rule);
    padding: 0; gap: 4px;
    font-size: .85rem;
  }
  .lang button{
    border:0; background:transparent;
    padding: 4px 8px;
    color: var(--ink-mute);
    font-family: inherit; font-size: .9rem;
    font-style: italic;
  }
  .lang button.on{
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 4px;
  }
  .countdown{
    background: transparent;
    border: 0;
    border-top: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
    padding: 14px 0;
    margin-bottom: 22px;
    display: flex; justify-content: space-between; align-items: flex-start;
    box-shadow: none;
    font-size: .9rem;
    color: var(--ink-soft);
    font-style: italic;
  }
  .countdown .big{
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.6rem; color: var(--ink); font-weight: 500; line-height: 1;
    font-style: normal;
    margin-top: 2px;
  }
  .grid{ display:grid; grid-template-columns: 1fr; gap: 0; }
  /* Topic entries read like diary-index rows, separated by a hair-line rule */
  .topic{
    border: 0;
    border-bottom: 1px solid var(--rule);
    background: transparent;
    padding: 16px 4px 14px;
    color: var(--ink);
    box-shadow: none;
    border-radius: 0;
    display: flex; flex-direction: column;
    position: relative;
    transition: background .12s;
    min-height: 0;
  }
  .topic:first-child{ border-top: 1px solid var(--rule); }
  .topic:hover{ background: rgba(255,255,255,.35); }
  .topic .emoji{ display: none; }
  .topic h2{
    font-family: "EB Garamond", Georgia, serif;
    font-style: italic;
    margin: 0 0 4px;
    font-size: 1.25rem;
    font-weight: 500;
    color: var(--ink);
    line-height: 1.2;
  }
  .topic p{
    margin: 0;
    font-size: .92rem;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .topic.pol h2 small, .topic.cri h2 small, .topic.med h2 small, .topic.ana h2 small{
    color: var(--ink-mute); font-style: normal; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; margin-right: 8px;
  }
  /* Special "Practical Examples" home card */
  .prk-card{
    grid-column:1 / -1;
    background: linear-gradient(135deg, var(--pink-soft), var(--butter), var(--lilac-soft));
    border: 2px dashed var(--pink-deep);
    border-radius:22px; padding:18px; color: var(--ink);
    box-shadow: 5px 5px 0 var(--pink);
    display:flex; align-items:center; gap:14px;
    position:relative; overflow:visible;
    transition: transform .15s, box-shadow .15s;
    font-family: "Patrick Hand", cursive;
  }
  .prk-card::after{
    content: "✿"; position: absolute; top: -18px; right: 20px;
    font-size: 2rem; color: var(--pink-deep);
    transform: rotate(15deg);
  }
  .prk-card:active{transform:translate(2px,2px); box-shadow: 2px 2px 0 var(--pink);}
  .prk-card::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.18),transparent 50%);
    pointer-events:none;
  }
  .prk-card .prk-emoji{font-size:2.8rem;line-height:1;flex:0 0 auto; filter: drop-shadow(2px 2px 0 #fff);}
  .prk-card .prk-info h2{
    font-family: "Caveat", cursive;
    margin:0 0 4px; font-size: 1.5rem; font-weight:700; color: var(--pink-deep);
  }
  .prk-card .prk-info p{ margin:0; font-size:.95rem; color: var(--ink); }
  .prk-card .prk-arrow{margin-left:auto;font-size:1.6rem;color: var(--pink-deep);}

  /* Practical Examples reading page */
  .prk-page h1{margin:6px 0 4px;font-size:1.4rem;}
  .prk-page .intro{
    background:#fff;border-radius:16px;padding:14px;margin-bottom:14px;
    box-shadow:0 6px 16px rgba(0,0,0,.08);font-size:.88rem;line-height:1.45;
  }
  .prk-entry{
    background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;
    box-shadow:0 8px 22px rgba(0,0,0,.1);
    overflow:hidden;
  }
  .prk-entry-hd{
    display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;
  }
  .prk-entry-hd .ico{
    font-size:2rem;line-height:1;flex:0 0 auto;
    background:linear-gradient(135deg,#fef3c7,#fbcfe8);
    width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  }
  .prk-entry-hd h2{margin:0 0 3px;font-size:1.05rem;line-height:1.25;}
  .prk-entry-hd .chip{
    display:inline-block;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
    padding:3px 8px;border-radius:999px;background:#ede9fe;color:#6d28d9;
  }
  .prk-img-wrap{
    margin:0 auto 12px !important;
    background:linear-gradient(135deg,#f8fafc,#f1f5f9) !important;
    min-height:120px !important;
    max-height:none !important;
    padding:8px !important;border-radius:14px !important;
    display:flex !important;align-items:center !important;justify-content:center !important;overflow:visible !important;
    position:relative;text-decoration:none;color:inherit;cursor:pointer;
  }
  .prk-img-wrap:hover .prk-img-placeholder{opacity:.7;}
  .prk-img-wrap img{
    max-width:100% !important;max-height:180px !important;
    width:auto !important;height:auto !important;
    object-fit:contain !important;display:block !important;border-radius:10px !important;
  }
  .prk-img-placeholder{
    font-size:3rem;color:#94a3b8;
    padding:32px;
  }
  .prk-img-credit{
    position:absolute;bottom:4px;right:8px;
    background:rgba(0,0,0,.55);color:#fff;font-size:.62rem;padding:2px 6px;border-radius:6px;
    text-decoration:none;
  }
  .prk-quads{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  @media(max-width:380px){.prk-quads{grid-template-columns:1fr;}}
  .prk-quad{
    background:linear-gradient(135deg,#faf5ff,#fdf4ff);
    border-left:4px solid #a855f7;
    border-radius:10px;padding:10px 12px;
  }
  .prk-quad.nl{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-left-color:#3b82f6;}
  .prk-quad.us{background:linear-gradient(135deg,#fef2f2,#fee2e2);border-left-color:#ef4444;}
  .prk-quad .ttl{
    font-size:.7rem;font-weight:900;text-transform:uppercase;letter-spacing:.5px;
    color:#475569;margin-bottom:4px;display:flex;align-items:center;gap:4px;
  }
  .prk-quad .ttl .yr{background:rgba(0,0,0,.08);padding:1px 6px;border-radius:6px;font-size:.6rem;}
  .prk-quad .txt{font-size:.85rem;line-height:1.4;color:#1f1147;}
  .topic .count{
    position: absolute; top: 16px; right: 4px;
    background: transparent; color: var(--ink-mute);
    border: 0; padding: 0; border-radius: 0;
    font-size: .72rem; font-style: italic;
    letter-spacing: .04em;
  }
  .topic .count::before{ content: "— "; }
  .topic .status{
    position: absolute; top: 14px; right: 0;
    background: transparent;
    color: var(--ink-mute);
    padding: 0; border-radius: 0;
    font-weight: 400; font-size: .72rem;
    display: inline-flex; align-items: baseline; gap: 6px;
    font-style: italic; letter-spacing: .04em;
    box-shadow: none;
  }
  .topic .status span:first-child{ display: none; } /* drop emoji ico */
  .topic .status .grade{
    font-size: 1rem; font-style: normal; font-weight: 500;
    color: var(--ink);
    font-family: "EB Garamond", Georgia, serif;
  }
  .topic .status.st-pass    .grade{ color: var(--good); }
  .topic .status.st-almost  .grade{ color: var(--warn); }
  .topic .status.st-low     .grade{ color: var(--accent); }
  .topic .status.st-start   .grade{ color: var(--ink-soft); }
  .topic .status.st-none    { color: var(--ink-mute); }
  .modes{
    background: transparent;
    border: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule);
    border-radius: 0; padding: 18px 0; margin-top: 18px;
    box-shadow: none;
  }
  .modes h3{
    margin: 0 0 14px;
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.05rem; font-weight: 500; font-style: italic;
    color: var(--ink-soft);
    text-align: left;
    letter-spacing: .01em;
  }
  .mode-row{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .mode-btn{
    border: 1px solid var(--rule);
    border-radius: 4px; padding: 10px 6px;
    font-family: inherit; font-weight: 500; color: var(--ink);
    font-size: .88rem; background: var(--paper-soft);
    box-shadow: none;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-style: italic;
    transition: background .12s, border-color .12s;
  }
  .mode-btn:hover{ background: var(--paper); border-color: var(--accent-soft); color: var(--accent); }
  .mode-btn:active{ background: var(--bg-deep); }
  .mode-btn .ico{ display: none; }
  .mode-flash, .mode-type, .mode-quiz, .mode-match{ background: var(--paper-soft); }

  .back{
    border: 0; background: transparent; border-radius: 0;
    padding: 4px 0;
    font-family: inherit; font-weight: 400;
    box-shadow: none;
    font-size: .85rem; color: var(--ink-soft);
    font-style: italic;
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: underline;
    text-decoration-color: var(--rule);
    text-underline-offset: 3px;
  }
  .back:hover{ color: var(--accent); text-decoration-color: var(--accent); }
  .top-bar{ display:flex; justify-content:space-between; align-items: baseline; margin-bottom: 18px; gap:8px; flex-wrap:wrap; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .topic-title{
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.2rem; font-weight: 500; font-style: italic; color: var(--ink);
    text-shadow: none;
  }
  .progress{
    height: 2px;
    background: var(--rule-soft);
    border: 0; border-radius: 0; overflow: hidden;
    margin-bottom: 18px;
    box-shadow: none;
  }
  .progress > div{
    height: 100%;
    background: var(--accent);
    transition: width .3s ease;
  }

  /* Flashcard */
  .flash{
    perspective:1200px;height:460px;margin:0 auto 14px;max-width:560px;
  }
  .flash-inner{
    position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s;
  }
  .flash.flipped .flash-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius: 2px;
    background: var(--paper);
    border: 1px solid var(--rule);
    padding: 28px 26px 56px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    display: flex; flex-direction: column; justify-content: center; text-align: center;
    overflow-y: auto; word-wrap: break-word;
  }
  .flash-back{
    transform: rotateY(180deg);
    background: var(--paper);
    border-color: var(--rule);
  }
  .flash-face .term{
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.9rem; font-weight: 500; font-style: italic;
    color: var(--ink);
    word-wrap: break-word; hyphens: auto; line-height: 1.2;
  }
  .flash-face .def{
    font-family: inherit;
    font-size: 1.02rem; line-height: 1.6; color: var(--ink);
    word-wrap: break-word; hyphens: auto;
  }
  .flash-face .def.long{text-align:left;font-size:.92rem;}
  .flash-face .mnemonic{
    background:linear-gradient(135deg,#fef9c3,#fde68a);
    color:#713f12;
    padding:10px 12px;
    margin:14px auto 0;
    max-width:480px;
    border-radius:10px;
    font-size:.85rem;
    font-weight:600;
    line-height:1.4;
    text-align:left;
    border-left:4px solid #f59e0b;
    box-shadow:0 2px 6px rgba(245,158,11,.18);
  }
  .flash-face .mnemonic .ezelsbrug-label{
    display:block;font-size:.65rem;text-transform:uppercase;letter-spacing:.5px;
    color:#a16207;font-weight:800;margin-bottom:3px;
  }
  .flash-face .hint{position:absolute;bottom:10px;left:0;right:0;font-size:.72rem;color:#6b5b95;opacity:.7;}
  @media(max-width:380px){
    .flash{height:480px;}
    .flash-face{padding:18px 16px 50px;}
    .flash-face .term{font-size:1.3rem;}
    .flash-face .def{font-size:.92rem;}
    .flash-face .def.long{font-size:.82rem;}
  }
  .flash-controls{display:flex; justify-content:center; gap:8px; max-width:560px; margin:0 auto;}
  .ctrl{
    flex: 1; border: 1px solid var(--rule); background: var(--paper-soft);
    border-radius: 4px; padding: 10px;
    font-family: inherit; font-weight: 500; color: var(--ink);
    box-shadow: none;
    font-size: .92rem; font-style: italic;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    transition: background .12s, color .12s, border-color .12s;
  }
  .ctrl:hover{ background: var(--paper); }
  .ctrl.hard{ color: var(--accent); border-color: var(--accent-soft); }
  .ctrl.hard:hover{ background: var(--paper); border-color: var(--accent); }
  .ctrl.easy{ color: var(--good); border-color: #b8c7b3; }
  .ctrl.easy:hover{ background: var(--paper); border-color: var(--good); }
  .ctrl .lbl-sub{ display: none; }

  /* Type mode */
  .type-card{
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 2px; padding: 26px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04);
    max-width: 600px; margin: 0 auto 14px;
  }
  .type-q{
    font-size: .72rem; color: var(--ink-mute);
    text-transform: uppercase; letter-spacing: .18em;
    margin-bottom: 10px; font-style: italic;
  }
  .type-prompt{
    font-family: "EB Garamond", Georgia, serif;
    font-size: 1.3rem; font-weight: 500; font-style: italic;
    margin-bottom: 16px; line-height: 1.35; color: var(--ink);
  }
  .type-input{
    width: 100%; padding: 10px 12px;
    border: 0; border-bottom: 1px solid var(--rule);
    border-radius: 0;
    font-size: 1rem;
    font-family: inherit; color: var(--ink);
    background: transparent; outline: none;
    min-height: 40px; resize: vertical;
  }
  .type-input:focus{ border-bottom-color: var(--accent); }
  .type-actions{ display:flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .btn{
    border: 1px solid var(--rule); border-radius: 4px;
    padding: 8px 16px;
    font-family: inherit; font-weight: 500;
    font-size: .95rem; background: var(--paper-soft); color: var(--ink);
    box-shadow: none;
    font-style: italic;
    transition: background .12s, color .12s, border-color .12s;
  }
  .btn:hover{ background: var(--paper); border-color: var(--accent-soft); }
  .btn-primary{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-primary:hover{ background: #6e2d2d; border-color: #6e2d2d; color: #fff; }
  .btn-ghost{ background: transparent; color: var(--ink-soft); border-color: var(--rule); }
  .btn-good{ background: var(--good); color: #fff; border-color: var(--good); }
  .btn-bad{ background: var(--accent); color: #fff; border-color: var(--accent); }
  .feedback{
    margin-top: 16px; padding: 14px 16px; border-radius: 2px;
    font-size: .95rem; line-height: 1.5;
    border-left: 2px solid;
    background: var(--paper-soft);
  }
  .feedback.right{ border-color: var(--good); color: var(--good); }
  .feedback.almost{ border-color: var(--warn); color: var(--warn); }
  .feedback.wrong{ border-color: var(--accent); color: var(--accent); }
  .feedback b{ display: block; margin-bottom: 4px; font-size: 1rem; font-style: italic; }

  /* Quiz mode */
  .quiz-card{
    background: var(--paper);
    border: 3px solid var(--ink-soft);
    border-radius:22px; padding:20px;
    box-shadow: 6px 6px 0 var(--pink-soft);
    max-width:600px; margin:0 auto 14px;
    font-family: "Patrick Hand", cursive;
  }
  .quiz-opt{
    display:block; width:100%; text-align:left;
    border: 2px dashed var(--ink-soft); background: var(--paper);
    padding:12px 14px; border-radius:14px; margin-bottom:10px;
    font-size:1rem; font-family: "Patrick Hand", cursive;
    font-weight:500; color: var(--ink); transition: all .15s;
    box-shadow: 2px 2px 0 var(--ink-soft);
  }
  .quiz-opt:hover{ border-color: var(--pink); background: var(--bg2); transform: translate(-1px,-1px); box-shadow: 3px 3px 0 var(--pink); }
  .quiz-opt.correct{ background:#e7f9ec; border:2px solid #7bbf91; color:#3d7c5e; box-shadow: 2px 2px 0 #7bbf91; }
  .quiz-opt.wrong{ background:#ffe6ea; border:2px solid #cc6f7e; color:#a23a4d; box-shadow: 2px 2px 0 #cc6f7e; }
  .quiz-opt.disabled{ cursor:not-allowed; opacity:.85; }

  /* Stats */
  .stats{
    display:flex;gap:6px;font-size:.85rem;font-weight:600;
    font-family: "Patrick Hand", cursive;
  }
  .pill{
    background: var(--paper); border: 1.5px solid var(--ink-soft); border-radius:999px;
    padding:2px 10px; color: var(--ink-soft);
    box-shadow: 1px 1px 0 var(--ink-soft);
  }
  .pill.good{ color:#3d7c5e; background:#e7f9ec; border-color:#7bbf91; box-shadow: 1px 1px 0 #7bbf91; }
  .pill.bad{ color:#a23a4d; background:#ffe6ea; border-color:#cc6f7e; box-shadow: 1px 1px 0 #cc6f7e; }

  .empty{
    text-align:center; padding:40px 20px;
    background: var(--paper); border-radius:20px; border: 2px dashed var(--lilac);
    font-family: "Patrick Hand", cursive;
  }

  /* Done screen */
  .done{
    background: var(--paper);
    border: 3px solid var(--ink-soft);
    border-radius:24px; padding:30px 22px; text-align:center;
    box-shadow: 6px 6px 0 var(--pink-soft);
    max-width:560px; margin:0 auto;
    font-family: "Patrick Hand", cursive;
    position: relative;
  }
  .done::before{
    content: "🎀";
    position: absolute; top: -22px; left: 50%;
    transform: translateX(-50%) rotate(-15deg);
    font-size: 2.2rem;
  }
  .done h2{
    font-family: "Caveat", cursive;
    margin:8px 0; font-size:2.4rem; color: var(--pink-deep); font-weight:700;
  }
  .score-num{
    font-family: "Caveat", cursive;
    font-size:4rem; font-weight:700; color: var(--pink-deep); line-height:1;
    text-shadow: 2px 2px 0 var(--lilac-soft);
  }

  /* Confetti */
  .confetti{position:fixed;width:10px;height:14px;top:-20px;pointer-events:none;border-radius:2px;animation:fall linear forwards;z-index:9999;}
  @keyframes fall{
    0%{transform:translateY(0) rotate(0);opacity:1}
    100%{transform:translateY(110vh) rotate(720deg);opacity:0}
  }

  /* Audio controls */
  .audio-bar{
    display:flex;gap:6px;align-items:center;
  }
  .audio-btn{
    background: var(--paper);
    border: 2px solid var(--ink-soft);
    border-radius:999px; width:38px; height:38px;
    box-shadow: 2px 2px 0 var(--ink-soft);
    font-size:1.05rem;
    display:inline-flex; align-items:center; justify-content:center;
    transition: transform .15s, background .2s;
  }
  .audio-btn:active{ transform: translate(2px,2px); box-shadow: 0 0 0 var(--ink-soft); }
  .audio-btn.on{
    background: var(--pink); color:#fff; border-color: var(--pink-deep);
    box-shadow: 2px 2px 0 var(--pink-deep);
    animation: pulse 2.6s ease-in-out infinite;
  }
  .audio-btn.off{ opacity:.55; }
  @keyframes pulse{
    0%,100%{ box-shadow: 2px 2px 0 var(--pink-deep); }
    50%{ box-shadow: 2px 2px 0 var(--pink-deep), 0 0 12px var(--pink); }
  }
  .music-panel{
    position:fixed;top:64px;right:14px;background:#fff;border-radius:18px;
    padding:14px;box-shadow:0 18px 40px rgba(0,0,0,.2);z-index:50;
    display:none;min-width:240px;
  }
  .music-panel.open{display:block;animation:popIn .2s ease-out;}
  @keyframes popIn{
    from{opacity:0;transform:translateY(-8px) scale(.95)}
    to{opacity:1;transform:translateY(0) scale(1)}
  }
  .music-panel h4{margin:0 0 10px;font-size:.95rem;font-weight:900;color:#1f1147;}
  .music-panel label{font-size:.78rem;font-weight:700;color:#6b5b95;display:block;margin:8px 0 4px;}
  .music-panel input[type=range]{width:100%;}
  .music-panel select{
    width:100%;padding:8px 10px;border-radius:10px;border:2px solid #e9d5ff;
    background:#faf5ff;font-weight:700;color:#1f1147;
  }

  /* Session length picker */
  .len-row{display:flex;gap:6px;margin-top:10px;}
  .len-btn{
    flex:1;border:2px solid #e9d5ff;background:#faf5ff;border-radius:12px;
    padding:8px;font-weight:800;color:#6b5b95;cursor:pointer;font-size:.85rem;
  }
  .len-btn.on{
    background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-color:transparent;
  }

  /* Maisie quote — inline in the countdown bar */
  .countdown{align-items:flex-start;}
  .maisie-inline{
    flex:1; display:flex; gap:8px; align-items:flex-start; justify-content:flex-end;
    text-align:right; max-width:62%;
  }
  .maisie-inline .mq-mark{ font-size:1.6rem; line-height:1; flex:0 0 auto; transform: rotate(-12deg); }
  .maisie-inline .mq-text{
    font-family: "Caveat", cursive;
    font-size: 1.1rem; font-weight:600; color: var(--ink);
    line-height:1.2;
    background: var(--butter);
    border: 1.5px solid var(--ink-soft);
    border-radius:12px; padding:8px 10px;
    box-shadow: 2px 2px 0 var(--ink-soft);
    transform: rotate(-1.5deg);
  }
  @media(max-width:380px){
    .maisie-inline .mq-text{ font-size:1rem; }
  }

  /* Match game */
  .match-board{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 auto 14px;max-width:560px;
  }
  .match-card{
    background:#fff;border-radius:14px;padding:10px 8px;min-height:96px;height:auto;cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center;
    text-align:center;font-size:.82rem;font-weight:700;color:#1f1147;
    transition:all .15s;border:3px solid transparent;line-height:1.3;
    user-select:none;word-break:break-word;hyphens:auto;overflow:hidden;
  }
  .match-card.term{background:linear-gradient(135deg,#fef3c7,#fde68a);color:#78350f;font-size:.88rem;}
  .match-card.def{background:linear-gradient(135deg,#e0e7ff,#c7d2fe);color:#312e81;font-size:.72rem;line-height:1.28;}
  @media(max-width:380px){
    .match-card{min-height:88px;}
    .match-card.def{font-size:.68rem;}
  }
  .match-card:active{transform:scale(.97);}
  .match-card.selected{border-color:#a855f7;box-shadow:0 0 0 4px rgba(168,85,247,.25);transform:scale(1.03);}
  .match-card.correct{background:linear-gradient(135deg,#bbf7d0,#86efac);color:#065f46;animation:matchPop .4s ease;}
  .match-card.wrong{background:linear-gradient(135deg,#fecaca,#fca5a5);color:#7f1d1d;animation:shake .3s;}
  .match-card.gone{opacity:0;pointer-events:none;transform:scale(.7);transition:all .4s;}
  @keyframes matchPop{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .match-hud{
    display:flex;justify-content:space-between;align-items:center;
    background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:10px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
  }
  .match-hud .tm{font-size:1.4rem;font-weight:900;color:#7c3aed;font-variant-numeric:tabular-nums;}
  .match-hud .lb{font-size:.7rem;color:#6b5b95;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .mode-match{background:linear-gradient(135deg,#ec4899,#a855f7)}

  /* Flashcard: clearer flip + button labels */
  .flash-face .tap-hint{
    position:absolute;bottom:14px;left:0;right:0;
    font-size:.85rem;font-weight:800;color:#7c3aed;
    display:flex;align-items:center;justify-content:center;gap:6px;
    animation:tapWiggle 1.6s ease-in-out infinite;
  }
  .flash-face .tap-hint .ico{font-size:1.1rem;}
  @keyframes tapWiggle{
    0%,100%{transform:translateY(0);opacity:.85;}
    50%{transform:translateY(-3px);opacity:1;}
  }
  .flash-controls .ctrl{
    flex:1;font-size:.92rem;padding:14px 8px;line-height:1.15;
  }
  .flash-controls .ctrl .lbl-sub{
    display:block;font-size:.65rem;font-weight:700;opacity:.7;margin-top:2px;
  }
  .flash-controls .ctrl.star{
    background:linear-gradient(135deg,#fde68a,#fcd34d);color:#78350f;flex:0.7;
  }
  .flash-controls .ctrl.star.on{
    background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff;
    box-shadow:0 4px 12px rgba(245,158,11,.4);
  }

  /* Stats screen */
  .stats-hero{
    background: linear-gradient(160deg, var(--pink-soft), var(--lilac-soft));
    border: 3px solid var(--pink);
    border-radius:24px; padding:22px; color: var(--ink); text-align:center;
    box-shadow: 6px 6px 0 var(--pink);
    margin-bottom:14px; position:relative; overflow:hidden;
    font-family: "Patrick Hand", cursive;
  }
  .stats-hero::before{
    content:""; position:absolute; inset:-50%;
    background: radial-gradient(circle, #ffffff66 0%, transparent 60%);
    animation: spin 18s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .stats-hero > *{position:relative;z-index:1;}
  .stats-hero .accuracy{
    font-family: "Caveat", cursive;
    font-size:4rem; font-weight:700; line-height:1; color: var(--pink-deep);
    text-shadow: 2px 2px 0 #fff;
  }
  .stats-hero .label{font-size:.95rem;font-weight:600;color: var(--ink-soft);}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px;}
  .stat-tile{
    background: var(--paper); border: 2px dashed var(--pink);
    border-radius:14px; padding:10px;
    box-shadow: 2px 2px 0 var(--pink);
  }
  .stat-tile .num{
    font-family: "Caveat", cursive;
    font-size:1.8rem; font-weight:700; line-height:1.1; color: var(--pink-deep);
  }
  .stat-tile .lbl{ font-size:.7rem; font-weight:600; color: var(--ink-soft); text-transform:uppercase; letter-spacing:.5px; }

  .stats-card{
    background: var(--paper);
    border: 2px dashed var(--lilac);
    border-radius:20px; padding:16px; margin-bottom:14px;
    box-shadow: 4px 4px 0 var(--lilac-soft);
    font-family: "Patrick Hand", cursive;
  }
  .stats-card h3{
    font-family: "Caveat", cursive;
    margin:0 0 12px; font-size:1.5rem; font-weight:700; color: var(--pink-deep);
    display:flex; align-items:center; gap:8px;
  }

  .topic-bar{margin-bottom:12px;}
  .topic-bar-top{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem;margin-bottom:4px;}
  .topic-bar-meta{font-size:.75rem;color:#6b5b95;font-weight:600;}
  .topic-bar-track{height:14px;background:#f1f5f9;border-radius:999px;overflow:hidden;position:relative;}
  .topic-bar-fill{height:100%;border-radius:999px;transition:width .5s ease;
    display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
    color:#fff;font-size:.65rem;font-weight:900;}
  .tb-pol{background:linear-gradient(90deg,#ef4444,#f97316);}
  .tb-cri{background:linear-gradient(90deg,#2563eb,#06b6d4);}
  .tb-med{background:linear-gradient(90deg,#a855f7,#ec4899);}
  .tb-ana{background:linear-gradient(90deg,#10b981,#84cc16);}

  .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;}
  .badge{
    background:#f8fafc;border:2px solid #e2e8f0;border-radius:14px;padding:10px 6px;text-align:center;
    transition:all .2s;position:relative;
  }
  .badge.unlocked{
    background:linear-gradient(135deg,#fef9c3,#fde68a);border-color:#fcd34d;
    box-shadow:0 4px 12px rgba(252,211,77,.4);
  }
  .badge.locked{opacity:.45;filter:grayscale(.7);}
  .badge .ico{font-size:1.8rem;display:block;margin-bottom:4px;}
  .badge .ttl{font-size:.7rem;font-weight:800;line-height:1.2;color:#1f1147;}
  .badge .sub{font-size:.6rem;color:#6b5b95;margin-top:2px;}

  .sessions-list{font-size:.85rem;}
  .sess-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;}
  .sess-row:last-child{border:0;}
  .sess-left{display:flex;align-items:center;gap:8px;}
  .sess-emoji{font-size:1.1rem;}
  .sess-meta{font-size:.7rem;color:#6b5b95;}
  .sess-score{font-weight:900;}
  .sess-score.good{color:#059669;}
  .sess-score.mid{color:#d97706;}
  .sess-score.low{color:#dc2626;}

  .streak-chip{
    background: var(--butter);
    color: var(--pink-deep);
    border: 2px solid var(--pink);
    border-radius:999px; padding:4px 12px;
    font-family: "Caveat", cursive;
    font-weight:700; font-size:1.1rem;
    box-shadow: 2px 2px 0 var(--pink);
    display:inline-flex; align-items:center; gap:5px;
  }

  .reset-btn{
    background:#fee2e2;color:#991b1b;border:0;border-radius:12px;padding:10px 14px;
    font-weight:800;cursor:pointer;font-size:.85rem;margin-top:8px;
  }

  .stats-btn{
    background: var(--lilac); color:#fff;
    border: 2px solid var(--ink); border-radius:14px;
    padding:14px; font-family: "Patrick Hand", cursive; font-weight:600;
    font-size:1.1rem; width:100%; margin-top:14px;
    box-shadow: 4px 4px 0 var(--ink);
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition: transform .12s, box-shadow .12s;
  }
  .stats-btn:active{ transform: translate(2px,2px); box-shadow: 2px 2px 0 var(--ink); }

  footer{
    margin-top:30px; text-align:center;
    font-family: "VT323", "Courier New", monospace;
    font-size:1rem; color: var(--ink-soft);
    padding: 14px;
    background: var(--paper);
    border: 2px dashed var(--pink);
    border-radius: 14px;
    box-shadow: 3px 3px 0 var(--pink-soft);
  }
  footer::before, footer::after{
    content: "꒰♡꒱";
    color: var(--pink-deep);
    margin: 0 8px;
    animation: blinkHeart 1.4s ease-in-out infinite;
  }
  @keyframes blinkHeart{
    0%,100%{ opacity: 1; }
    50%{ opacity: .35; }
  }

  @media(max-width:380px){
    .title{font-size:1.25rem}
    .flash-face .term{font-size:1.35rem}
    .flash-face .def{font-size:.95rem}
  }
  /* ═══════════════════════════════════════════════════════════════
     ❀  itinerae-style override  ❀
     Lace-doily background · sage & cream · pixel headers ·
     Win98 panel framing · cursive script logo · NO 2020s emoji.
     This block intentionally overrides everything above with
     more-specific selectors and !important on the key bits.
     ═══════════════════════════════════════════════════════════════ */

  /* Hide every modern colour-emoji that lives in the data */
  .topic .emoji, .topic-title > *:first-child:not(span),
  .mode-btn .ico, .prk-card .prk-emoji,
  .maisie-inline .mq-mark{ display: none !important; }
  /* Strip the cursive ♡ pre/post on the title and quote */
  .title::before, .title::after,
  .sub::before, .countdown::before,
  .done::before, .prk-card::after,
  .modes h3::before, .modes h3::after,
  .streak-chip::before,
  footer::before, footer::after{ content: none !important; }

  /* ── palette ── */
  :root{
    --bg:        #efe6cf;
    --bg2:       #f5ecd6;
    --paper:     #fbf5e4;
    --paper-soft:#f4ecd5;
    --ink:       #4a3a26;
    --ink-soft:  #7a6747;
    --ink-mute:  #a89570;
    --rule:      #c4ad7e;
    --rule-soft: #d9c595;
    --bar:       #c8b886;
    --bar-deep:  #a89065;
    --bar-ink:   #4a3a26;
    --sage:      #7a9270;
    --sage-deep: #5d7556;
    --sage-soft: #d7e0c8;
    --accent:    #8a4a3a;
    --accent-soft:#d8b8a8;
    --good:      #5d7556;
    --bad:       #8a4a3a;
    --warn:      #a37428;
  }

  /* ── body: lace damask background ── */
  body{
    background-color: var(--bg) !important;
    background-image:
      /* tiny doily floret motif repeated */
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='44' height='44' viewBox='0 0 44 44'><g fill='%23c4ad7e' fill-opacity='.22'><circle cx='22' cy='22' r='1.3'/><circle cx='22' cy='8' r='.9'/><circle cx='22' cy='36' r='.9'/><circle cx='8' cy='22' r='.9'/><circle cx='36' cy='22' r='.9'/><circle cx='12' cy='12' r='.6'/><circle cx='32' cy='12' r='.6'/><circle cx='12' cy='32' r='.6'/><circle cx='32' cy='32' r='.6'/></g></svg>"),
      radial-gradient(ellipse at top, var(--paper) 0%, transparent 70%),
      radial-gradient(ellipse at bottom, var(--bg2) 0%, transparent 60%) !important;
    background-attachment: fixed, fixed, fixed !important;
    padding: 22px 14px 80px !important;
    font-family: "EB Garamond", Georgia, "Times New Roman", serif !important;
    color: var(--ink) !important;
    font-size: 15px;
    line-height: 1.5;
  }
  /* kill the twinkling stars from the earlier version */
  body::before{ content: none !important; }
  .orn{ display: none !important; }

  .wrap{ max-width: 640px; }

  /* Force-strip 2020s emoji colour rendering on any decorative chars */
  .title, .sub, .topic-title, .modes h3,
  .panel-bar, .stats-hero, .done, .maisie-inline{
    font-variant-emoji: text;
  }

  /* ── HEADER: cursive logo + tiny status line ── */
  header{ display: block; margin-bottom: 14px; }
  .title{
    font-family: "Yellowtail", "Apple Chancery", "Lucida Calligraphy", cursive !important;
    font-size: 2.4rem !important;
    font-weight: 400 !important;
    font-style: normal !important;
    color: var(--sage-deep) !important;
    line-height: 1 !important;
    letter-spacing: 0 !important;
    text-align: center;
    text-shadow: 1px 1px 0 var(--paper);
    padding: 6px 0 0;
    transform: none !important;
  }
  .sub{
    font-family: "Silkscreen", "Pixelify Sans", "VT323", monospace !important;
    font-size: .7rem !important;
    text-align: center;
    letter-spacing: .25em !important;
    text-transform: uppercase;
    color: var(--ink-soft) !important;
    margin-top: 4px !important;
    transform: none !important;
    font-style: normal !important;
  }
  .sub::before{ content: "·  " !important; color: var(--rule); }
  .sub::after { content: "  ·" !important; color: var(--rule); }

  /* Language toggle as small dotted-underline links */
  .lang{
    background: transparent !important; border: 0 !important;
    border-bottom: 1px dotted var(--rule) !important;
    border-radius: 0 !important; padding: 0 !important;
    font-family: "Pixelify Sans", "VT323", monospace !important;
    font-size: .75rem !important; gap: 2px !important;
  }
  .lang button{
    font-family: inherit !important; font-size: .75rem !important;
    padding: 4px 8px !important; color: var(--ink-soft) !important;
    text-transform: uppercase; letter-spacing: .1em;
    font-style: normal !important;
  }
  .lang button.on{
    background: transparent !important; color: var(--accent) !important;
    text-decoration: none !important;
  }
  .lang button.on::before{ content: "» "; }

  /* Audio buttons match the look */
  .audio-btn{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    width: 28px !important; height: 28px !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    font-size: .9rem !important;
    font-variant-emoji: text;
  }
  .audio-btn.on{
    background: var(--sage-soft) !important; border-color: var(--sage-deep) !important;
    box-shadow: 1px 1px 0 var(--sage-deep) !important;
    animation: none !important; color: var(--sage-deep) !important;
  }

  /* ── PANEL: the Win98-style framing used for big sections ── */
  .panel-frame{
    background: var(--paper);
    border: 1px solid var(--rule);
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft);
    margin-bottom: 14px;
    border-radius: 0;
    overflow: hidden;
  }
  .panel-bar{
    background: var(--bar);
    border-bottom: 1px solid var(--bar-deep);
    color: var(--bar-ink);
    padding: 3px 8px;
    font-family: "Pixelify Sans", "VT323", monospace;
    font-size: .72rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
    font-weight: 600;
  }
  .panel-bar .controls{
    display: inline-flex; gap: 3px;
    font-family: "Silkscreen", monospace; font-size: .58rem;
  }
  .panel-bar .controls span{
    display: inline-block; width: 12px; height: 12px;
    background: var(--paper-soft); border: 1px solid var(--bar-deep);
    text-align: center; line-height: 10px;
    color: var(--bar-deep);
  }
  .panel-body{ padding: 12px 14px; }

  /* ── COUNTDOWN: framed like a Win98 panel ── */
  .countdown{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top-width: 22px !important;
    border-top-style: solid !important;
    border-top-color: var(--bar) !important;
    border-radius: 0 !important;
    padding: 10px 12px !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    font-size: .85rem !important;
    color: var(--ink) !important;
    font-style: normal !important;
    position: relative;
    margin-top: 4px;
  }
  .countdown::before{
    content: "★  CURRENTLY" !important;
    display: block;
    position: absolute !important;
    top: -19px; left: 0; right: 0;
    color: var(--bar-ink) !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .68rem !important;
    letter-spacing: .22em !important;
    text-align: left;
    padding-left: 8px;
    transform: none !important;
    font-style: normal !important;
  }
  .countdown .big{
    font-family: "Yellowtail", cursive !important;
    font-size: 1.7rem !important;
    color: var(--accent) !important;
    line-height: 1 !important;
    font-style: normal !important;
  }
  .maisie-inline .mq-text{
    font-family: "EB Garamond", Georgia, serif !important;
    background: transparent !important;
    border: 0 !important; border-left: 2px dotted var(--rule) !important;
    border-radius: 0 !important;
    padding: 2px 0 2px 10px !important;
    color: var(--ink) !important;
    font-style: italic !important;
    font-size: .9rem !important;
    font-weight: 400 !important;
    box-shadow: none !important;
    transform: none !important;
  }
  .streak-chip{
    background: var(--sage-soft) !important;
    border: 1px solid var(--sage-deep) !important;
    color: var(--sage-deep) !important;
    border-radius: 2px !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .72rem !important;
    letter-spacing: .1em !important;
    padding: 1px 8px !important;
    box-shadow: 1px 1px 0 var(--sage-deep) !important;
    font-weight: 500 !important;
  }
  .streak-chip::before{ content: "✦ " !important; }

  /* ── TOPIC CARDS: small Win98-style framed entries ── */
  .grid{ display: grid !important; grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
  .topic{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top: 18px solid var(--bar) !important;
    border-radius: 0 !important;
    padding: 10px 12px 12px !important;
    color: var(--ink) !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    position: relative !important;
    min-height: 0 !important;
    transition: transform .12s, box-shadow .12s;
  }
  .topic::before, .topic::after{ content: none !important; }
  .topic::before{
    content: "❀" !important;
    position: absolute !important;
    top: -16px; left: 8px;
    color: var(--bar-ink) !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .7rem;
    font-variant-emoji: text;
    text-transform: uppercase; letter-spacing: .2em;
  }
  .topic:hover{ background: var(--paper-soft) !important; }
  .topic:active{ transform: translate(1px,1px); box-shadow: 0 0 0 var(--rule) !important; }
  .topic h2{
    font-family: "EB Garamond", Georgia, serif !important;
    font-style: italic !important; font-weight: 500 !important;
    color: var(--sage-deep) !important;
    font-size: 1.08rem !important;
    margin: 0 0 4px !important;
    line-height: 1.2 !important;
    text-shadow: none !important;
  }
  .topic p{
    font-family: "EB Garamond", Georgia, serif !important;
    color: var(--ink-soft) !important;
    font-size: .82rem !important;
    line-height: 1.4 !important;
    margin: 0 !important;
  }
  .topic .count{
    background: transparent !important;
    border: 0 !important;
    color: var(--ink-mute) !important;
    box-shadow: none !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .62rem !important;
    font-weight: 400 !important;
    padding: 0 !important;
    top: 4px !important; right: 6px !important;
    letter-spacing: .08em;
  }
  .topic .count::before{ content: "✦ " !important; }
  /* topic-color hint as a tiny tag below the title bar */
  .topic.pol{ border-top-color: #cda49e !important; }
  .topic.cri{ border-top-color: #a4b7cd !important; }
  .topic.med{ border-top-color: #c0a9cf !important; }
  .topic.ana{ border-top-color: #a9c4a4 !important; }
  .topic.pol::before{ content: "✿  POLITIEK" !important; }
  .topic.cri::before{ content: "✿  CRIMINALITEIT" !important; }
  .topic.med::before{ content: "✿  MEDIA" !important; }
  .topic.ana::before{ content: "✿  ANALYSE" !important; }

  /* washi-tape strip across each topic's title bar */
  .topic::after{
    content: "" !important;
    position: absolute !important;
    top: -16px !important; right: 16px !important;
    width: 44px !important; height: 14px !important;
    transform: rotate(-6deg) !important;
    background: repeating-linear-gradient(45deg, #f3d8c8 0 5px, #f9e7dc 5px 10px) !important;
    border: 1px solid #ffffffaa !important;
    box-shadow: 0 1px 1px rgba(0,0,0,.06) !important;
    border-radius: 1px !important;
    opacity: .92 !important;
    pointer-events: none;
  }
  .topic.cri::after{ background: repeating-linear-gradient(45deg, #d1dde9 0 5px, #e3ecf2 5px 10px) !important; transform: rotate(5deg) !important; }
  .topic.med::after{ background: repeating-linear-gradient(45deg, #e1d2ec 0 5px, #ede2f4 5px 10px) !important; transform: rotate(-4deg) !important; }
  .topic.ana::after{ background: repeating-linear-gradient(45deg, #d5e3cf 0 5px, #e6efe2 5px 10px) !important; transform: rotate(6deg) !important; }
  .topic.pol h2{ color: #8b3a5a !important; }
  .topic.cri h2{ color: #3e5f80 !important; }
  .topic.med h2{ color: #6b497d !important; }
  .topic.ana h2{ color: #4f7556 !important; }
  /* status badge → small pixel pill at the BOTTOM of the card so it never
     fights long titles like "Analyse Maatschappelijk Vraagstuk" */
  .topic{ padding-bottom: 28px !important; }
  .topic .status{
    position: absolute !important;
    bottom: 6px !important; right: 8px !important;
    top: auto !important; left: auto !important;
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    color: var(--ink-soft) !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    padding: 1px 6px !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .62rem !important; letter-spacing: .1em !important;
    font-style: normal !important; font-weight: 500 !important;
    text-transform: uppercase;
    white-space: nowrap;
    max-width: 96%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topic .status span:first-child{ display: none !important; }
  .topic .status .grade{
    font-family: "EB Garamond", Georgia, serif !important;
    font-size: .82rem !important; font-style: italic !important;
    text-transform: none;
  }
  .topic .status.st-pass    { background: var(--sage-soft) !important; border-color: var(--sage-deep) !important; color: var(--sage-deep) !important; box-shadow: 1px 1px 0 var(--sage-deep) !important; }
  .topic .status.st-pass    .grade{ color: var(--sage-deep) !important; }
  .topic .status.st-almost  { background: #f5e7c8 !important; border-color: var(--warn) !important; color: var(--warn) !important; box-shadow: 1px 1px 0 var(--warn) !important; }
  .topic .status.st-almost  .grade{ color: var(--warn) !important; }
  .topic .status.st-low     { background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent) !important; box-shadow: 1px 1px 0 var(--accent) !important; }
  .topic .status.st-low     .grade{ color: var(--accent) !important; }
  .topic .status.st-start, .topic .status.st-none{
    background: var(--paper-soft) !important; color: var(--ink-mute) !important;
  }

  /* ── MODE PICKER ── */
  .modes{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top: 18px solid var(--bar) !important;
    border-radius: 0 !important;
    padding: 12px 14px !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    margin-top: 12px;
    position: relative;
  }
  .modes::before{
    content: "❀  KIES EEN MODUS";
    position: absolute; top: -17px; left: 8px;
    color: var(--bar-ink);
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .68rem; letter-spacing: .22em;
  }
  .modes h3{
    font-family: "EB Garamond", Georgia, serif !important;
    font-style: italic !important; font-weight: 500 !important;
    color: var(--ink-soft) !important;
    font-size: .95rem !important;
    text-align: left !important;
    margin: 0 0 10px !important;
    text-shadow: none !important;
  }
  .mode-row{ grid-template-columns: repeat(4, 1fr) !important; gap: 6px !important; }
  .mode-btn{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    padding: 8px 4px !important;
    color: var(--ink) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    font-size: .82rem !important; font-style: italic !important;
    font-weight: 500 !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    transition: background .1s, border-color .1s !important;
    transform: none !important;
  }
  .mode-btn:hover{ background: var(--sage-soft) !important; border-color: var(--sage-deep) !important; color: var(--sage-deep) !important; }
  .mode-btn:active{ transform: translate(1px,1px) !important; box-shadow: 0 0 0 var(--rule) !important; }
  .mode-btn::before{
    content: "✦"; display: block;
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .8rem; color: var(--bar-deep);
    font-style: normal; margin-bottom: 1px;
    font-variant-emoji: text;
  }
  .mode-flash::before{ content: "I·" !important; }
  .mode-type::before{ content: "II·" !important; }
  .mode-quiz::before{ content: "III·" !important; }
  .mode-match::before{ content: "IV·" !important; }
  .len-row{ gap: 4px !important; margin-top: 8px !important; }
  .len-btn{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    color: var(--ink-soft) !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .72rem !important; letter-spacing: .05em !important;
    padding: 5px 4px !important;
    font-weight: 400 !important;
  }
  .len-btn.on{
    background: var(--sage-soft) !important; border-color: var(--sage-deep) !important;
    color: var(--sage-deep) !important;
  }

  /* ── BACK / top-bar ── */
  .back{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    color: var(--ink-soft) !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .7rem !important; letter-spacing: .15em !important;
    padding: 3px 8px !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    text-decoration: none !important;
    font-style: normal !important; font-weight: 500 !important;
  }
  .back:hover{ background: var(--sage-soft) !important; color: var(--sage-deep) !important; }
  .top-bar{ border: 0 !important; padding-bottom: 8px !important; margin-bottom: 12px !important; }
  .topic-title{
    font-family: "Yellowtail", cursive !important;
    font-style: normal !important;
    font-size: 1.6rem !important; font-weight: 400 !important;
    color: var(--sage-deep) !important;
    text-shadow: 1px 1px 0 var(--paper) !important;
    transform: none !important;
  }

  /* ── PROGRESS BAR: pixel chunks ── */
  .progress{
    height: 8px !important;
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 0 !important;
    margin-bottom: 10px !important;
    box-shadow: none !important;
  }
  .progress > div{
    background: repeating-linear-gradient(90deg, var(--sage) 0 6px, var(--sage-deep) 6px 7px) !important;
    height: 100% !important;
  }
  .stats{ font-family: "Pixelify Sans","VT323",monospace !important; font-size: .7rem !important; }
  .pill{
    border-radius: 2px !important; padding: 1px 6px !important;
    border: 1px solid var(--rule) !important;
    background: var(--paper-soft) !important; color: var(--ink-soft) !important;
    font-family: inherit !important;
    box-shadow: none !important;
  }
  .pill.good{ background: var(--sage-soft) !important; border-color: var(--sage-deep) !important; color: var(--sage-deep) !important; }
  .pill.bad{ background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent) !important; }

  /* ── FLASHCARDS ── */
  .flash-face{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top: 22px solid var(--bar) !important;
    border-radius: 0 !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    padding: 22px 22px 50px !important;
    position: relative;
  }
  .flash-face::before{
    content: "✿  KAART  —  TIK OM TE DRAAIEN";
    position: absolute; top: -20px; left: 8px; right: 8px;
    color: var(--bar-ink);
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .65rem; letter-spacing: .2em;
    text-align: left;
  }
  .flash-back::before{ content: "✿  ANTWOORD  —  TIK OM TERUG" !important; }
  .flash-face .term{
    font-family: "Yellowtail", cursive !important;
    font-style: normal !important;
    font-size: 2.1rem !important;
    color: var(--sage-deep) !important;
    font-weight: 400 !important;
    line-height: 1.1 !important;
  }
  .flash-face .def{
    font-family: "EB Garamond", Georgia, serif !important;
    font-size: 1rem !important;
    color: var(--ink) !important;
  }
  .flash-face .tap-hint{
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .65rem !important; letter-spacing: .15em !important;
    color: var(--ink-mute) !important; animation: none !important;
  }
  .flash-face .tap-hint .ico{ display: none !important; }
  .flash-face .tap-hint::before{ content: "» "; }
  .flash-face .mnemonic{
    background: #fdf1d8 !important;
    border: 1px solid var(--rule) !important;
    border-left: 3px solid var(--sage) !important;
    border-radius: 0 !important;
    box-shadow: 1px 1px 0 var(--rule-soft) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    color: var(--ink) !important;
    font-size: .9rem !important;
    font-weight: 400 !important;
  }
  .flash-face .mnemonic .ezelsbrug-label{
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .62rem !important;
    color: var(--sage-deep) !important;
    letter-spacing: .2em !important;
  }
  .flash-controls{ gap: 6px !important; }
  .ctrl{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    color: var(--ink) !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    font-style: italic !important; font-weight: 500 !important;
    font-size: .92rem !important;
    transform: none !important;
  }
  .ctrl.hard{ color: var(--accent) !important; border-color: var(--accent-soft) !important; box-shadow: 1px 1px 0 var(--accent-soft) !important; }
  .ctrl.easy{ color: var(--sage-deep) !important; border-color: var(--sage) !important; box-shadow: 1px 1px 0 var(--sage) !important; }
  .ctrl.star.on{ background: var(--sage-soft) !important; color: var(--sage-deep) !important; }

  /* ── TYPE / QUIZ ── */
  .type-card, .quiz-card{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top: 22px solid var(--bar) !important;
    border-radius: 0 !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    position: relative;
  }
  .type-card::before, .quiz-card::before{
    position: absolute; top: -20px; left: 8px;
    color: var(--bar-ink);
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .65rem; letter-spacing: .22em;
  }
  .type-card::before{ content: "✿  TYP HET BEGRIP"; }
  .quiz-card::before{ content: "✿  QUIZ"; }
  .type-q{
    font-family: "Pixelify Sans","VT323",monospace !important;
    color: var(--sage-deep) !important;
    font-size: .68rem !important; letter-spacing: .22em !important;
  }
  .type-prompt{
    font-family: "Yellowtail", cursive !important;
    font-style: normal !important;
    font-size: 1.7rem !important;

    line-height: 1.1 !important;
  }
  .type-input{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 0 !important;
    font-family: "EB Garamond", Georgia, serif !important;
    color: var(--ink) !important;
  }
  .type-input:focus{ border-color: var(--sage-deep) !important; box-shadow: 0 0 0 2px var(--sage-soft) !important; }
  .btn{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    font-style: italic !important; font-weight: 500 !important;
    color: var(--ink) !important;
  }
  .btn-primary{ background: var(--sage) !important; color: #fff !important; border-color: var(--sage-deep) !important; box-shadow: 1px 1px 0 var(--sage-deep) !important; }
  .btn-ghost{ background: var(--paper-soft) !important; color: var(--ink-soft) !important; }
  .quiz-opt{
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-radius: 2px !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    color: var(--ink) !important;
    font-style: italic !important; font-weight: 500 !important;
  }
  .quiz-opt:hover{ background: var(--sage-soft) !important; border-color: var(--sage-deep) !important; color: var(--sage-deep) !important; transform: none !important; }
  .quiz-opt.correct{ background: var(--sage-soft) !important; border-color: var(--sage-deep) !important; color: var(--sage-deep) !important; box-shadow: 1px 1px 0 var(--sage-deep) !important; }
  .quiz-opt.wrong{ background: var(--accent-soft) !important; border-color: var(--accent) !important; color: var(--accent) !important; box-shadow: 1px 1px 0 var(--accent) !important; }
  .feedback{
    border-radius: 0 !important;
    font-family: "EB Garamond", Georgia, serif !important;
    background: var(--paper-soft) !important;
    border: 1px solid var(--rule) !important;
    border-left: 3px solid var(--ink-soft) !important;
    color: var(--ink) !important;
  }
  .feedback.right{ border-left-color: var(--sage-deep) !important; color: var(--sage-deep) !important; }
  .feedback.almost{ border-left-color: var(--warn) !important; color: var(--warn) !important; }
  .feedback.wrong{ border-left-color: var(--accent) !important; color: var(--accent) !important; }

  /* ── MATCH ── */
  .match-card{
    border-radius: 2px !important;
    border: 1px solid var(--rule) !important;
    box-shadow: 1px 1px 0 var(--rule) !important;
    font-family: "EB Garamond", Georgia, serif !important;
    font-style: italic !important;

    border-top: 18px solid var(--bar) !important;

    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    color: var(--ink) !important;
    padding: 10px 14px !important;
    position: relative !important;
  }
  .prk-card::before{
    content: "❀  EEN PAGINA OM TE LEZEN";
    position: absolute; top: -16px; left: 8px;
    color: var(--bar-ink);
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .68rem; letter-spacing: .22em;

    font-family: "Yellowtail", cursive !important;

  .prk-card .prk-arrow::before{ content: "»"; }
  .prk-card .prk-arrow > *{ display: none; }

  /* ── STATS BUTTON ── */
  .stats-btn{
    background: var(--sage-soft) !important;
    border: 1px solid var(--sage-deep) !important;
    border-radius: 2px !important;
    box-shadow: 1px 1px 0 var(--sage-deep) !important;
    color: var(--sage-deep) !important;
    font-family: "Pixelify Sans","VT323",monospace !important;
    font-size: .82rem !important;
    letter-spacing: .15em !important;
    text-transform: uppercase;
    font-weight: 500 !important;
    transform: none !important;
  }

  /* ── STATS HERO ── */
  .stats-hero{
    background: var(--paper) !important;
    border: 1px solid var(--rule) !important;
    border-top: 22px solid var(--bar) !important;
    border-radius: 0 !important;
    box-shadow: 1px 1px 0 var(--rule), 2px 2px 0 var(--rule-soft) !important;
    color: var(--ink) !important;
    position: relative !important;
  }
  .stats-hero::before{
    content: "★  MIJN VOORTGANG";
    position: absolute; top: -20px; left: 8px;
    color: var(--bar-ink);
    font-family: "Pixelify Sans","VT323",monospace;
    font-size: .7rem; letter-spacing: .22em;
    animation: none !important;
    background: none !important;
    inset: auto !important;
  }
  .stats-hero .label{ color: var(--ink-soft) !important; font-family: "Pixelify Sans","VT323",monospace !important; font-size: .68rem !important; letter-spacing: .2em !important; }
  .stats-hero .accuracy{
    font-family: "Yellowtail", cursive !important;
    font-size: 3rem !important;
    color: var(--accent) !important;
