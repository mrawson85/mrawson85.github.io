                        <div className="flex items-center gap-3">
                            <div className="bg-emerald-500 p-2 rounded-xl"><Icon name="grad" /></div>
                            <div><h1 className="text-xl font-black uppercase tracking-tighter glow-text leading-none">BIOMASTER</h1><span className="text-[10px] text-slate-500 font-black uppercase">Lvl {level} • {xp} XP</span></div>
                        </div>
                        <div className="flex items-center gap-2">
                            <button onClick={toggleMute} className="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all border border-slate-700 active:scale-90"><Icon name={muted ? "mute" : "volume"} className={muted ? "text-red-400" : "text-emerald-400"} /></button>
                            <button onClick={() => { playSFX('click'); setLang(lang === 'nl' ? 'en' : 'nl'); }} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl border border-slate-700 font-black text-xs uppercase active:scale-90">{lang}</button>
                        </div>
                    </div>

                    <main className="w-full max-w-2xl flex-1 flex flex-col">
                        {view === 'menu' && (
                            <div className="space-y-4 animate-in fade-in slide-in-from-bottom-4 duration-500 pb-10">
                                <div className="text-center mb-6 py-4"><h2 className="text-4xl font-black mb-3 italic uppercase glow-text leading-none">STUDY HUB</h2></div>
                                <div className="grid grid-cols-1 gap-4">
                                    <MenuCard icon="dna" title={lang === 'nl' ? "H4: Voortplanting" : "Ch4: Reproduction"} desc="84 Terms Mastery" onStart={() => startMasterMode('reproduction')} btnText={t.ui.master} primary />
                                    <MenuCard icon="leaf" title={lang === 'nl' ? "H5: Stofwisseling" : "Ch5: Metabolism"} desc="43 Terms Mastery" onStart={() => startMasterMode('metabolism')} btnText={t.ui.master} primary />

                                    <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 hover:border-emerald-500/30 transition-all flex flex-col gap-4 shadow-xl">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-emerald-600/20 p-4 rounded-2xl text-emerald-400"><Icon name="eye" /></div>
                                            <div><h3 className="text-xl font-black uppercase italic tracking-tighter">{t.ui.visual}</h3><p className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Real Textbook Diagrams</p></div>
                                        </div>
                                        <button onClick={() => { playSFX('click'); setView('visual'); setCurrentIndex(0); }} className="bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:translate-y-1">Open Visual Guide</button>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 hover:border-amber-500/30 transition-all flex flex-col gap-4 shadow-xl">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-amber-600/20 p-4 rounded-2xl text-amber-400"><Icon name="run" /></div>
                                            <div><h3 className="text-xl font-black uppercase italic tracking-tighter">{t.ui.runner}</h3><p className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Only Mode With Music</p></div>
                                        </div>
                                        <button onClick={() => { playSFX('click'); startMusic(); setView('runner'); }} className="bg-amber-600 hover:bg-amber-500 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:translate-y-1">Play Arcade</button>
                                    </div>
                                    
                                    <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 hover:border-cyan-500/30 transition-all flex flex-col gap-4 shadow-xl">
                                        <div className="flex items-center gap-4">
                                            <div className="bg-cyan-600/20 p-4 rounded-2xl text-cyan-400"><Icon name="flask" /></div>
                                            <div><h3 className="text-xl font-black uppercase italic tracking-tighter">{t.ui.lab}</h3><p className="text-slate-500 text-[10px] font-black uppercase tracking-widest">Score: {highScores.lab}</p></div>
                                        </div>
                                        <button onClick={() => { playSFX('click'); setScore(0); setCurrentIndex(0); setQuizFinished(false); setView('lab'); }} className="bg-cyan-600 hover:bg-cyan-500 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:translate-y-1">Enter Lab</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'visual' && (
                            <div className="space-y-6 animate-in slide-in-from-bottom-10">
                                <div className="flex justify-between items-center px-2">
                                    <button onClick={() => setView('menu')} className="text-slate-400 hover:text-white flex items-center gap-2 font-bold text-sm"><Icon name="home" className="w-4 h-4"/> {t.ui.back}</button>
                                    <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{currentIndex + 1} / {VISUALS.length}</span>
                                </div>
                                <div className="bg-slate-900 border-4 border-emerald-500/50 rounded-[3rem] p-8 shadow-2xl">
                                    <h3 className="text-3xl font-black text-center mb-8 uppercase italic glow-text tracking-tighter">{lang === 'nl' ? VISUALS[currentIndex].title_nl : VISUALS[currentIndex].title_en}</h3>
                                    <div className="bg-white p-4 rounded-[2rem] border border-slate-800 mb-8 flex items-center justify-center min-h-[250px] overflow-hidden">
                                        <img src={VISUALS[currentIndex].img} alt="diagram" className="max-w-full h-auto" />
                                    </div>
                                    <p className="text-center font-bold text-sm leading-relaxed text-slate-200">{lang === 'nl' ? VISUALS[currentIndex].desc_nl : VISUALS[currentIndex].desc_en}</p>
                                </div>
                                <div className="flex gap-4">
                                    <button disabled={currentIndex === 0} onClick={() => setCurrentIndex(currentIndex - 1)} className="flex-1 bg-slate-800 p-4 rounded-2xl border border-slate-700 disabled:opacity-30"><Icon name="home" className="rotate-[-90deg] mx-auto"/></button>
                                    <button onClick={() => { if(currentIndex < VISUALS.length - 1) setCurrentIndex(currentIndex + 1); else setView('menu'); }} className="flex-[3] bg-emerald-600 p-4 rounded-2xl font-black uppercase text-xs tracking-widest shadow-xl">{currentIndex === VISUALS.length - 1 ? "Finish" : "Next Visual"}</button>
                                </div>
                            </div>
                        )}

                        {view === 'runner' && <BioRunner lang={lang} playSFX={playSFX} onEnd={(finalScore) => { stopMusic(); if(finalScore > highScores.runner) setHighScores({...highScores, runner: finalScore}); setView('menu'); }} />}

                        {view === 'lab' && !quizFinished && (
                            <div className="space-y-6 animate-in slide-in-from-right-4">
                                <div className="flex justify-between items-center mb-2 px-2"><button onClick={() => setView('menu')} className="text-slate-400 flex items-center gap-2 font-bold text-sm"><Icon name="home" className="w-4 h-4"/> {t.ui.back}</button><span className="text-xs font-black text-cyan-400 tracking-widest">TRAP {currentIndex + 1} / {TRAPS.length}</span></div>
                                <div className="bg-slate-900 border-2 border-cyan-500/50 rounded-[2.5rem] p-10 relative shadow-2xl text-center">
                                    <h3 className="text-2xl font-black mb-10 leading-tight glow-text text-cyan-300">{lang === 'nl' ? TRAPS[currentIndex].q_nl : TRAPS[currentIndex].q_en}</h3>
                                    <div className="grid grid-cols-1 gap-3">
                                        {TRAPS[currentIndex].opt.map((o, i) => <button key={i} onClick={() => { if(i === TRAPS[currentIndex].correct) { playSFX('correct'); setScore(s=>s+200); setXp(x=>x+200); if(currentIndex < TRAPS.length-1) setCurrentIndex(currentIndex+1); else setQuizFinished(true); } else { playSFX('wrong'); setFeedback({correct:false, msg:t.ui.wrong, hint:TRAPS[currentIndex].hint}); setTimeout(()=>setFeedback(null),3000); } }} className="bg-slate-800 hover:bg-cyan-600 border border-slate-700 p-6 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-95">{o}</button>)}
                                    </div>
                                </div>
                                {feedback && (
                                    <div className="p-6 rounded-3xl flex flex-col gap-2 shadow-2xl border-2 animate-in slide-in-from-bottom-10 bg-slate-900/95 border-red-500">
                                        <div className="flex items-center gap-4"><Icon name="lightbulb" className="text-red-400" /><p className="font-black text-lg uppercase">{feedback.msg}</p></div>
                                        <p className="mt-2 bg-slate-950/50 p-4 rounded-2xl border border-red-500/30 text-xs italic font-medium leading-relaxed">{t.ui.hint} "{feedback.hint}"</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'master' && !quizFinished && (
                            <div className="space-y-6 animate-in slide-in-from-right-4 duration-300">
                                <div className="flex justify-between items-center mb-2 px-2"><button onClick={() => setView('menu')} className="text-slate-400 hover:text-white flex items-center gap-2 font-bold text-sm active:scale-95"><Icon name="home" className="w-4 h-4"/> {t.ui.back}</button><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{currentIndex + 1} / {DATA[activeModule].length}</span></div>
                                <div className="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-10 relative overflow-hidden shadow-2xl text-center">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-slate-800"><div className="h-full bg-emerald-500 transition-all duration-500" style={{ width: `${((currentIndex) / DATA[activeModule].length) * 100}%` }}></div></div>
                                    <h3 className="text-4xl font-black tracking-tighter uppercase italic glow-text mb-10">{lang === 'nl' ? DATA[activeModule][currentIndex].nl : DATA[activeModule][currentIndex].en}</h3>
                                    <div className="space-y-3">
                                        {mcqOptions.map((opt, idx) => (
                                            <button key={idx} disabled={!!feedback && feedback.correct} onClick={() => { if(opt.nl === DATA[activeModule][currentIndex].nl) { playSFX('correct'); setScore(s=>s+1); setXp(x=>x+100); setFeedback({correct:true, msg:t.ui.correct}); setTimeout(()=>{setFeedback(null); if(currentIndex < DATA[activeModule].length-1){const n=currentIndex+1;setCurrentIndex(n);setMcqOptions(generateOptions(activeModule,n));}else setQuizFinished(true);},800); } else { playSFX('wrong'); setFeedback({correct:false, msg:t.ui.wrong, hint: lang==='nl'?DATA[activeModule][currentIndex].mn_nl:DATA[activeModule][currentIndex].mn_en}); } }} className={`w-full text-left p-6 rounded-[1.5rem] border-2 transition-all font-black text-[11px] uppercase tracking-widest shadow-md ${!feedback ? 'border-slate-800 bg-slate-800/40 hover:border-emerald-500 active:scale-[0.98]' : opt.nl === DATA[activeModule][currentIndex].nl ? 'border-emerald-500 bg-emerald-500/20 shadow-emerald-500/20 pulse-emerald' : 'border-slate-800 opacity-40'}`}>
                                                {lang === 'nl' ? opt.def_nl : opt.def_en}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                {feedback && (
                                    <div className={`p-6 rounded-3xl shadow-2xl border-2 animate-in slide-in-from-bottom-10 backdrop-blur-md ${feedback.correct ? 'bg-emerald-600/90 border-emerald-400' : 'bg-slate-900/95 border-red-500'}`}>
                                        <div className="flex items-center gap-4">{feedback.correct ? <Icon name="zap" className="animate-bounce" /> : <Icon name="lightbulb" className="text-red-400 animate-pulse" />}<p className="font-black text-lg uppercase tracking-tight">{feedback.msg}</p></div>
                                        {!feedback.correct && <p className="mt-2 bg-slate-950/50 p-4 rounded-2xl border border-red-500/30 text-xs italic font-medium leading-relaxed">{t.ui.hint} "{feedback.hint}"</p>}
                                    </div>
                                )}
                            </div>
                        )}

                        {quizFinished && (
                            <div className="text-center bg-slate-900 border border-slate-800 rounded-[3.5rem] p-16 shadow-2xl animate-in zoom-in-95 backdrop-blur-sm">
                                <Icon name="trophy" className="mx-auto w-24 h-24 text-yellow-500 mb-8" />
                                <h2 className="text-5xl font-black mb-12 uppercase italic glow-text tracking-tighter">SUCCESS!</h2>
                                <button onClick={() => { playSFX('level'); if(view === 'lab' && score > highScores.lab) setHighScores({...highScores, lab: score}); setView('menu'); }} className="w-full bg-white text-slate-950 py-6 rounded-3xl font-black uppercase tracking-widest text-sm shadow-xl active:scale-95 transition-all">BACK TO HUB</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const MenuCard = ({ icon, title, desc, onStart, btnText, primary }) => (
            <div className={`bg-slate-900 border ${primary ? 'border-emerald-500/50' : 'border-slate-800'} rounded-3xl p-6 hover:border-emerald-500 transition-all flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl`}>
                <div className="flex items-center gap-4 text-center sm:text-left">
                    <div className="bg-slate-800 p-5 rounded-[1.5rem] text-emerald-400 shadow-inner"><Icon name={icon} className="w-6 h-6"/></div>
                    <div><h3 className="text-xl font-black uppercase italic tracking-tighter leading-none mb-1">{title}</h3><p className="text-slate-500 text-[10px] font-black uppercase tracking-widest">{desc}</p></div>
                </div>
                <button onClick={onStart} className={`${primary ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-slate-800 hover:bg-slate-700'} border border-slate-700 px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all shadow-lg active:translate-y-1`}>{btnText}</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
