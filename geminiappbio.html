                    masterMode: "Master Mode",
                    score: "Score",

                    xp: "XP Points",

            const [xp, setXp] = useState(0);

                    .sort(() => 0.5 - Math.random())
                    .slice(0, 3);
                return [current, ...others].sort(() => 0.5 - Math.random());
            };

                setActiveModule(mod);
                setCurrentIndex(0);
                setScore(0);
                setQuizFinished(false);
                setFeedback(null);
                setMcqOptions(generateOptions(mod, 0));
                setView('master');

                    setXp(xp + 100);

                        setFeedback(null);
                        if (currentIndex < DATA[activeModule].length - 1) {

                            setCurrentIndex(nextIndex);
                            setMcqOptions(generateOptions(activeModule, nextIndex));

                        msg: t.ui.wrong, 
                        hint: lang === 'nl' ? current.mn_nl : current.mn_en
