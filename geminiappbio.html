        const QUESTS = [

        ];

        const TEXT = {
            nl: {
                title: "BioMaster",
                welcome: "Klaar voor de eindsprint?",
                chooseModule: "Kies een modus om de volledige stof te beheersen",
                ui: { master: "Mastery Mode", quest: "Synergy Quest", runner: "Bio-Runner (Arcade)", score: "Score", level: "Lvl", xp: "XP", next: "Volgende", finish: "Klaar!", correct: "Top!", wrong: "Helaas!", hint: "Mnemonic:", back: "Menu", term: "BEGRIP", unlock: "Start & Unlock Audio" }

                welcome: "Ready for your finals?",
                chooseModule: "Choose a mode to master the 127 terms",
                ui: { master: "Mastery Mode", quest: "Synergy Quest", runner: "Bio-Runner (Arcade)", score: "Score", level: "Lvl", xp: "XP", next: "Next", finish: "Done!", correct: "Great!", wrong: "Wrong!", hint: "Mnemonic:", back: "Menu", term: "TERM", unlock: "Start & Unlock Audio" }

        // AUDIO HOOK
        const useAudio = () => {
            const [muted, setMuted] = useState(false);

                musicRef.current = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-17.mp3');
                musicRef.current.loop = true; musicRef.current.volume = 0.1;
            }, []);
            const playSFX = (type) => {
                if (muted) return;
                const urls = {
                    correct: 'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3',
                    wrong: 'https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3',
                    click: 'https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3',
                    jump: 'https://assets.mixkit.co/active_storage/sfx/2007/2007-preview.mp3'
                };
                new Audio(urls[type]).play().catch(() => {});
            };
            const toggleMute = () => {
                setMuted(!muted);
                if (musicRef.current) { if (!muted) musicRef.current.pause(); else musicRef.current.play(); }
            };
            return { muted, toggleMute, playSFX, startMusic: () => musicRef.current?.play() };
        };

        // ARCADE RUNNER ENGINE
        const BioRunner = ({ lang, playSFX, onEnd }) => {
            const canvasRef = useRef(null);
            const [gameState, setGameState] = useState('playing'); // playing, question, gameover
            const [localScore, setLocalScore] = useState(0);
            const [currentQ, setCurrentQ] = useState(null);
            
            const player = useRef({ y: 150, dy: 0, jump: -8, ground: 150 });
            const obstacles = useRef([]);
            const items = useRef([]);
            const frame = useRef(0);

            const jumpAction = () => {
                if (player.current.y === player.current.ground && gameState === 'playing') {
                    player.current.dy = player.current.jump;
                    playSFX('jump');
                }
            };

            useEffect(() => {
                const handleKey = (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') jumpAction(); };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [gameState]);

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationId;

                const loop = () => {
                    if (gameState !== 'playing') return;
                    
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    frame.current++;

                    // Ground
                    ctx.fillStyle = '#1e293b';
                    ctx.fillRect(0, 180, canvas.width, 20);

                    // Player
                    player.current.dy += 0.4;
                    player.current.y += player.current.dy;
                    if (player.current.y > player.current.ground) {
                        player.current.y = player.current.ground;
                        player.current.dy = 0;
                    }
                    ctx.fillStyle = '#10b981';
                    ctx.beginPath(); ctx.arc(50, player.current.y, 10, 0, Math.PI*2); ctx.fill();

                    // Obstacles
                    if (frame.current % 100 === 0) obstacles.current.push({ x: 400, y: 155, w: 20, h: 25 });
                    obstacles.current.forEach((o, i) => {
                        o.x -= 4;
                        ctx.fillStyle = '#ef4444';
                        ctx.fillRect(o.x, o.y, o.w, o.h);
                        if (o.x < 60 && o.x > 30 && player.current.y > 140) {
                            setGameState('gameover');
                            playSFX('wrong');
                        }
                    });

                    // Items
                    if (frame.current % 150 === 0) items.current.push({ x: 400, y: 100 + Math.random()*50, collected: false });
                    items.current.forEach((it, i) => {
                        if (it.collected) return;
                        it.x -= 4;
                        ctx.fillStyle = '#fbbf24';
                        ctx.beginPath(); ctx.arc(it.x, it.y, 8, 0, Math.PI*2); ctx.fill();
                        if (it.x < 65 && it.x > 35 && Math.abs(player.current.y - it.y) < 20) {
                            it.collected = true;
                            setGameState('question');
                            playSFX('click');
                            const pool = [...DATA.reproduction, ...DATA.metabolism];
                            const target = pool[Math.floor(Math.random()*pool.length)];
                            const others = pool.filter(p => p.nl !== target.nl).sort(() => 0.5 - Math.random()).slice(0, 2);
                            setCurrentQ({ target, options: [target, ...others].sort(() => 0.5 - Math.random()) });
                        }
                    });

                    animationId = requestAnimationFrame(loop);
                };

                loop();
                return () => cancelAnimationFrame(animationId);
            }, [gameState]);

            return (
                <div className="relative w-full max-w-md mx-auto" onClick={jumpAction}>
                    <canvas ref={canvasRef} width="400" height="200" className="w-full h-auto shadow-2xl border-4 border-slate-800" />
                    
                    <div className="absolute top-4 left-4 font-black text-emerald-400 bg-slate-900/80 px-4 py-2 rounded-full text-xs flex items-center gap-2 border border-emerald-500/30">
                        <Icon name="zap" className="w-3 h-3" /> Score: {localScore}
                    </div>

                    <div className="absolute bottom-10 right-4 text-[10px] font-black text-slate-500 bg-slate-900/80 p-2 rounded-lg flex items-center gap-2 border border-slate-800">
                        <Icon name="keyboard" className="w-3 h-3" /> Space / Tap to Jump
                    </div>
                    
                    {gameState === 'question' && currentQ && (
                        <div className="absolute inset-0 bg-slate-950/95 flex flex-col items-center justify-center p-6 text-center rounded-3xl animate-in zoom-in-95 backdrop-blur-sm">
                            <span className="text-amber-500 font-black text-[10px] uppercase tracking-widest mb-2 flex items-center gap-2"><Icon name="star" className="w-3 h-3"/> Reflex Knowledge</span>
                            <h4 className="text-2xl font-black mb-6 uppercase glow-text tracking-tighter italic">{lang === 'nl' ? currentQ.target.nl : currentQ.target.en}</h4>
                            <div className="space-y-2 w-full">
                                {currentQ.options.map((o, i) => (
                                    <button key={i} onClick={(e) => { e.stopPropagation(); if(o.nl === currentQ.target.nl) { playSFX('correct'); setLocalScore(s => s + 100); setGameState('playing'); } else { playSFX('wrong'); setGameState('gameover'); } }} className="w-full bg-slate-800 p-4 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-emerald-600 transition-all border border-slate-700 active:scale-95 shadow-lg">
                                        {lang === 'nl' ? o.def_nl : o.def_en}
                                    </button>
                                ))}
                            </div>
                        </div>
                    )}

                    {gameState === 'gameover' && (
                        <div className="absolute inset-0 bg-red-950/95 flex flex-col items-center justify-center p-6 text-center rounded-3xl animate-in fade-in backdrop-blur-sm">
                            <Icon name="zap" className="w-12 h-12 text-white mb-4 animate-pulse" />
                            <h4 className="text-4xl font-black mb-2 uppercase italic text-white tracking-tighter">GAME OVER</h4>
                            <p className="text-red-200 text-[10px] mb-8 font-black uppercase tracking-widest">Logic or Reflex error detected.</p>
                            <button onClick={(e) => { e.stopPropagation(); onEnd(); }} className="bg-white text-slate-950 px-10 py-4 rounded-2xl font-black uppercase tracking-[0.2em] text-xs shadow-xl active:scale-95">Main Menu</button>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [audioUnlocked, setAudioUnlocked] = useState(false);
            const [lang, setLang] = useState('nl');
            const [view, setView] = useState('menu');
            const [activeModule, setActiveModule] = useState(null);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [score, setScore] = useState(0);
            const [xp, setXp] = useState(0);
            const [quizFinished, setQuizFinished] = useState(false);
            const [feedback, setFeedback] = useState(null); 
            const [mcqOptions, setMcqOptions] = useState([]);
            const [questStep, setQuestStep] = useState(0);
            const [activeQuest, setActiveQuest] = useState(null);

            const { muted, toggleMute, playSFX, startMusic } = useAudio();
            const t = TEXT[lang];
            const level = Math.floor(xp / 1000) + 1;

            const generateOptions = (mod, index) => {
                const current = DATA[mod][index];
                const others = DATA[mod].filter((_, i) => i !== index).sort(() => 0.5 - Math.random()).slice(0, 3);
                return [current, ...others].sort(() => 0.5 - Math.random());
            };

            const startMasterMode = (mod) => {
                playSFX('click'); setActiveModule(mod); setCurrentIndex(0); setScore(0); setQuizFinished(false); setFeedback(null); setMcqOptions(generateOptions(mod, 0)); setView('master');
            };

            const handleMasterAnswer = (selectedObj) => {
                const current = DATA[activeModule][currentIndex];
                if (selectedObj.nl === current.nl) {
                    playSFX('correct'); setScore(score + 1); setXp(xp + 100); setFeedback({ correct: true, msg: t.ui.correct });
                    setTimeout(() => {
                        setFeedback(null);
                        if (currentIndex < DATA[activeModule].length - 1) {
                            const nxt = currentIndex + 1; setCurrentIndex(nxt); setMcqOptions(generateOptions(activeModule, nxt));
                        } else setQuizFinished(true);

                } else {

            };

                const target = activeQuest.steps[questStep];

                    playSFX('correct'); setScore(score + 10); setQuestStep(questStep + 1);
                    if (questStep === activeQuest.steps.length - 1) setQuizFinished(true);

                    playSFX('wrong');

            return (

                                <Icon name={muted ? "mute" : "volume"} className={muted ? "text-red-400" : "text-emerald-400"} />
                            </button>
                            <button onClick={() => { playSFX('click'); setLang(lang === 'nl' ? 'en' : 'nl'); }} className="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl border border-slate-700 font-black text-xs uppercase tracking-widest active:scale-90">{lang}</button>

                                        </div>
                                        <button onClick={() => { playSFX('click'); setView('runner'); }} className="bg-amber-600 hover:bg-amber-500 py-4 rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg active:translate-y-1">Play Arcade</button>

                                            <div className="bg-emerald-600/20 p-4 rounded-2xl text-emerald-400"><Icon name="star" /></div>

                                    </div>

                                    <MenuCard icon="leaf" title={lang === 'nl' ? "H5: Metabolism" : "Ch5: Metabolism"} desc="Vocabulary Drills" onStart={() => startMasterMode('metabolism')} btnText={t.ui.master} />
                                </div>
                            </div>
                        )}

                        {view === 'runner' && <BioRunner lang={lang} playSFX={playSFX} onEnd={() => setView('menu')} />}

                        {view === 'quest' && !quizFinished && (
                            <div className="space-y-6 animate-in slide-in-from-right-4">
                                <div className="flex justify-between items-center mb-2 px-2"><button onClick={() => setView('menu')} className="text-slate-400 hover:text-white flex items-center gap-2 font-black text-sm active:scale-95"><Icon name="home" className="w-4 h-4"/> {t.ui.back}</button><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Score: {score}</span></div>
                                <div className="bg-slate-900 border-2 border-emerald-500/50 rounded-[2.5rem] p-8 relative shadow-2xl">
                                    <h3 className="text-2xl font-black mb-4 uppercase italic tracking-tighter text-emerald-400">Knowledge Chain</h3>
                                    <div className="flex flex-wrap gap-2 mb-8 min-h-[120px] items-center justify-center p-6 bg-slate-950/80 rounded-[2rem] border border-slate-800 shadow-inner">
                                        {activeQuest.steps.slice(0, questStep).map((s, i) => <span key={i} className="bg-emerald-600/40 text-emerald-300 px-4 py-2 rounded-full text-[10px] font-black uppercase tracking-widest animate-in zoom-in-50 border border-emerald-500/20">{s}</span>)}
                                        <div className="w-10 h-10 border-2 border-dashed border-emerald-500 rounded-full flex items-center justify-center animate-pulse text-emerald-500 font-black">?</div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        {activeQuest.steps.filter(s => !activeQuest.steps.slice(0, questStep).includes(s)).sort(() => 0.5 - Math.random()).slice(0, 4).map((choice, i) => (
                                            <button key={i} onClick={() => handleQuestStep(choice)} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-5 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all shadow-md active:scale-95">{choice}</button>
                                        ))}

                                </div>

                                        <p className="mt-2 bg-slate-950/50 p-4 rounded-2xl border border-red-500/30 text-xs italic font-medium leading-relaxed">{t.ui.hint} "{feedback.hint}"</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'master' && !quizFinished && (
                            <div className="space-y-6 animate-in slide-in-from-right-4 duration-300">
                                <div className="flex justify-between items-center mb-2 px-2"><button onClick={() => setView('menu')} className="text-slate-400 hover:text-white flex items-center gap-2 font-black text-sm active:scale-95"><Icon name="home" className="w-4 h-4"/> {t.ui.back}</button><span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{currentIndex + 1} / {DATA[activeModule].length}</span></div>
                                <div className="bg-slate-900 border border-slate-800 rounded-[2.5rem] p-10 relative overflow-hidden shadow-2xl text-center">
                                    <div className="absolute top-0 left-0 w-full h-2 bg-slate-800"><div className="h-full bg-emerald-500 transition-all duration-500 shadow-[0_0_10px_#10b981]" style={{ width: `${((currentIndex) / DATA[activeModule].length) * 100}%` }}></div></div>
                                    <span className="text-emerald-500 font-black uppercase text-[10px] tracking-[0.4em] mb-4 block opacity-60 underline decoration-emerald-500/20 underline-offset-8">{t.ui.term}</span>
                                    <h3 className="text-4xl font-black leading-tight tracking-tighter uppercase italic glow-text mb-10">{lang === 'nl' ? DATA[activeModule][currentIndex].nl : DATA[activeModule][currentIndex].en}</h3>
                                    <div className="space-y-3">
                                        {mcqOptions.map((opt, idx) => (
                                            <button key={idx} disabled={!!feedback && feedback.correct} onClick={() => handleMasterAnswer(opt)} className={`w-full text-left p-6 rounded-[1.5rem] border-2 transition-all font-black text-[11px] uppercase tracking-widest shadow-md ${!feedback ? 'border-slate-800 bg-slate-800/40 hover:border-emerald-500 active:scale-[0.98]' : opt.nl === DATA[activeModule][currentIndex].nl ? 'border-emerald-500 bg-emerald-500/20 shadow-emerald-500/20 pulse-emerald' : 'border-slate-800 opacity-40'}`}>
                                                {lang === 'nl' ? opt.def_nl : opt.def_en}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                                {feedback && (
                                    <div className={`p-6 rounded-3xl shadow-2xl border-2 animate-in slide-in-from-bottom-10 backdrop-blur-md ${feedback.correct ? 'bg-emerald-600/90 border-emerald-400' : 'bg-slate-900/95 border-red-500'}`}>
                                        <div className="flex items-center gap-4">{feedback.correct ? <Icon name="zap" className="animate-bounce" /> : <Icon name="lightbulb" className="text-red-400 animate-pulse" />}<p className="font-black text-lg uppercase tracking-tight">{feedback.msg}</p></div>
                                        {!feedback.correct && <p className="mt-2 bg-slate-950/50 p-4 rounded-2xl border border-red-500/30 text-xs italic font-medium leading-relaxed">{t.ui.hint} "{feedback.hint}"</p>}
                                    </div>
                                )}
                            </div>
                        )}

                        {quizFinished && (
                            <div className="text-center bg-slate-900 border border-slate-800 rounded-[3.5rem] p-16 shadow-2xl animate-in zoom-in-95 backdrop-blur-sm">
                                <Icon name="trophy" className="mx-auto w-24 h-24 text-yellow-500 mb-8 drop-shadow-2xl" />
                                <h2 className="text-5xl font-black mb-4 uppercase italic glow-text tracking-tighter">SUCCESS!</h2>
                                <p className="text-slate-500 font-black mb-12 text-xs uppercase tracking-[0.3em]">Module Beheerst • BioMaster Level Up</p>
                                <button onClick={() => { playSFX('click'); setView('menu'); }} className="w-full bg-white text-slate-950 py-6 rounded-3xl font-black uppercase tracking-widest text-sm shadow-xl active:scale-95 transition-all">RESTART QUEST</button>
                            </div>
                        )}
                    </main>
                    <footer className="mt-12 text-[10px] text-slate-800 font-black uppercase tracking-[0.5em] opacity-40 text-center w-full">Synthesis v12 • 127 terms • study hard</footer>
                </div>
            );
        };

        const MenuCard = ({ icon, title, desc, onStart, btnText }) => (
            <div className="bg-slate-900 border border-slate-800 rounded-[2rem] p-6 hover:border-emerald-500/50 transition-all flex flex-col sm:flex-row items-center justify-between gap-4 shadow-xl">
                <div className="flex items-center gap-4 text-center sm:text-left">
                    <div className="bg-slate-800 p-5 rounded-[1.5rem] text-emerald-400 shadow-inner"><Icon name={icon} className="w-6 h-6"/></div>
                    <div><h3 className="text-xl font-black uppercase italic tracking-tighter leading-none mb-1">{title}</h3><p className="text-slate-500 text-[10px] font-black uppercase tracking-widest">{desc}</p></div>
                </div>
                <button onClick={onStart} className="bg-slate-800 hover:bg-slate-700 border border-slate-700 px-8 py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest transition-all shadow-lg active:translate-y-1">{btnText}</button>
            </div>
        );

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
